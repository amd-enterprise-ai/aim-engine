# 2-GPU MI300X preview throughput profile.
# Not in recommendedDeployments, so primary=false and manual_selection_only=true.
# Exercises the "unmatched profile" branch of primary resolution.
aim_id: HuggingFaceTB/SmolLM2-135M
model_id: HuggingFaceTB/SmolLM2-135M
metadata:
  engine: vllm
  accelerator_type: gpu
  accelerator_model: MI300X
