# Optimized for throughput on MI325X using fp8 precision.
# Explicit profileId match in recommendedDeployments, so primary=true.
aim_id: HuggingFaceTB/SmolLM2-135M
model_id: HuggingFaceTB/SmolLM2-135M
metadata:
  engine: vllm
  accelerator_type: gpu
  accelerator_model: MI325X
  accelerator_count: 1
  metric: throughput
  precision: fp8
  type: optimized
  manual_selection_only: false
engine_args:
  tensor-parallel-size: 1
  max-num-seqs: 256
env_vars:
  HIP_FORCE_DEV_KERNARG: "1"
  VLLM_DO_NOT_TRACK: "1"
