name: compile-release

on:
  push:
    tags:
      - "v*"
      - "*int-test"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3). Falls back to tag if empty.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

# Opt JavaScript actions onto Node 24 ahead of GitHub's June 16, 2026 default
# flip. See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compile-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      chart_version: ${{ steps.ver.outputs.chart_version }}
    env:
      BUILD_IMAGES: ${{ vars.BUILD_IMAGES }}
      PUSH_IMAGE_REPO: ${{ vars.PUSH_IMAGE_REPO }}
      PULL_IMAGE_REPO: ${{ vars.PULL_IMAGE_REPO }}
      # Image repo baked into the published Helm chart's values.yaml. Falls back
      # to a fork-aware default so the workflow works without per-repo Actions
      # vars. Both forks point at the public docker.io/amdenterpriseai mirror
      # that end users actually pull from; silogen-internal builds push the
      # operator image to docker.io/silogenai (private) but the *chart* shipped
      # to GitHub Releases keeps the public mirror reference so consumers of a
      # release tarball don't need DockerHub-private credentials.
      CHART_IMAGE_REPO: ${{ vars.CHART_IMAGE_REPO || 'docker.io/amdenterpriseai/aim-engine' }}
      # OCI registry that receives the packaged Helm + CRDs charts. Both
      # forks publish to DockerHub: silogen -> silogenai (private), everyone
      # else -> amdenterpriseai (public). The Actions var always overrides.
      CHART_OCI_REPO: ${{ vars.CHART_OCI_REPO || (github.repository_owner == 'silogen' && 'oci://registry-1.docker.io/silogenai' || 'oci://registry-1.docker.io/amdenterpriseai') }}
      CHART_NAME: aim-engine-chart
      # Static OCI chart version for integration tests (operator image tag stays dynamic via values).
      INT_TEST_CHART_VERSION: "0.0.0-int-test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Determine version
        id: ver
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          CHART_VERSION="${VERSION#v}"
          SHORT_SHA="${GITHUB_SHA::7}"
          # Int-test charts have a static name (INT_TEST_CHART_VERSION) but need a
          # unique image tag per build so kubelet's IfNotPresent re-pulls on upgrade
          # even when the int-test git tag is reused. Real releases keep the bare
          # VERSION as the image tag.
          INT_TEST_IMAGE_TAG="${VERSION}-${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "INT_TEST_IMAGE_TAG=${INT_TEST_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "int_test_image_tag=${INT_TEST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}, chart version: ${CHART_VERSION}, int-test image tag: ${INT_TEST_IMAGE_TAG}"

      - name: Log in to DockerHub
        if: env.BUILD_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_PUSH_USER }}
          password: ${{ secrets.DOCKER_HUB_PUSH }}

      - name: Build and push Docker image
        if: env.BUILD_IMAGES == 'true'
        run: |
          # Bake the PUBLIC docker.io/amdenterpriseai artifact-downloader default
          # (the Dockerfile default) into the binary, NOT the private silogenai
          # one. This image is later promoted byte-for-byte to amdenterpriseai,
          # so its compiled-in downloader ref must be publicly pullable for
          # end users with no silogen credentials. Pre-promotion silogen tests
          # point download Jobs back at docker.io/silogenai at *install* time via
          # --set manager.artifactDownloaderImage (see the test-release job).
          make docker-build \
            IMG=${PUSH_IMAGE_REPO}:${VERSION} \
            TAG=${VERSION}
          make docker-push IMG=${PUSH_IMAGE_REPO}:${VERSION}
          # Also tag and push with a SHA-suffixed tag so the static-name
          # int-test chart (packaged below) has an immutable image reference
          # that changes on every build, even when the int-test git tag is
          # reused.
          docker tag ${PUSH_IMAGE_REPO}:${VERSION} ${PUSH_IMAGE_REPO}:${INT_TEST_IMAGE_TAG}
          docker push ${PUSH_IMAGE_REPO}:${INT_TEST_IMAGE_TAG}

      - name: Verify image exists
        if: env.BUILD_IMAGES != 'true'
        run: |
          echo "Verifying image ${PULL_IMAGE_REPO}:${VERSION} is available..."
          docker pull ${PULL_IMAGE_REPO}:${VERSION}

      - name: Generate CRDs
        run: make crds

      - name: Package Helm chart
        run: |
          make helm-package \
            CHART_VERSION=${CHART_VERSION} \
            CHART_IMAGE_REPO=${CHART_IMAGE_REPO} \
            CHART_IMAGE_TAG=${VERSION} \
            TAG=${VERSION}

      - name: Validate chart with helm template
        run: helm template aim-engine ./dist/chart > /dev/null

      - name: Lint Helm chart
        run: helm lint ./dist/chart

      - name: Package CRDs as Helm chart
        run: |
          make crds-package CHART_VERSION=${CHART_VERSION} TAG=${VERSION}

      - name: Generate install.yaml
        run: |
          make build-installer IMG=${PULL_IMAGE_REPO}:${VERSION}

      - name: Log in to DockerHub (Helm/OCI)
        if: env.BUILD_IMAGES == 'true'
        run: echo "${{ secrets.DOCKER_HUB_PUSH }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKER_HUB_PUSH_USER }}" --password-stdin

      - name: Push Helm chart to OCI registry
        if: env.BUILD_IMAGES == 'true'
        run: |
          # CHART_OCI_REPO env (above) already carries the full destination
          # (e.g. oci://registry-1.docker.io/silogenai), so override the
          # CHART_OCI_OWNER fallback path entirely via CHART_OCI_REPO.
          make helm-push-oci CHART_VERSION=${CHART_VERSION} CHART_OCI_REPO=${CHART_OCI_REPO}

      - name: Push CRDs chart to OCI registry
        if: env.BUILD_IMAGES == 'true'
        run: |
          make crds-push-oci CHART_VERSION=${CHART_VERSION} CHART_OCI_REPO=${CHART_OCI_REPO}

      - name: Push Helm and CRDs charts to OCI (${{ env.INT_TEST_CHART_VERSION }} for integration tests)
        if: env.BUILD_IMAGES == 'true'
        run: |
          # The int-test chart has a static name so consumers can always
          # `helm pull` the same version. To make `helm upgrade` actually roll
          # the deployment, point the chart's image at the SHA-suffixed tag
          # pushed alongside the bare VERSION tag in the build step.
          # CHART_IMAGE_REPO is set to PUSH_IMAGE_REPO (where the image
          # actually lives) rather than the public mirror used for real
          # releases, since int-test images aren't mirrored.
          cp -a dist/chart "/tmp/aim-engine-dist-chart-${GITHUB_RUN_ID}"
          make helm-package \
            CHART_VERSION=${INT_TEST_CHART_VERSION} \
            CHART_IMAGE_REPO=${PUSH_IMAGE_REPO} \
            CHART_IMAGE_TAG=${INT_TEST_IMAGE_TAG} \
            TAG=${VERSION}
          make helm-push-oci CHART_VERSION=${INT_TEST_CHART_VERSION} CHART_OCI_REPO=${CHART_OCI_REPO}
          make crds-package CHART_VERSION=${INT_TEST_CHART_VERSION} TAG=${VERSION}
          make crds-push-oci CHART_VERSION=${INT_TEST_CHART_VERSION} CHART_OCI_REPO=${CHART_OCI_REPO}
          rm -rf dist/chart
          cp -a "/tmp/aim-engine-dist-chart-${GITHUB_RUN_ID}" dist/chart
          rm -rf "/tmp/aim-engine-dist-chart-${GITHUB_RUN_ID}"

      - name: Upload install.yaml artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-yaml
          path: dist/install.yaml

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz

      - name: Upload CRDs artifact
        uses: actions/upload-artifact@v4
        with:
          name: crds-yaml
          path: dist/crds.yaml

      - name: Upload CRDs chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: crds-chart
          path: dist/aim-engine-crds-chart-${{ env.CHART_VERSION }}.tgz

      - name: Build release notes
        run: |
          # Build the release body in two pieces: an optional silogen-only
          # block explaining how to install the silogenai-OCI chart before
          # manual image promotion has run, followed by the standard
          # post-promotion install instructions. Quoted heredocs keep the
          # markdown verbatim (backticks, `$`); env-driven values are
          # substituted via sed afterwards.
          {
            if [ "${BUILD_IMAGES}" = "true" ]; then
              cat <<'INNER_EOF'
          ### Internal install (pre-promotion, silogenai)

          The chart's baked-in `manager.image.repository` points at the public
          `docker.io/amdenterpriseai/aim-engine`, which only carries this
          version *after* the manual silogenai → amdenterpriseai image
          promotion has run. The operator binary likewise bakes the public
          `docker.io/amdenterpriseai/aim-artifact-downloader` default. To
          install **before** promotion, provision a `dockerhub-regcred` pull
          secret in the install namespace (skip if it is already present) and
          override both the operator image and the artifact-downloader image to
          point at the private silogenai org.

          ```bash
          kubectl create namespace aim-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-regcred \
            --namespace aim-system \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=<dockerhub-user> \
            --docker-password=<dockerhub-token>

          helm install aim-engine __CHART_OCI_REPO__/aim-engine-chart \
            --version __CHART_VERSION__ \
            --namespace aim-system --create-namespace \
            --set manager.image.repository=docker.io/silogenai/aim-engine \
            --set manager.imagePullSecrets[0].name=dockerhub-regcred \
            --set manager.artifactDownloaderImage=docker.io/silogenai/aim-artifact-downloader:__VERSION__
          ```

          The attached `install.yaml` already references
          `docker.io/silogenai/aim-engine:__VERSION__` directly, but the
          operator binary still bakes the public downloader default. Until
          promotion, prefer the Helm install above (which overrides
          `manager.artifactDownloaderImage`), or patch the controller-manager
          Deployment to add an `AIM_ARTIFACT_DOWNLOADER_IMAGE=docker.io/silogenai/aim-artifact-downloader:__VERSION__`
          env var so download Jobs resolve against the private silogenai org.

          Because these download Jobs run in your workload namespace, pulling the
          private artifact-downloader image requires node-level (containerd)
          registry credentials configured on each node.

          ---

          INNER_EOF
            fi

            cat <<'INNER_EOF'
          ## Installation

          ### Quick Install (kubectl)
          ```bash
          kubectl apply -f https://github.com/__GITHUB_REPOSITORY__/releases/download/__VERSION__/install.yaml --server-side
          ```

          ### Helm Install

          CRDs are distributed separately and must be installed first:

          ```bash
          # 1a. Install CRDs via Helm OCI (recommended)
          helm install aim-engine-crds __CHART_OCI_REPO__/aim-engine-crds-chart \
            --version __CHART_VERSION__
          ```

          ```bash
          # 1b. Or install CRDs from manifest
          kubectl apply -f https://github.com/__GITHUB_REPOSITORY__/releases/download/__VERSION__/crds.yaml
          kubectl wait --for=condition=Established crd --all --timeout=60s
          ```

          ```bash
          # 2a. Install operator via Helm OCI (recommended)
          helm install aim-engine __CHART_OCI_REPO__/aim-engine-chart \
            --version __CHART_VERSION__ \
            --namespace aim-system --create-namespace
          ```

          ```bash
          # 2b. Or install from GitHub Releases tarball
          curl -L https://github.com/__GITHUB_REPOSITORY__/releases/download/__VERSION__/aim-engine-chart-__CHART_VERSION__.tgz -o aim-engine.tgz
          helm install aim-engine aim-engine.tgz --namespace aim-system --create-namespace
          ```

          ### Docker Images
          - Operator: `__CHART_IMAGE_REPO__:__VERSION__`
          INNER_EOF
          } > release-notes.template

          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__CHART_VERSION__|${CHART_VERSION}|g" \
            -e "s|__CHART_OCI_REPO__|${CHART_OCI_REPO}|g" \
            -e "s|__CHART_IMAGE_REPO__|${CHART_IMAGE_REPO}|g" \
            -e "s|__GITHUB_REPOSITORY__|${{ github.repository }}|g" \
            release-notes.template > release-notes.md

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.yaml
            dist/crds.yaml
            dist/${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz
            dist/aim-engine-crds-chart-${{ env.CHART_VERSION }}.tgz
          token: '${{ secrets.GITHUB_TOKEN }}'
          draft: true
          prerelease: true
          body_path: release-notes.md

      - name: Create or update artifacts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch
          git checkout --orphan artifacts-temp || true

          # Clear the index
          git rm -rf --cached . || true

          # Add the chart directory
          mkdir -p chart
          cp -r dist/chart/* chart/
          git add chart/

          # Add the crd directory with crds.yaml as separate file (distributed independently)
          mkdir -p crd
          cp dist/crds.yaml crd/crds.yaml
          git add crd/crds.yaml

          # Build the README in two pieces: an optional silogen-only block
          # explaining the pre-promotion override, followed by the standard
          # install instructions. Same template+sed pattern as release notes.
          {
            cat <<'INNER_EOF'
          # aim-engine

          This branch contains the auto-generated Helm chart and CRDs for aim-engine.

          ## Installation

          INNER_EOF

            if [ "${BUILD_IMAGES}" = "true" ]; then
              cat <<'INNER_EOF'
          ### Internal install (pre-promotion, silogenai)

          The chart's `manager.image.repository` defaults to the public
          `docker.io/amdenterpriseai/aim-engine`, populated only after the
          manual silogenai → amdenterpriseai image promotion. The operator
          binary likewise bakes the public artifact-downloader default. To
          install pre-promotion, provision a `dockerhub-regcred` pull secret in
          the install namespace (skip if it is already present) and override
          both the operator image and the artifact-downloader image:

          ```bash
          kubectl create namespace aim-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-regcred \
            --namespace aim-system \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=<dockerhub-user> \
            --docker-password=<dockerhub-token>

          helm install aim-engine ./chart \
            --namespace aim-system --create-namespace \
            --set manager.image.repository=docker.io/silogenai/aim-engine \
            --set manager.imagePullSecrets[0].name=dockerhub-regcred \
            --set manager.artifactDownloaderImage=docker.io/silogenai/aim-artifact-downloader:__VERSION__
          ```

          Because the download Jobs run in your workload namespace, pulling the
          private artifact-downloader image requires node-level (containerd)
          registry credentials configured on each node.

          ---

          INNER_EOF
            fi

            cat <<'INNER_EOF'
          CRDs are distributed separately and must be installed first:

          ```bash
          # 1. Install CRDs
          kubectl apply -f https://raw.githubusercontent.com/__GITHUB_REPOSITORY__/artifacts/crd/crds.yaml
          kubectl wait --for=condition=Established crd --all --timeout=60s

          # 2a. Install operator via Helm OCI (recommended)
          helm install aim-engine __CHART_OCI_REPO__/aim-engine-chart \
            --version __CHART_VERSION__ \
            --namespace aim-system --create-namespace

          # 2b. Or install from this branch
          helm install aim-engine ./chart --namespace aim-system --create-namespace
          ```

          Or clone this branch:

          ```bash
          git clone -b artifacts https://github.com/__GITHUB_REPOSITORY__.git aim-engine
          cd aim-engine

          kubectl apply -f crd/crds.yaml
          kubectl wait --for=condition=Established crd --all --timeout=60s
          helm install aim-engine ./chart --namespace aim-system --create-namespace
          ```

          ## Source

          Generated from tag: __VERSION__ (commit: __GITHUB_SHA__)
          INNER_EOF
          } > README.md.template

          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__CHART_VERSION__|${CHART_VERSION}|g" \
            -e "s|__CHART_OCI_REPO__|${CHART_OCI_REPO}|g" \
            -e "s|__GITHUB_REPOSITORY__|${{ github.repository }}|g" \
            -e "s|__GITHUB_SHA__|${{ github.sha }}|g" \
            README.md.template > README.md
          rm -f README.md.template
          git add README.md

          # Commit
          git commit -m "Release ${VERSION}" --allow-empty

          # Force push to artifacts branch
          git push origin HEAD:artifacts --force

  test-release:
    name: test-release
    runs-on: self-hosted
    needs: compile-release
    timeout-minutes: 60
    concurrency:
      group: compile-release-test-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.compile-release.outputs.version }}
      CHART_VERSION: ${{ needs.compile-release.outputs.chart_version }}
      PULL_IMAGE_REPO: ${{ vars.PULL_IMAGE_REPO }}
      PUSH_IMAGE_REPO: ${{ vars.PUSH_IMAGE_REPO }}
      BUILD_IMAGES: ${{ vars.BUILD_IMAGES }}
      CHART_OCI_REPO: ${{ vars.CHART_OCI_REPO || (github.repository_owner == 'silogen' && 'oci://registry-1.docker.io/silogenai' || 'oci://registry-1.docker.io/amdenterpriseai') }}
      # aim-dummy test image: built locally and kind-loaded under the exact public
      # ref the e2e fixtures reference. Keep in sync with the Makefile and
      # test-e2e.yml AIM_DUMMY_TAG.
      AIM_DUMMY_TAG: "0.2.0"
      KIND_CLUSTER: aim-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "After cleanup:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner specs
        run: |
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Arch: ${RUNNER_ARCH}"
          echo "CPU count:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

      - name: Setup mise
        uses: jdx/mise-action@v2
        env:
          MISE_LOCAL_CONFIG_ALLOWED: "0"

      - name: Set per-run kubeconfig path
        run: echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Create Kind cluster
        run: kind create cluster --name "${KIND_CLUSTER}" --config hack/kind/config.yaml

      - name: Install Kind dependencies (NFS provisioner)
        run: helmfile sync -f hack/kind/helmfile.yaml.gotmpl

      - name: Verify NFS server and CSI driver readiness
        run: |
          echo "--- Waiting for NFS server pod ---"
          kubectl wait --for=condition=Ready --timeout=180s pod -l app=nfs-server -n nfs-system

          echo "--- Waiting for csi-driver-nfs controller ---"
          kubectl rollout status deployment/csi-nfs-controller -n kube-system --timeout=180s

          echo "--- Waiting for csi-driver-nfs node DaemonSet ---"
          kubectl rollout status daemonset/csi-nfs-node -n kube-system --timeout=180s

          echo "--- Verifying default StorageClass ---"
          NFS_DEFAULT="$(kubectl get storageclass nfs -o jsonpath='{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}')"
          if [ "${NFS_DEFAULT}" != "true" ]; then
            echo "Expected storageclass 'nfs' to be default but got '${NFS_DEFAULT}'"
            kubectl get storageclass -o wide
            exit 1
          fi

          echo "--- RWX PVC smoke test ---"
          kubectl create namespace storage-smoke --dry-run=client -o yaml | kubectl apply -f -
          cat <<'EOF' | kubectl apply -n storage-smoke -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: nfs-smoke-pvc
          spec:
            storageClassName: nfs
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: 1Mi
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Bound --timeout=180s pvc/nfs-smoke-pvc -n storage-smoke
          kubectl delete namespace storage-smoke --wait=false

      - name: Install core dependencies
        run: |
          # Use an isolated Helm registry/config cache to avoid stale registry
          # credentials on self-hosted runners interfering with public OCI pulls
          # made by helmfile here. The DockerHub login for the silogenai chart
          # pull happens later, against the runner-default helm config.
          export HELM_CACHE_HOME="${RUNNER_TEMP}/helm/cache"
          export HELM_CONFIG_HOME="${RUNNER_TEMP}/helm/config"
          export HELM_DATA_HOME="${RUNNER_TEMP}/helm/data"
          export HELM_REGISTRY_CONFIG="${RUNNER_TEMP}/helm/registry/config.json"
          mkdir -p "${HELM_CACHE_HOME}" "${HELM_CONFIG_HOME}" "${HELM_DATA_HOME}" "$(dirname "${HELM_REGISTRY_CONFIG}")"
          echo '{}' > "${HELM_REGISTRY_CONFIG}"
          for i in 1 2 3; do
            helmfile sync -f hack/dependencies/helmfile.yaml.gotmpl && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the aim-dummy test image locally (no registry pull) and kind-load
      # it under the exact public ref the e2e fixtures reference.
      - name: Build aim-dummy test image
        uses: docker/build-push-action@v6
        with:
          context: images/aim-dummy
          load: true
          tags: docker.io/amdenterpriseai/aim-dummy:${{ env.AIM_DUMMY_TAG }}
          cache-from: type=gha,scope=aim-dummy
          cache-to: type=gha,scope=aim-dummy,mode=max

      - name: Load aim-dummy image into Kind
        run: kind load docker-image "docker.io/amdenterpriseai/aim-dummy:${AIM_DUMMY_TAG}" --name "${KIND_CLUSTER}"

      - name: Load artifact-downloader image into Kind
        if: env.BUILD_IMAGES == 'true'
        run: |
          echo "${{ secrets.DOCKER_HUB_PULL }}" | docker login docker.io -u "${{ secrets.DOCKER_HUB_PULL_USER }}" --password-stdin
          docker pull "docker.io/silogenai/aim-artifact-downloader:${VERSION}"
          kind load docker-image "docker.io/silogenai/aim-artifact-downloader:${VERSION}" --name "${KIND_CLUSTER}"

      - name: Create aim-system namespace
        run: kubectl create namespace aim-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Create DockerHub dockerhub-regcred in aim-system
        if: env.BUILD_IMAGES == 'true'
        run: |
          # The operator image lives in the private silogenai DockerHub org.
          # Provision a dockerconfigjson secret so kubelet can actually pull
          # what compile-release just pushed — exercising the full release
          # artifact end-to-end rather than side-loading via kind. Named
          # `dockerhub-regcred` to match the standard secret pre-provisioned
          # on silogen-managed clusters.
          kubectl create secret docker-registry dockerhub-regcred \
            --namespace aim-system \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_HUB_PULL_USER }}" \
            --docker-password="${{ secrets.DOCKER_HUB_PULL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Initialize SeaweedFS bucket
        run: make seaweedfs-init-bucket

      - name: Log in to DockerHub (Helm/OCI)
        if: env.BUILD_IMAGES == 'true'
        # Pull-only credentials -- this stage only consumes charts.
        run: echo "${{ secrets.DOCKER_HUB_PULL }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKER_HUB_PULL_USER }}" --password-stdin

      - name: Install CRDs via Helm OCI
        run: |
          helm install aim-engine-crds ${CHART_OCI_REPO}/aim-engine-crds-chart \
            --version ${CHART_VERSION}

      - name: Wait for AIM CRDs to be Established
        run: |
          set -euo pipefail
          mapfile -t crds < <(kubectl get crd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep '\.aim\.eai\.amd\.com$' || true)
          if [ "${#crds[@]}" -eq 0 ]; then
            echo "No aim.eai.amd.com CRDs found after CRDs chart install"
            kubectl get crd | head -50
            exit 1
          fi
          for crd in "${crds[@]}"; do
            echo "Waiting for Established: ${crd}"
            kubectl wait --for=condition=Established "crd/${crd}" --timeout=180s
          done

      - name: Apply default cluster runtime config
        run: kubectl apply -f hack/default-cluster-runtime-config.yaml

      - name: Pre-warm S3 artifact cache
        run: make cache-warm

      - name: Create DockerHub pull secret for operator image
        if: env.BUILD_IMAGES == 'true'
        # The silogen build pushes the operator image to docker.io/silogenai
        # (private), so the Kind cluster needs a docker-registry secret to
        # pull. The amd-enterprise-ai path pulls from the public
        # docker.io/amdenterpriseai mirror and does not need this.
        run: |
          kubectl -n aim-system create secret docker-registry regcred \
            --docker-server=docker.io \
            --docker-username="${{ secrets.DOCKER_HUB_PULL_USER }}" \
            --docker-password="${{ secrets.DOCKER_HUB_PULL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install operator via Helm OCI
        run: |
          # Override image.repository/tag to point at the just-pushed build,
          # bypassing any public-mirror PULL_IMAGE_REPO baked into the chart.
          # Inject the regcred imagePullSecret so the Kind cluster can pull
          # the private docker.io/silogenai operator image.
          # The operator binary bakes the PUBLIC downloader default, which is not
          # promoted to amdenterpriseai yet at this point. Override it back to the
          # just-pushed silogenai downloader so pre-promotion download Jobs pull
          # from the private mirror the regcred secret covers.
          HELM_SET_ARGS=""
          if [ "${BUILD_IMAGES}" = "true" ]; then
            HELM_SET_ARGS="--set manager.image.repository=${PUSH_IMAGE_REPO} \
              --set manager.image.tag=${VERSION} \
              --set manager.imagePullSecrets[0].name=regcred \
              --set manager.artifactDownloaderImage=docker.io/silogenai/aim-artifact-downloader:${VERSION}"
          fi
          helm install aim-engine ${CHART_OCI_REPO}/aim-engine-chart \
            --version ${CHART_VERSION} \
            --namespace aim-system \
            --set acceleratorDetector.enable=false \
            ${HELM_SET_ARGS}

      - name: Wait for operator to be ready
        run: kubectl wait --for=condition=Available --timeout=120s deployment/aim-engine-controller-manager -n aim-system

      - name: Wait for scale-from-zero collector to be ready
        # The collector now ships with the chart (replaces the old
        # install-scale-from-zero-prereq step). Wait for the OTel Operator to
        # reconcile it before chainsaw scale-from-zero tests.
        run: |
          set -euo pipefail
          COLLECTOR_DEPLOY=aim-engine-kgateway-metrics-collector
          for i in $(seq 1 24); do
            if kubectl -n aim-system get deploy "${COLLECTOR_DEPLOY}" >/dev/null 2>&1; then
              kubectl -n aim-system rollout status "deploy/${COLLECTOR_DEPLOY}" --timeout=120s
              exit 0
            fi
            echo "Waiting for OTel Operator to create ${COLLECTOR_DEPLOY} ($i/24)..."
            sleep 5
          done
          echo "scale-from-zero collector deployment never appeared" >&2
          kubectl -n aim-system get opentelemetrycollectors,deploy 2>&1 || true
          exit 1

      - name: Verify operator reconciles (status subresource smoke)
        run: |
          set -euo pipefail
          NS=aim-engine-reconcile-smoke
          kubectl delete namespace "${NS}" --ignore-not-found --wait=true --timeout=120s || true
          kubectl create namespace "${NS}"
          trap 'kubectl delete namespace "${NS}" --ignore-not-found --wait=false 2>/dev/null || true' EXIT
          cat <<EOF | kubectl apply -n "${NS}" -f -
          apiVersion: aim.eai.amd.com/v1alpha1
          kind: AIMModel
          metadata:
            name: reconcile-smoke-model
          spec:
            image: docker.io/amdenterpriseai/aim-dummy:${AIM_DUMMY_TAG}
            discovery:
              extractMetadata: false
              createServiceTemplates: false
          EOF
          echo "Waiting for AIMModel status (proves manager RBAC + reconciliation)..."
          ok=
          for i in $(seq 1 90); do
            st="$(kubectl get aimmodel reconcile-smoke-model -n "${NS}" -o jsonpath='{.status}' 2>/dev/null || true)"
            if [ -n "${st}" ] && [ "${st}" != "null" ]; then
              echo "Got .status after ${i}s"
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "${ok}" ]; then
            echo "FAIL: AIMModel never received .status — operator is not reconciling or cannot patch status."
            echo "=== AIMModel yaml ==="
            kubectl get aimmodel reconcile-smoke-model -n "${NS}" -o yaml || true
            echo "=== Operator logs (last 200 lines) ==="
            kubectl logs -n aim-system -l control-plane=controller-manager --tail=200 || true
            echo "=== Operator pod describe ==="
            kubectl describe pods -n aim-system -l control-plane=controller-manager || true
            exit 1
          fi

      - name: Debug operator status
        if: always()
        run: |
          echo "=== Operator Deployment ==="
          kubectl get deployment -n aim-system
          echo "=== Operator Pods ==="
          kubectl get pods -n aim-system
          echo "=== Operator Pod Describe ==="
          kubectl describe pods -n aim-system -l control-plane=controller-manager || true
          echo "=== Operator Logs (last 50 lines) ==="
          kubectl logs -n aim-system -l control-plane=controller-manager --tail=50 || true
          echo "=== CRDs ==="
          kubectl get crds | grep aim || true

      - name: Run Chainsaw tests
        run: make test-chainsaw-kind

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Operator Logs (full) ==="
          kubectl logs -n aim-system -l control-plane=controller-manager --tail=200 || true
          echo "=== All AIM resources ==="
          kubectl get aimservice,aimmodel,aimtemplatecache,aimartifact -A || true
          echo "=== Pods across all namespaces ==="
          kubectl get pods -A || true
          echo "=== Non-running pods ==="
          kubectl get pods -A --field-selector 'status.phase!=Running,status.phase!=Succeeded' || true
          echo "=== Events (warnings only) ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' || true
          echo "=== Webhook configurations ==="
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations || true
          echo "=== kserve-system ==="
          kubectl get pods -n kserve-system || true
          kubectl describe pods -n kserve-system || true
          kubectl logs -n kserve-system -l control-plane=kserve-controller-manager --tail=100 || true
          echo "=== cert-manager ==="
          kubectl get pods -n cert-manager || true
          kubectl get certificates -A || true
          echo "=== Storage classes ==="
          kubectl get storageclass -o wide || true
          echo "=== PVs ==="
          kubectl get pv || true
          echo "=== PVCs ==="
          kubectl get pvc -A || true
          echo "=== Pending PVCs ==="
          kubectl get pvc -A --field-selector status.phase=Pending || true
          echo "=== Describe pending PVCs ==="
          for pvc in $(kubectl get pvc -A --field-selector status.phase=Pending -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'); do
            ns="${pvc%/*}"
            name="${pvc#*/}"
            echo "--- ${ns}/${name} ---"
            kubectl describe pvc -n "${ns}" "${name}" || true
          done
          echo "=== Node resources ==="
          kubectl describe nodes | grep -A 5 "Allocated resources" || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name "${KIND_CLUSTER}" || true

      - name: Delete kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG}"
