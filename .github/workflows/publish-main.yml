name: publish-main

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'internal/**'
      - 'cmd/**'
      - 'config/**'
      - 'images/artifact-downloader/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/publish-main.yml'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: vars.ACTIVATE_PUBLISH_MAIN_WORKFLOW == 'true'
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE_REPO: ${{ vars.PUSH_IMAGE_REPO }}
      PULL_IMAGE_REPO: ${{ vars.PULL_IMAGE_REPO }}
      CHART_OCI_REPO: ${{ vars.CHART_OCI_REPO }}
      CHART_NAME: aim-engine-chart

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Derive version info
        id: ver
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="publish-main-${SHORT_SHA}"
          CHART_VERSION="0.0.0-publish-main.${SHORT_SHA}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (artifact-downloader)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Build and push artifact-downloader image
        uses: docker/build-push-action@v6
        with:
          context: images/artifact-downloader
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aim-artifact-downloader:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/aim-artifact-downloader:publish-main
          cache-from: type=gha,scope=artifact-downloader
          cache-to: type=gha,scope=artifact-downloader,mode=max

      - name: Log in to DockerHub (controller image)
        run: echo "${{ secrets.DOCKER_HUB_PUSH }}" | docker login docker.io -u "${{ secrets.DOCKER_HUB_PUSH_USER }}" --password-stdin

      - name: Build and push Docker image
        run: |
          make docker-build IMG=${PUSH_IMAGE_REPO}:${IMAGE_TAG} TAG=${IMAGE_TAG}
          make docker-push IMG=${PUSH_IMAGE_REPO}:${IMAGE_TAG}
          docker tag ${PUSH_IMAGE_REPO}:${IMAGE_TAG} ${PUSH_IMAGE_REPO}:publish-main
          docker push ${PUSH_IMAGE_REPO}:publish-main

      - name: Resolve chart image repo
        run: echo "CHART_IMAGE_REPO=${PULL_IMAGE_REPO:-$PUSH_IMAGE_REPO}" >> "$GITHUB_ENV"

      - name: Inject manager imagePullSecrets into Helm values
        run: |
          # Only the manager image lives in the private silogenai DockerHub
          # registry; acceleratorDetector images are publicly pullable and
          # don't need a pull secret. Silogen-managed clusters carry a
          # `dockerhub-regcred` secret in the install namespace, so baking
          # it as the manager default makes the snapshot install with no
          # extra setup.
          yq -i '
            .manager.imagePullSecrets = [{"name": "dockerhub-regcred"}]
          ' config/helm/values.yaml

      - name: Generate CRDs
        run: make crds

      - name: Package Helm chart
        run: |
          make helm-package \
            CHART_VERSION=${CHART_VERSION} \
            CHART_IMAGE_REPO=${CHART_IMAGE_REPO} \
            CHART_IMAGE_TAG=${IMAGE_TAG} \
            TAG=${IMAGE_TAG}

      - name: Validate chart with helm template
        run: helm template aim-engine ./dist/chart > /dev/null

      - name: Lint Helm chart
        run: helm lint ./dist/chart

      - name: Log in to DockerHub (Helm/OCI)
        run: echo "${{ secrets.DOCKER_HUB_PUSH }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKER_HUB_PUSH_USER }}" --password-stdin

      - name: Push Helm chart to OCI registry
        run: |
          make helm-push-oci CHART_VERSION=${CHART_VERSION}

      - name: Create or update publish-main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch or checkout existing
          git checkout --orphan publish-main-temp || true

          # Clear the index
          git rm -rf --cached . || true

          # Add the chart directory
          mkdir -p chart
          cp -r dist/chart/* chart/
          git add chart/

          # Add the crd directory with crds.yaml as separate file (distributed independently)
          mkdir -p crd
          cp dist/crds.yaml crd/crds.yaml
          git add crd/crds.yaml

          # Create a README for the branch
          cat > README.md << 'EOF'
          # aim-engine

          This branch contains the auto-generated Helm chart and CRDs for aim-engine.

          ## Installation

          ### Prerequisite: image pull secret

          The operator image is hosted on a private DockerHub registry. The
          packaged chart's `values.yaml` defaults `manager.imagePullSecrets`
          to a secret named `dockerhub-regcred`. Provision it in the install
          namespace before installing the operator (skip if the secret is
          already present):

          ```bash
          kubectl create namespace aim-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-regcred \
            --namespace aim-system \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=<your-dockerhub-username> \
            --docker-password=<your-dockerhub-token>
          ```

          To use a different secret name, override at install time with
          `--set manager.imagePullSecrets[0].name=...`.

          CRDs are distributed separately and must be installed first:

          ```bash
          # 1. Install CRDs
          kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/publish-main/crd/crds.yaml
          kubectl wait --for=condition=Established crd --all --timeout=60s

          # 2a. Install operator via Helm OCI (recommended)
          helm install aim-engine ${{ env.CHART_OCI_REPO }}/${{ env.CHART_NAME }} \
            --version ${{ steps.ver.outputs.chart_version }} \
            --namespace aim-system --create-namespace

          # 2b. Or install from this branch
          helm install aim-engine ./chart --namespace aim-system --create-namespace
          ```

          Or clone this branch:

          ```bash
          git clone -b publish-main https://github.com/${{ github.repository }}.git aim-engine
          cd aim-engine

          kubectl apply -f crd/crds.yaml
          kubectl wait --for=condition=Established crd --all --timeout=60s
          helm install aim-engine ./chart --namespace aim-system --create-namespace
          ```

          ## Source

          Generated from commit: ${{ github.sha }}
          EOF
          git add README.md

          # Commit
          git commit -m "Publish chart from ${GITHUB_SHA::7}" --allow-empty

          # Force push to publish-main
          git push origin HEAD:publish-main --force
