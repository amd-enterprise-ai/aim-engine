name: build-artifact-downloader

on:
  push:
    tags:
      - "v*"
      - "*int-test"
  pull_request:
    paths:
      - "images/artifact-downloader/**"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the image (e.g. 1.2.3). Leave empty to use ref/sha only.'
        required: false
        type: string
      push_latest:
        description: 'Also push as :latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Opt JavaScript actions onto Node 24 ahead of GitHub's June 16, 2026 default
# flip. See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # Gate automatic triggers (tag push / PR) behind the repo variable, but
    # always allow a manual run — dispatching the workflow is an explicit opt-in.
    if: ${{ vars.ACTIVATE_ARTIFACT_DOWNLOADER_WORKFLOW == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_PUSH_USER }}
          password: ${{ secrets.DOCKER_HUB_PUSH }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/silogenai/aim-artifact-downloader
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ inputs.push_latest == true || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: images/artifact-downloader
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Model Downloader Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY