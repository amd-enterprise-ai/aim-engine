name: Upgrade compatibility

on:
  pull_request:
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'images/artifact-downloader/**'
      - 'images/aim-dummy/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Makefile'
      - 'hack/**'
      - 'tests/e2e/upgrade-compatibility/**'
      - 'mise.toml'
      - '.github/workflows/test-upgrade.yml'

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  upgrade-e2e:
    name: upgrade-e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public-main
            slug: public
            repository: amd-enterprise-ai/aim-engine
            ref: main
            scenario: generic
            setup_dir: tests/e2e/upgrade-compatibility/setup
            verify_dir: tests/e2e/upgrade-compatibility/verify
          - name: v0.2.7
            slug: v027
            repository: amd-enterprise-ai/aim-engine
            ref: 3f585b07c3d7fa215d6ceed20190a809e82dbe11
            # The upgrade preflight reads the operator version from this tag.
            baseline_image_tag: v0.2.7
            scenario: v0.2.7
            setup_dir: tests/e2e/upgrade-compatibility/v0.2.7/setup
            verify_dir: tests/e2e/upgrade-compatibility/v0.2.7/verify
    concurrency:
      group: test-upgrade-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.slug }}
      cancel-in-progress: true
    env:
      KIND_CLUSTER: aim-upgrade-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
      UPGRADE_NAMESPACE: aim-upgrade-compatibility
      BASELINE_DIR: .tmp/upgrade-baseline
      BASELINE_IMAGE_REPOSITORY: aim-engine-upgrade-baseline
      BASELINE_IMAGE_TAG: ${{ matrix.baseline_image_tag || format('{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.slug) }}
      BASELINE_OPERATOR_IMAGE: aim-engine-upgrade-baseline:${{ matrix.baseline_image_tag || format('{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.slug) }}
      CANDIDATE_IMAGE_REPOSITORY: aim-engine-upgrade-candidate
      CANDIDATE_IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
      CANDIDATE_OPERATOR_IMAGE: aim-engine-upgrade-candidate:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
      ARTIFACT_DOWNLOADER_IMAGE: aim-artifact-downloader-upgrade:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
      UPGRADE_REPORT_DIR: .tmp/upgrade-reports/${{ matrix.slug }}
    steps:
      - name: Clone the candidate code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the baseline code
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: ${{ env.BASELINE_DIR }}

      - name: Record exact revisions
        run: |
          set -euo pipefail
          mkdir -p "${UPGRADE_REPORT_DIR}"
          {
            echo "baseline_repository=${{ matrix.repository }}"
            echo "baseline_ref=${{ matrix.ref }}"
            echo "baseline_sha=$(git -C "${BASELINE_DIR}" rev-parse HEAD)"
            echo "candidate_repository=${GITHUB_REPOSITORY}"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "scenario=${{ matrix.scenario }}"
          } | tee "${UPGRADE_REPORT_DIR}/revisions.txt"

      - name: Setup mise
        uses: jdx/mise-action@v2
        env:
          MISE_OVERRIDE_CONFIG_FILENAMES: "mise.toml"

      - name: Install isolated upgrade tools
        env:
          MISE_OVERRIDE_CONFIG_FILENAMES: "mise.toml"
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/aim-upgrade-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
          mkdir -p "${tools_dir}"
          mise exec \
            kustomize@5.7.1 \
            yq@4.45.1 \
            jq@1.7.1 \
            kubebuilder@4.10.1 \
            -- sh -eu -c '
              tools_dir="$1"
              for tool in kustomize yq jq kubebuilder; do
                cp "$(command -v "${tool}")" "${tools_dir}/${tool}"
              done
            ' sh "${tools_dir}"
          echo "${tools_dir}" >> "${GITHUB_PATH}"

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-

      - name: Set per-run kubeconfig path
        run: echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}" >> "${GITHUB_ENV}"

      - name: Set per-run isolated Helm and Helmfile config
        run: |
          HELM_BASE="${RUNNER_TEMP}/helm-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
          HELMFILE_BASE="${RUNNER_TEMP}/helmfile-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.slug }}"
          {
            echo "HELM_CACHE_HOME=${HELM_BASE}/cache"
            echo "HELM_CONFIG_HOME=${HELM_BASE}/config"
            echo "HELM_DATA_HOME=${HELM_BASE}/data"
            echo "HELM_REGISTRY_CONFIG=${HELM_BASE}/registry/config.json"
            echo "HELMFILE_CACHE_HOME=${HELMFILE_BASE}/cache"
          } >> "${GITHUB_ENV}"
          mkdir -p "${HELM_BASE}/cache" "${HELM_BASE}/config" "${HELM_BASE}/data" "${HELM_BASE}/registry"
          mkdir -p "${HELMFILE_BASE}/cache"
          echo '{}' > "${HELM_BASE}/registry/config.json"

      - name: Create Kind cluster
        run: kind create cluster --name "${KIND_CLUSTER}" --config hack/kind/config.yaml

      - name: Install Kind storage
        run: helmfile sync -f hack/kind/helmfile.yaml.gotmpl

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install core dependencies
        run: helmfile sync -f hack/dependencies/helmfile.yaml.gotmpl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build artifact-downloader image
        uses: docker/build-push-action@v6
        with:
          context: images/artifact-downloader
          load: true
          tags: ${{ env.ARTIFACT_DOWNLOADER_IMAGE }}
          cache-from: type=gha,scope=upgrade-artifact-downloader-${{ matrix.slug }}
          cache-to: type=gha,scope=upgrade-artifact-downloader-${{ matrix.slug }},mode=max

      - name: Build baseline operator image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BASELINE_DIR }}
          load: true
          tags: ${{ env.BASELINE_OPERATOR_IMAGE }}
          build-args: |
            VERSION=${{ env.BASELINE_IMAGE_TAG }}
            ARTIFACT_DOWNLOADER_IMG=${{ env.ARTIFACT_DOWNLOADER_IMAGE }}
          cache-from: type=gha,scope=upgrade-baseline-${{ matrix.slug }}
          cache-to: type=gha,scope=upgrade-baseline-${{ matrix.slug }},mode=max

      - name: Build candidate operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.CANDIDATE_OPERATOR_IMAGE }}
          build-args: |
            VERSION=${{ env.CANDIDATE_IMAGE_TAG }}
            ARTIFACT_DOWNLOADER_IMG=${{ env.ARTIFACT_DOWNLOADER_IMAGE }}
          cache-from: type=gha,scope=upgrade-candidate-${{ matrix.slug }}
          cache-to: type=gha,scope=upgrade-candidate-${{ matrix.slug }},mode=max

      - name: Load images into Kind
        run: |
          set -euo pipefail
          kind load docker-image "${ARTIFACT_DOWNLOADER_IMAGE}" --name "${KIND_CLUSTER}"
          kind load docker-image "${BASELINE_OPERATOR_IMAGE}" --name "${KIND_CLUSTER}"
          kind load docker-image "${CANDIDATE_OPERATOR_IMAGE}" --name "${KIND_CLUSTER}"

      - name: Generate baseline CRDs and chart
        working-directory: ${{ env.BASELINE_DIR }}
        run: make crds helm IMG="${BASELINE_OPERATOR_IMAGE}"

      - name: Generate candidate CRDs and chart
        run: make crds helm IMG="${CANDIDATE_OPERATOR_IMAGE}"

      - name: Install baseline CRDs
        run: |
          set -euo pipefail
          kubectl apply --server-side -f "${BASELINE_DIR}/dist/crds.yaml"
          mapfile -t crds < <(kubectl get crd -o name | grep 'aim.eai.amd.com')
          kubectl wait --for=condition=Established --timeout=120s "${crds[@]}"

      - name: Install baseline operator
        run: |
          set -euo pipefail
          baseline_values=()
          if yq -e '.scaleFromZero.gatewayMetricsCollector | has("enable")' \
            "${BASELINE_DIR}/dist/chart/values.yaml" >/dev/null 2>&1; then
            # Older charts rendered the collector whenever enable=true. Disable
            # it for this registry-free corpus; newer charts replaced this key
            # with gatewayProvider/management and reject the legacy key.
            baseline_values+=(--set scaleFromZero.gatewayMetricsCollector.enable=false)
          fi
          helm install aim-engine "${BASELINE_DIR}/dist/chart" \
            --namespace aim-system \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set crd.enable=false \
            --set manager.image.repository="${BASELINE_IMAGE_REPOSITORY}" \
            --set manager.image.tag="${BASELINE_IMAGE_TAG}" \
            --set manager.artifactDownloaderImage="${ARTIFACT_DOWNLOADER_IMAGE}" \
            --set manager.runtimeProjectionMode=Both \
            --set acceleratorDetector.enable=false \
            --set clusterModelSource.enable=false \
            --set scaleFromZero.gatewayProvider=none \
            "${baseline_values[@]}"

      - name: Wait for baseline operator
        run: kubectl rollout status deployment/aim-engine-controller-manager -n aim-system --timeout=180s

      - name: Create upgrade test namespace
        run: kubectl create namespace "${UPGRADE_NAMESPACE}"

      - name: Create baseline resource corpus
        run: |
          mkdir -p "${UPGRADE_REPORT_DIR}/setup"
          chainsaw test \
            --test-dir "${{ matrix.setup_dir }}" \
            --config tests/chainsaw/config/kind-ci.yaml \
            --namespace "${UPGRADE_NAMESPACE}" \
            --skip-delete \
            --parallel 1 \
            --report-format JSON \
            --report-name setup \
            --report-path "${UPGRADE_REPORT_DIR}/setup"

      - name: Snapshot generic baseline object identities
        if: matrix.scenario == 'generic'
        run: hack/ci/upgrade/snapshot.sh "${UPGRADE_REPORT_DIR}/baseline-objects.tsv"

      - name: Preflight blocks the v0.2.7 corpus
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          report="${UPGRADE_REPORT_DIR}/preflight-before-cleanup.txt"
          if hack/upgrade-preflight.sh > "${report}"; then
            cat "${report}"
            echo "The preflight passed before the documented cleanup" >&2
            exit 1
          fi
          cat "${report}"
          for expected in \
            "FAIL [template-pipeline-services] AIMService ${UPGRADE_NAMESPACE}/upgrade-shared-service:" \
            "FAIL [template-pipeline-services] AIMService ${UPGRADE_NAMESPACE}/upgrade-dedicated-service:" \
            "FAIL [unservable-services] AIMService ${UPGRADE_NAMESPACE}/upgrade-custom-service:" \
            "FAIL [models-without-native-path] AIMModel ${UPGRADE_NAMESPACE}/" \
            "FAIL [template-objects] AIMServiceTemplate ${UPGRADE_NAMESPACE}/upgrade-cpu-template:" \
            "FAIL [template-objects] AIMClusterServiceTemplate " \
            "FAIL [template-objects] AIMTemplateCache ${UPGRADE_NAMESPACE}/" \
            "FAIL [template-finalizers] AIMTemplateCache ${UPGRADE_NAMESPACE}/" \
            "FAIL [stale-owner-references] AIMArtifact ${UPGRADE_NAMESPACE}/" \
            "FAIL [stale-owner-references] ConfigMap ${UPGRADE_NAMESPACE}/upgrade-v1alpha1-owned:" \
            "INFO [dedicated-template-caches] AIMTemplateCache ${UPGRADE_NAMESPACE}/" \
            "ok   [minimum-version]"; do
            if ! grep -qF -- "${expected}" "${report}"; then
              echo "The preflight report has no line with: ${expected}" >&2
              exit 1
            fi
          done

      - name: The template CRD cleanup stops while a template-era PVC is mounted
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          report="${UPGRADE_REPORT_DIR}/template-crd-cleanup-stopped.txt"
          mapfile -t pods < <(kubectl get pods -n "${UPGRADE_NAMESPACE}" \
            -l aim.eai.amd.com/service=upgrade-dedicated-service,app.kubernetes.io/component=inference \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          if ((${#pods[@]} == 0)); then
            echo "upgrade-dedicated-service has no inference pod" >&2
            exit 1
          fi

          # The kubectl commands of docs/docs/admin/upgrading.md#remove-the-template-crds.
          # The pods of upgrade-dedicated-service mount the PVC of their Dedicated template cache's artifact.
          set +e
          (
            set -euo pipefail
            mounted="$({ kubectl get aimartifacts --all-namespaces -o json; kubectl get pods --all-namespaces -o json; } \
              | jq -rs '.[0].items as $artifacts | .[1].items[]
                  | select(.status.phase | IN("Succeeded", "Failed") | not) | . as $pod
                  | (.spec.volumes[]?.persistentVolumeClaim.claimName // empty) as $claim
                  | $artifacts[] | select(.metadata.namespace == $pod.metadata.namespace
                    and .status.persistentVolumeClaim == $claim
                    and any(.metadata.ownerReferences[]?; .kind == "AIMTemplateCache"))
                  | "\($pod.metadata.namespace)/\($pod.metadata.name) mounts PVC \($claim)"')"
            if [[ -n "${mounted}" ]]; then
              printf 'Stopped. These pods mount the PVC of an AIMArtifact that an AIMTemplateCache owns:\n%s\n' \
                "${mounted}" >&2
              exit 1
            fi
            for resource in aimtemplatecaches aimservicetemplates aimclusterservicetemplates; do
              kubectl get "${resource}.aim.eai.amd.com" --all-namespaces \
                -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.namespace}{"\n"}{end}' \
                | while read -r name namespace; do
                    kubectl patch "${resource}.aim.eai.amd.com" "${name}" --namespace "${namespace}" \
                      --type merge -p '{"metadata":{"finalizers":null}}'
                  done
              kubectl delete "${resource}.aim.eai.amd.com" --all --all-namespaces
            done
            kubectl delete crd aimtemplatecaches.aim.eai.amd.com \
              aimservicetemplates.aim.eai.amd.com aimclusterservicetemplates.aim.eai.amd.com
          ) > "${report}" 2>&1
          status=$?
          set -e

          cat "${report}"
          if ((status == 0)); then
            echo "The template CRD cleanup didn't stop while a pod mounts a template-era PVC" >&2
            exit 1
          fi
          for pod in "${pods[@]}"; do
            if ! grep -qF -- "${UPGRADE_NAMESPACE}/${pod} mounts PVC " "${report}"; then
              echo "The template CRD cleanup didn't list ${UPGRADE_NAMESPACE}/${pod}" >&2
              exit 1
            fi
          done
          kubectl get crd aimtemplatecaches.aim.eai.amd.com aimservicetemplates.aim.eai.amd.com \
            aimclusterservicetemplates.aim.eai.amd.com

      - name: Move the v0.2.7 template services
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          read -r shared_artifact shared_artifact_uid < <(kubectl get aimtemplatecaches -n "${UPGRADE_NAMESPACE}" \
            -l aim.eai.amd.com/service=upgrade-shared-service -o json \
            | jq -r '.items[0].status.artifacts[] | .name + " " + .uid')
          moved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The commands of docs/docs/admin/upgrading.md#move-template-services.
          # Both services set spec.template.allowUnoptimized, and their template requests no GPU.
          for service in upgrade-shared-service upgrade-dedicated-service; do
            kubectl patch aimservice "${service}" -n "${UPGRADE_NAMESPACE}" --type merge \
              -p '{"spec":{"profile":{"selector":{"minimumType":"unoptimized","acceleratorType":"cpu"}}}}'
            kubectl annotate aimservice "${service}" -n "${UPGRADE_NAMESPACE}" aim.eai.amd.com/reconciler-pipeline=profile
            kubectl wait deployment -n "${UPGRADE_NAMESPACE}" --timeout=15m \
              --for=jsonpath='{.metadata.labels.aim\.eai\.amd\.com/profile}' \
              -l aim.eai.amd.com/service="${service}"
            kubectl rollout status deployment -n "${UPGRADE_NAMESPACE}" --timeout=15m \
              -l aim.eai.amd.com/service="${service}",aim.eai.amd.com/profile
          done

          read -r adopted_artifact adopted_artifact_uid < <(kubectl get aimprofilecaches -n "${UPGRADE_NAMESPACE}" \
            -l aim.eai.amd.com/service=upgrade-shared-service -o json \
            | jq -r '.items[0].status.artifacts[] | .name + " " + .uid')
          if [[ "${adopted_artifact_uid}" != "${shared_artifact_uid}" ]]; then
            echo "The Shared profile cache uses ${adopted_artifact} (${adopted_artifact_uid})," \
              "not the template cache's ${shared_artifact} (${shared_artifact_uid})" >&2
            exit 1
          fi
          new_downloads="$(kubectl get jobs -n "${UPGRADE_NAMESPACE}" \
            -l "aim.eai.amd.com/component=download,aim.eai.amd.com/artifact.name=${shared_artifact}" -o json \
            | jq --arg since "${moved_at}" '[.items[] | select(.metadata.creationTimestamp >= $since)] | length')"
          if [[ "${new_downloads}" != 0 ]]; then
            echo "The move started ${new_downloads} download Job(s) for the adopted artifact ${shared_artifact}" >&2
            exit 1
          fi
          echo "The Shared profile cache adopted ${shared_artifact} (${shared_artifact_uid}) without a download"

      - name: Replace the v0.2.7 custom service
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # The AIMModel loop of docs/docs/admin/upgrading.md#delete-template-objects must leave
          # the model v0.2.7 generated for the custom service unchanged.
          kubectl get aimmodels --all-namespaces -o json \
            | jq -r '.items[] | select(.spec.image and .metadata.annotations["aim.eai.amd.com/legacy-auto-custom-spec"] == null)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r namespace name; do
                kubectl patch aimmodel "${name}" -n "${namespace}" --type merge \
                  -p '{"spec":{"discovery":{"createServiceTemplates":false}}}'
              done
          if ! kubectl get aimmodels -n "${UPGRADE_NAMESPACE}" -o json \
            -l aim.eai.amd.com/custom-model=true,aim.eai.amd.com/service=upgrade-custom-service \
            | jq -e '.items | length == 1 and .[0].spec.discovery == null' >/dev/null; then
            echo "The createServiceTemplates loop changed the AIMModel generated for upgrade-custom-service" >&2
            exit 1
          fi

          profile="$(kubectl get aimprofiles -n "${UPGRADE_NAMESPACE}" -o json \
            -l aim.eai.amd.com/source-model=upgrade-custom-weights \
            | jq -r '[.items[] | select(.spec.acceleratorType == "cpu") | .metadata.name] | first // empty')"
          if [[ -z "${profile}" ]]; then
            echo "upgrade-custom-weights has no CPU AIMProfile" >&2
            exit 1
          fi
          switched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The commands of docs/docs/admin/upgrading.md#replace-unservable-services, then the
          # rollout waits of #move-template-services.
          kubectl patch aimservice upgrade-custom-service -n "${UPGRADE_NAMESPACE}" --type merge \
            -p '{"spec":{"model":null,"profile":{"name":"'"${profile}"'"}}}'
          kubectl delete aimmodel -n "${UPGRADE_NAMESPACE}" \
            -l aim.eai.amd.com/custom-model=true,aim.eai.amd.com/service=upgrade-custom-service
          kubectl wait deployment -n "${UPGRADE_NAMESPACE}" --timeout=15m \
            --for=jsonpath='{.metadata.labels.aim\.eai\.amd\.com/profile}' \
            -l aim.eai.amd.com/service=upgrade-custom-service
          kubectl rollout status deployment -n "${UPGRADE_NAMESPACE}" --timeout=15m \
            -l aim.eai.amd.com/service=upgrade-custom-service,aim.eai.amd.com/profile

          new_downloads="$(kubectl get jobs -n "${UPGRADE_NAMESPACE}" -l aim.eai.amd.com/component=download -o json \
            | jq --arg since "${switched_at}" '[.items[] | select(.metadata.creationTimestamp >= $since)] | length')"
          if [[ "${new_downloads}" != 0 ]]; then
            echo "Replacing upgrade-custom-service started ${new_downloads} download Job(s)" >&2
            exit 1
          fi
          echo "upgrade-custom-service runs ${profile} without a download"

      - name: Move a service with v0.2.7's aim-template-migration
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # The v0.2.7 release doesn't publish the tool, so build it from the baseline checkout.
          go build -C "${BASELINE_DIR}" -o "${RUNNER_TEMP}/aim-template-migration" ./cmd/aim-template-migration
          plan_dir="${UPGRADE_REPORT_DIR}/migration-plan"
          # The services moved above are on the profile pipeline already, so the
          # plan leaves them manual and moves only upgrade-migrated-service.
          "${RUNNER_TEMP}/aim-template-migration" plan --namespace "${UPGRADE_NAMESPACE}" \
            --runtime-projection-mode Both --output-dir "${plan_dir}"
          # Apply waits until the service runs on the profile pipeline with the same
          # InferenceService, unchanged and Ready.
          "${RUNNER_TEMP}/aim-template-migration" apply --plan "${plan_dir}/plan.json" --commit
          outcome="$(jq -r --arg unit "${UPGRADE_NAMESPACE}/upgrade-migrated-service" \
            '.units[] | select(.unitId == $unit) | .outcome' "${plan_dir}/apply-result.json")"
          if [[ "${outcome}" != succeeded ]]; then
            echo "aim-template-migration did not move upgrade-migrated-service (outcome: ${outcome:-none})" >&2
            exit 1
          fi
          hack/ci/upgrade/record-v0.2.7-identities.sh "${UPGRADE_REPORT_DIR}/identities-after-migration.tsv"

      - name: Delete the v0.2.7 template objects
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # The commands of docs/docs/admin/upgrading.md#delete-template-objects.
          kubectl get aimmodels --all-namespaces -o json \
            | jq -r '.items[] | select(.spec.image and .metadata.annotations["aim.eai.amd.com/legacy-auto-custom-spec"] == null)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r namespace name; do
                kubectl patch aimmodel "${name}" -n "${namespace}" --type merge \
                  -p '{"spec":{"discovery":{"createServiceTemplates":false}}}'
              done
          kubectl get aimclustermodels -o json \
            | jq -r '.items[] | select(.spec.image) | .metadata.name' \
            | while read -r name; do
                kubectl patch aimclustermodel "${name}" --type merge \
                  -p '{"spec":{"discovery":{"createServiceTemplates":false}}}'
              done
          kubectl delete aimtemplatecaches --all --all-namespaces
          kubectl delete aimservicetemplates --all --all-namespaces
          kubectl delete aimclusterservicetemplates --all

      - name: Rewrite stale v1alpha1 owner references
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # The commands of docs/docs/admin/upgrading.md#remove-stale-v1alpha1-owner-references.
          resources="$(kubectl api-resources -o name)"
          for resource in inferenceservices.serving.kserve.io httproutes.gateway.networking.k8s.io \
            scaledobjects.keda.sh persistentvolumeclaims jobs.batch configmaps \
            aimartifacts.aim.eai.amd.com aimprofiles.aim.eai.amd.com aimprofilecaches.aim.eai.amd.com; do
            grep -qxF "${resource}" <<<"${resources}" || continue
            kubectl get "${resource}" --all-namespaces -o json \
              | jq -r '.items[] | . as $item | .metadata.ownerReferences // [] | to_entries[]
                  | select(.value.apiVersion == "aim.eai.amd.com/v1alpha1"
                    and (.value.kind | IN("AIMService", "AIMModel", "AIMClusterModel")))
                  | [$item.metadata.namespace, $item.metadata.name,
                    ([{op: "test", path: "/metadata/ownerReferences/\(.key)/uid", value: .value.uid},
                      {op: "replace", path: "/metadata/ownerReferences/\(.key)/apiVersion",
                        value: "aim.eai.amd.com/v1alpha2"}] | tojson)] | join(" ")' \
              | while read -r namespace name patch; do
                  kubectl patch "${resource}" "${name}" -n "${namespace}" --type json -p "${patch}"
                done
          done

          owner="$(kubectl get configmap upgrade-v1alpha1-owned -n "${UPGRADE_NAMESPACE}" \
            -o jsonpath='{.metadata.ownerReferences[0].apiVersion} {.metadata.ownerReferences[0].kind}')"
          if [[ "${owner}" != "aim.eai.amd.com/v1alpha2 AIMService" ]]; then
            echo "upgrade-v1alpha1-owned is owned through ${owner}, want aim.eai.amd.com/v1alpha2 AIMService" >&2
            exit 1
          fi

      - name: Preflight passes after the documented cleanup
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          report="${UPGRADE_REPORT_DIR}/preflight-after-cleanup.txt"
          # Garbage collection of what the template objects owned takes a while.
          for attempt in $(seq 1 30); do
            if hack/upgrade-preflight.sh > "${report}"; then
              cat "${report}"
              exit 0
            fi
            echo "Preflight attempt ${attempt}/30 failed"
            sleep 10
          done
          cat "${report}"
          exit 1

      - name: Record v0.2.7 identities before the upgrade
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          hack/ci/upgrade/record-v0.2.7-identities.sh "${UPGRADE_REPORT_DIR}/identities-before-upgrade.tsv"
          # Deleting the template objects must not roll the migrated service's pods.
          diff -u <(grep '^Pod' "${UPGRADE_REPORT_DIR}/identities-after-migration.tsv") \
            <(grep '^Pod' "${UPGRADE_REPORT_DIR}/identities-before-upgrade.tsv")

      - name: Upgrade CRDs
        run: |
          set -euo pipefail
          kubectl apply --server-side -f dist/crds.yaml
          mapfile -t crds < <(kubectl get crd -o name | grep 'aim.eai.amd.com')
          kubectl wait --for=condition=Established --timeout=120s "${crds[@]}"

      - name: Upgrade operator
        run: |
          helm upgrade aim-engine dist/chart \
            --namespace aim-system \
            --wait \
            --timeout 5m \
            --set crd.enable=false \
            --set manager.image.repository="${CANDIDATE_IMAGE_REPOSITORY}" \
            --set manager.image.tag="${CANDIDATE_IMAGE_TAG}" \
            --set manager.artifactDownloaderImage="${ARTIFACT_DOWNLOADER_IMAGE}" \
            --set manager.runtimeProjectionMode=Both \
            --set acceleratorDetector.enable=false \
            --set clusterModelSource.enable=false \
            --set scaleFromZero.gatewayProvider=none

      - name: Check the release manifest names AIMClusterRuntimeConfig at v1alpha2
        run: |
          set -euo pipefail
          manifest="$(helm get manifest aim-engine --namespace aim-system)"
          runtime_config_versions="$(yq ea '[select(.kind == "AIMClusterRuntimeConfig") | .apiVersion] | join(" ")' <<<"${manifest}")"
          v1alpha1_objects="$(yq ea '[select(.apiVersion == "aim.eai.amd.com/v1alpha1")] | length' <<<"${manifest}")"
          if [[ "${runtime_config_versions}" != "aim.eai.amd.com/v1alpha2" || "${v1alpha1_objects}" != "0" ]]; then
            echo "release manifest has AIMClusterRuntimeConfig at '${runtime_config_versions}' and ${v1alpha1_objects} v1alpha1 AIM object(s); want one at v1alpha2 and none at v1alpha1" >&2
            exit 1
          fi

      - name: Wait for candidate operator
        run: kubectl rollout status deployment/aim-engine-controller-manager -n aim-system --timeout=180s

      - name: Remove the template CRDs
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # The kubectl commands of docs/docs/admin/upgrading.md#remove-the-template-crds.
          (
            set -euo pipefail
            mounted="$({ kubectl get aimartifacts --all-namespaces -o json; kubectl get pods --all-namespaces -o json; } \
              | jq -rs '.[0].items as $artifacts | .[1].items[]
                  | select(.status.phase | IN("Succeeded", "Failed") | not) | . as $pod
                  | (.spec.volumes[]?.persistentVolumeClaim.claimName // empty) as $claim
                  | $artifacts[] | select(.metadata.namespace == $pod.metadata.namespace
                    and .status.persistentVolumeClaim == $claim
                    and any(.metadata.ownerReferences[]?; .kind == "AIMTemplateCache"))
                  | "\($pod.metadata.namespace)/\($pod.metadata.name) mounts PVC \($claim)"')"
            if [[ -n "${mounted}" ]]; then
              printf 'Stopped. These pods mount the PVC of an AIMArtifact that an AIMTemplateCache owns:\n%s\n' \
                "${mounted}" >&2
              exit 1
            fi
            for resource in aimtemplatecaches aimservicetemplates aimclusterservicetemplates; do
              kubectl get "${resource}.aim.eai.amd.com" --all-namespaces \
                -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.namespace}{"\n"}{end}' \
                | while read -r name namespace; do
                    kubectl patch "${resource}.aim.eai.amd.com" "${name}" --namespace "${namespace}" \
                      --type merge -p '{"metadata":{"finalizers":null}}'
                  done
              kubectl delete "${resource}.aim.eai.amd.com" --all --all-namespaces
            done
            kubectl delete crd aimtemplatecaches.aim.eai.amd.com \
              aimservicetemplates.aim.eai.amd.com aimclusterservicetemplates.aim.eai.amd.com
          )

      - name: Verify upgraded resources with Chainsaw
        run: |
          mkdir -p "${UPGRADE_REPORT_DIR}/verify"
          chainsaw test \
            --test-dir "${{ matrix.verify_dir }}" \
            --config tests/chainsaw/config/kind-ci.yaml \
            --namespace "${UPGRADE_NAMESPACE}" \
            --skip-delete \
            --parallel 1 \
            --report-format JSON \
            --report-name verify \
            --report-path "${UPGRADE_REPORT_DIR}/verify"

      - name: Verify generic identity, backfill, and stable convergence
        if: matrix.scenario == 'generic'
        run: hack/ci/upgrade/verify-convergence.sh "${UPGRADE_REPORT_DIR}/baseline-objects.tsv"

      - name: Verify v0.2.7 identities survived the upgrade
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          hack/ci/upgrade/record-v0.2.7-identities.sh "${UPGRADE_REPORT_DIR}/identities-after-upgrade.tsv"
          # Removed in the release that deletes the v1alpha1 entries.
          kept='AIMArtifact|AIMRuntimeConfig|AIMClusterRuntimeConfig|AIMClusterModelSource'
          normalize() { sed -E "s#aim\.eai\.amd\.com/v1alpha1 (${kept}) #aim.eai.amd.com/v1alpha2 \1 #g" "$1"; }
          diff -u <(normalize "${UPGRADE_REPORT_DIR}/identities-before-upgrade.tsv") \
            <(normalize "${UPGRADE_REPORT_DIR}/identities-after-upgrade.tsv")
          if grep -E $'^(PersistentVolumeClaim|AIMArtifact)\t' "${UPGRADE_REPORT_DIR}/identities-after-upgrade.tsv" \
              | grep -q 'aim.eai.amd.com/v1alpha1 AIMArtifact '; then
            echo "artifact owner reference still names v1alpha1" >&2
            exit 1
          fi

      - name: Garbage collection follows the rewritten owner reference
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # Before the upgrade the lane rewrote the ConfigMap's v1alpha1 owner reference to this service.
          kubectl delete aimservice upgrade-custom-service -n "${UPGRADE_NAMESPACE}" --timeout=2m
          kubectl wait --for=delete configmap/upgrade-v1alpha1-owned -n "${UPGRADE_NAMESPACE}" --timeout=1m

      - name: Run the rollback prerequisites
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # On kind the aim-dummy profiles this service selects need an MI300X, so it has no
          # InferenceService, and the check after the rollback shows v0.2.7 doesn't create one.
          kubectl apply -n "${UPGRADE_NAMESPACE}" -f - <<'EOF'
          apiVersion: aim.eai.amd.com/v1alpha2
          kind: AIMService
          metadata:
            name: upgrade-post-upgrade-service
          spec:
            model:
              name: upgrade-image-model
          EOF
          kubectl wait aimservice/upgrade-post-upgrade-service -n "${UPGRADE_NAMESPACE}" \
            --for=jsonpath='{.status.observedGeneration}'=1 --timeout=2m
          kubectl get inferenceservices -n "${UPGRADE_NAMESPACE}" \
            -l aim.eai.amd.com/service=upgrade-post-upgrade-service \
            -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.uid} {.metadata.generation}{"\n"}{end}' \
            > "${UPGRADE_REPORT_DIR}/post-upgrade-service-before-rollback.txt"

          # The steps at the start of docs/docs/admin/upgrading.md#rollback.
          kubectl get aimservices --all-namespaces -o json \
            | jq -r '.items[] | select(.spec.profile == null
                and .metadata.annotations["aim.eai.amd.com/reconciler-pipeline"] != "profile")
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r namespace name; do
                kubectl annotate aimservice "${name}" -n "${namespace}" --overwrite \
                  aim.eai.amd.com/reconciler-pipeline=profile
              done
          kubectl get aimmodels --all-namespaces -o json \
            | jq -r '.items[] | select(.spec.image and .metadata.annotations["aim.eai.amd.com/legacy-auto-custom-spec"] == null)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r namespace name; do
                kubectl patch aimmodel "${name}" -n "${namespace}" --type merge \
                  -p '{"spec":{"discovery":{"createServiceTemplates":false}}}'
              done
          kubectl get aimclustermodels -o json \
            | jq -r '.items[] | select(.spec.image) | .metadata.name' \
            | while read -r name; do
                kubectl patch aimclustermodel "${name}" --type merge \
                  -p '{"spec":{"discovery":{"createServiceTemplates":false}}}'
              done
          kubectl get aimservices,aimmodels --all-namespaces -o json \
            | jq -r '[.items[] | select(.kind == "AIMService" and .spec.model != null)
                | "\(.metadata.namespace)/\(.metadata.name)"] as $with_model
              | .items[] | select(.kind == "AIMModel"
                  and .metadata.annotations["aim.eai.amd.com/legacy-auto-custom-spec"] != null
                  and ("\(.metadata.namespace)/\(.metadata.labels["aim.eai.amd.com/service"])" | IN($with_model[]) | not))
              | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r namespace name; do
                kubectl delete aimmodel "${name}" -n "${namespace}"
              done

      - name: Roll back to v0.2.7
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          # The commands of docs/docs/admin/upgrading.md#rollback, for the kubectl CRD install this lane uses.
          helm rollback aim-engine -n aim-system
          kubectl apply --server-side -f "${BASELINE_DIR}/dist/crds.yaml"
          kubectl wait --for=condition=Established --timeout=60s \
            crd/aimservicetemplates.aim.eai.amd.com \
            crd/aimclusterservicetemplates.aim.eai.amd.com \
            crd/aimtemplatecaches.aim.eai.amd.com
          kubectl rollout restart deployment/aim-engine-controller-manager -n aim-system

      - name: Wait for the rolled-back operator
        if: matrix.scenario == 'v0.2.7'
        run: kubectl rollout status deployment/aim-engine-controller-manager -n aim-system --timeout=5m

      - name: Verify the rollback with Chainsaw
        if: matrix.scenario == 'v0.2.7'
        run: |
          mkdir -p "${UPGRADE_REPORT_DIR}/rollback"
          chainsaw test \
            --test-dir tests/e2e/upgrade-compatibility/v0.2.7/rollback \
            --config tests/chainsaw/config/kind-ci.yaml \
            --namespace "${UPGRADE_NAMESPACE}" \
            --skip-delete \
            --parallel 1 \
            --report-format JSON \
            --report-name rollback \
            --report-path "${UPGRADE_REPORT_DIR}/rollback"

      - name: The post-upgrade service keeps its InferenceService
        if: matrix.scenario == 'v0.2.7'
        run: |
          set -euo pipefail
          kubectl get inferenceservices -n "${UPGRADE_NAMESPACE}" \
            -l aim.eai.amd.com/service=upgrade-post-upgrade-service \
            -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.uid} {.metadata.generation}{"\n"}{end}' \
            > "${UPGRADE_REPORT_DIR}/post-upgrade-service-after-rollback.txt"
          diff -u "${UPGRADE_REPORT_DIR}/post-upgrade-service-before-rollback.txt" \
            "${UPGRADE_REPORT_DIR}/post-upgrade-service-after-rollback.txt"

      - name: Capture upgrade diagnostics
        if: always()
        run: |
          mkdir -p "${UPGRADE_REPORT_DIR}/diagnostics"
          kubectl get deployment,pods -n aim-system -o wide > "${UPGRADE_REPORT_DIR}/diagnostics/operator.txt" 2>&1 || true
          kubectl logs deployment/aim-engine-controller-manager -n aim-system --tail=-1 > "${UPGRADE_REPORT_DIR}/diagnostics/operator.log" 2>&1 || true
          kubectl get aimprofiles,aimmodels,aimprofilesets,aimservices,aimprofilecaches -n "${UPGRADE_NAMESPACE}" -o yaml > "${UPGRADE_REPORT_DIR}/diagnostics/namespaced-resources.yaml" 2>&1 || true
          kubectl get aimclusterprofiles,aimclustermodels,aimclusterprofilesets -o yaml > "${UPGRADE_REPORT_DIR}/diagnostics/cluster-resources.yaml" 2>&1 || true
          kubectl get servingruntimes,clusterservingruntimes,configmaps -A -o yaml > "${UPGRADE_REPORT_DIR}/diagnostics/runtime-projections.yaml" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "${UPGRADE_REPORT_DIR}/diagnostics/events.txt" 2>&1 || true

      - name: Capture v0.2.7 diagnostics
        if: always() && matrix.scenario == 'v0.2.7'
        run: |
          mkdir -p "${UPGRADE_REPORT_DIR}/diagnostics/v0.2.7"
          for resource in aimservices aimmodels aimclustermodels aimclustermodelsources aimservicetemplates \
            aimclusterservicetemplates aimtemplatecaches aimartifacts aimprofiles aimclusterprofiles \
            aimprofilecaches inferenceservices jobs pvc pods; do
            kubectl get "${resource}" -A -o yaml > "${UPGRADE_REPORT_DIR}/diagnostics/v0.2.7/${resource}.yaml" 2>&1 || true
          done

      - name: Upload upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
          path: ${{ env.UPGRADE_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name "${KIND_CLUSTER}" || true

      - name: Delete kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG}"
