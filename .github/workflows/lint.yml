name: Lint

on:
  pull_request:

permissions:
  contents: read

# Opt JavaScript actions onto Node 24 ahead of GitHub's June 16, 2026 default
# flip. See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        env:
          # Skip mise.local.toml which contains dev-only tools not needed in CI
          MISE_LOCAL_CONFIG_ALLOWED: "0"

      - name: Run linter
        run: golangci-lint run

      - name: Package CRDs Helm chart
        run: |
          # Shallow PR checkouts have no tags, so the Makefile's git-describe
          # CHART_VERSION is empty and helm package rejects the chart.
          make crds-package CHART_VERSION=0.0.0 APP_VERSION=0.0.0

      - name: Verify generated CRD and RBAC are current
        run: git diff --exit-code -- config/crd/bases config/rbac/role.yaml

      - name: Check CRDs Helm release Secret size
        run: bash hack/check-crds-helm-secret-size.sh dist/crds-chart
