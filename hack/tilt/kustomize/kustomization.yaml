# Kustomize overlay for Tilt development
# Adds:
#   - PVC for Go build cache (faster incremental rebuilds)
#   - Adjusted resource limits for dev builds
#   - Removed leader election for single-replica dev

resources:
  - ../../../config/default
  - pvcs.yaml

patches:
  # Patch AcceleratorDetector GPU DaemonSet with imagePullSecrets for private registry.
  # Update the secret name to match your cluster's pull secret for ghcr.io/silogen.
  - target:
      kind: DaemonSet
      name: accelerator-detector-gpu
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: accelerator-detector-gpu
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull-secret

  # Patch AcceleratorDetector CPU DaemonSet with imagePullSecrets for private registry.
  - target:
      kind: DaemonSet
      name: accelerator-detector-cpu
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: accelerator-detector-cpu
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull-secret

  # Patch the deployment for development
  - target:
      kind: Deployment
      name: controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        template:
          spec:
            # Dev image runs as root for BuildKit cache mounts
            securityContext:
              runAsNonRoot: false
            containers:
              - name: manager
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  readOnlyRootFilesystem: false
                # Increased resources for in-container builds
                resources:
                  limits:
                    cpu: "4"
                    memory: 4Gi
                  requests:
                    cpu: "1"
                    memory: 1Gi
                # Override args: no leader election for single dev instance
                args:
                  - --health-probe-bind-address=:8081
                # Mount build cache
                volumeMounts:
                  - name: go-build-cache
                    mountPath: /root/.cache/go-build
                  - name: go-mod-cache
                    mountPath: /go/pkg/mod
            volumes:
              - name: go-build-cache
                persistentVolumeClaim:
                  claimName: aim-engine-go-build-cache
              - name: go-mod-cache
                persistentVolumeClaim:
                  claimName: aim-engine-go-mod-cache

# Image replacement - Tilt will match this and inject its built image
# Note: config/manager already transforms controller -> ghcr.io/amd-enterprise-ai/aim-engine
images:
  - name: ghcr.io/amd-enterprise-ai/aim-engine
    newName: ttl.sh/aim-placeholder/manager
    newTag: tilt
  # AcceleratorDetector images - override placeholders with test images.
  # Update newName/newTag to point at your private test registry.
  - name: accelerator-detector-gpu
    newName: ghcr.io/silogen/aim-base
    newTag: 0.11-rc113
  - name: accelerator-detector-cpu
    newName: ghcr.io/silogen/aim-epyc-base
    newTag: 0.11-rc201
