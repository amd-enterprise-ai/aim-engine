# Kustomize overlay for Tilt development
# Adds:
#   - PVC for Go build cache (faster incremental rebuilds)
#   - Adjusted resource limits for dev builds
#   - Removed leader election for single-replica dev

resources:
  - ../../../config/default
  - pvcs.yaml

patches:
  # Patch the deployment for development
  - target:
      kind: Deployment
      name: controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            # Dev image runs as root for BuildKit cache mounts
            securityContext:
              runAsNonRoot: false
            containers:
              - name: manager
                # Tilt matches this name and injects its build. Set here rather
                # than with an `images:` rule, which would have to match the
                # base image name that `make build-installer` rewrites.
                image: ttl.sh/aim-placeholder/manager:tilt
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  readOnlyRootFilesystem: false
                # Local development deliberately exercises the Envoy Gateway
                # activation contract. Production/default installs use none.
                env:
                  - name: AIM_GATEWAY_ACTIVATION_SCOPE
                    value: httproute
                # Increased resources for in-container builds
                resources:
                  limits:
                    cpu: "4"
                    memory: 4Gi
                  requests:
                    cpu: "1"
                    memory: 1Gi
                # Override args: no leader election for single dev instance
                args:
                  - --health-probe-bind-address=:8081
                # Mount build cache
                volumeMounts:
                  - name: go-build-cache
                    mountPath: /root/.cache/go-build
                  - name: go-mod-cache
                    mountPath: /go/pkg/mod
            volumes:
              - name: go-build-cache
                persistentVolumeClaim:
                  claimName: aim-engine-go-build-cache
              - name: go-mod-cache
                persistentVolumeClaim:
                  claimName: aim-engine-go-mod-cache
