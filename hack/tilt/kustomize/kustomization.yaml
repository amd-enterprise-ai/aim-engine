# Kustomize overlay for Tilt development
# Adds:
#   - PVC for Go build cache (faster incremental rebuilds)
#   - Adjusted resource limits for dev builds
#   - Removed leader election for single-replica dev

resources:
  - ../../../config/default
  - pvcs.yaml

patches:
  # Patch the deployment for development
  - target:
      kind: Deployment
      name: controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            # Dev image runs as root for BuildKit cache mounts
            securityContext:
              runAsNonRoot: false
            containers:
              - name: manager
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  readOnlyRootFilesystem: false
                # Increased resources for in-container builds
                resources:
                  limits:
                    cpu: "4"
                    memory: 4Gi
                  requests:
                    cpu: "1"
                    memory: 1Gi
                # Override args: no leader election for single dev instance
                args:
                  - --health-probe-bind-address=:8081
                # Mount build cache
                volumeMounts:
                  - name: go-build-cache
                    mountPath: /root/.cache/go-build
                  - name: go-mod-cache
                    mountPath: /go/pkg/mod
            volumes:
              - name: go-build-cache
                persistentVolumeClaim:
                  claimName: aim-engine-go-build-cache
              - name: go-mod-cache
                persistentVolumeClaim:
                  claimName: aim-engine-go-mod-cache

  # Exclude the bundled scale-from-zero collector from the Tilt build. It is
  # part of config/default (so install.yaml and the Helm chart ship it), but in
  # local dev the collector is installed standalone in the `keda` namespace by
  # `make install-scale-from-zero-prereq` (kind-create / vcluster-create).
  # Without these deletes Tilt would deploy a SECOND collector in aim-system,
  # double-scraping every kgateway pod and double-emitting to keda-otel-scaler.
  - patch: |
      $patch: delete
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: aim-engine-kgateway-metrics
        namespace: aim-system
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: aim-engine-kgateway-metrics-collector
        namespace: aim-system
  - patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: aim-engine-kgateway-metrics-collector
  - patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: aim-engine-kgateway-metrics-collector

# Image replacement - Tilt will match this and inject its built image
# Note: config/manager already transforms controller -> docker.io/silogenai/aim-engine
images:
  - name: docker.io/silogenai/aim-engine
    newName: ttl.sh/aim-placeholder/manager
    newTag: tilt
