# Fake AMD GPU nodes for the KWOK e2e lane (make fake-gpu-fleet).
#
# Each group becomes `count` nodes named fake-gpu-<name>-<index>. GPU nodes are
# tainted amd.com/gpu:NoSchedule, so only pods that tolerate it land on them.
# See docs/docs/contributing/testing.md#fake-gpu-nodes-kwok.
driverVersion: 6.16.6
groups:
  # Device-plugin nodes: allocatable amd.com/gpu, no ResourceSlice.
  - name: dp-mi300x
    count: 2
    numaNodes: 2
    gpus:
      - {model: mi300x, count: 8}
  - name: dp-mi300x-cpx
    count: 1
    numaNodes: 2
    gpus:
      - {model: mi300x, count: 8, partition: cpx-nps4}
  - name: dp-r9700
    count: 1
    gpus:
      - {model: r9700, count: 4}

  # DRA nodes: a gpu.amd.com ResourceSlice, no allocatable amd.com/gpu.
  - name: dra-mi355x
    count: 2
    mode: dra
    numaNodes: 2
    gpus:
      - {model: mi355x, count: 8}
  - name: dra-mi300x-cpx
    count: 1
    mode: dra
    numaNodes: 2
    gpus:
      - {model: mi300x, count: 8, partition: cpx-nps4}
