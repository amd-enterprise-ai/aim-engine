{{- if .Values.clusterRuntimeConfig.enable }}
# Fixed version. Helm matches this object by group, kind and name, so an
# upgrade updates it in place. The CRDs must already serve v1alpha2.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterRuntimeConfig
metadata:
  name: {{ .Values.clusterRuntimeConfig.name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- toYaml .Values.clusterRuntimeConfig.spec | nindent 2 }}
{{- end }}

