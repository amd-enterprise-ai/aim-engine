{{- if .Values.acceleratorDetector.enable }}
{{- $detectScript := .Files.Get "files/detect-and-label.py" }}
{{- $scriptChecksum := $detectScript | sha256sum }}
{{- $livenessThreshold := add (mul .Values.acceleratorDetector.detectInterval 2) 120 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-accelerator-detector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aim-accelerator-detector
    {{- include "chart.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-accelerator-detector-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aim-accelerator-detector
    {{- include "chart.labels" . | nindent 4 }}
data:
  detect-and-label.py: |
{{ $detectScript | indent 4 }}
{{- if .Values.acceleratorDetector.gpu.enable }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "chart.fullname" . }}-accelerator-detector-gpu
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aim-accelerator-detector
    app.kubernetes.io/component: gpu-detection
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aim-accelerator-detector
      app.kubernetes.io/component: gpu-detection
  template:
    metadata:
      annotations:
        checksum/detect-script: {{ $scriptChecksum }}
      labels:
        app.kubernetes.io/name: aim-accelerator-detector
        app.kubernetes.io/component: gpu-detection
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-accelerator-detector
      {{- with .Values.acceleratorDetector.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      tolerations:
        - operator: Exists
      {{- end }}
      {{- with .Values.acceleratorDetector.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: detector
          image: "{{ .Values.acceleratorDetector.gpu.image.repository }}:{{ .Values.acceleratorDetector.gpu.image.tag }}"
          imagePullPolicy: {{ .Values.acceleratorDetector.gpu.image.pullPolicy }}
          command: ["python3", "/scripts/detect-and-label.py"]
          env:
            - name: DETECT_TYPE
              value: "gpu"
            - name: ACCELERATOR_VENDOR
              value: "AMD"
            - name: DETECT_INTERVAL
              value: {{ .Values.acceleratorDetector.detectInterval | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import os; os.stat('/tmp/healthy')"
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time;assert time.time()-os.path.getmtime('/tmp/healthy')<{{ $livenessThreshold }}"
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: nfd-features
              mountPath: /nfd-features
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: dev-kfd
              mountPath: /dev/kfd
              readOnly: true
            - name: dev-dri
              mountPath: /dev/dri
              readOnly: true
          securityContext:
            privileged: true
          {{- with .Values.acceleratorDetector.gpu.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.acceleratorDetector.gpu.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nfd-features
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d/
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: {{ include "chart.fullname" . }}-accelerator-detector-script
            defaultMode: 0755
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
{{- end }}
{{- if .Values.acceleratorDetector.cpu.enable }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "chart.fullname" . }}-accelerator-detector-cpu
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aim-accelerator-detector
    app.kubernetes.io/component: cpu-detection
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aim-accelerator-detector
      app.kubernetes.io/component: cpu-detection
  template:
    metadata:
      annotations:
        checksum/detect-script: {{ $scriptChecksum }}
      labels:
        app.kubernetes.io/name: aim-accelerator-detector
        app.kubernetes.io/component: cpu-detection
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-accelerator-detector
      {{- with .Values.acceleratorDetector.cpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      tolerations:
        - operator: Exists
      {{- end }}
      {{- with .Values.acceleratorDetector.cpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # NFD's features.d lives under /etc/kubernetes on the host and is
      # root-owned. The GPU detector (privileged) creates it, so on
      # heterogeneous nodes the nonroot CPU container can't write its
      # feature file. chmod it once from a root init container and keep
      # the main container hardened (nonroot, no caps).
      initContainers:
        - name: prep-features-dir
          image: "{{ .Values.acceleratorDetector.cpu.image.repository }}:{{ .Values.acceleratorDetector.cpu.image.tag }}"
          imagePullPolicy: {{ .Values.acceleratorDetector.cpu.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /nfd-features && chmod 0777 /nfd-features"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: nfd-features
              mountPath: /nfd-features
      containers:
        - name: detector
          image: "{{ .Values.acceleratorDetector.cpu.image.repository }}:{{ .Values.acceleratorDetector.cpu.image.tag }}"
          imagePullPolicy: {{ .Values.acceleratorDetector.cpu.image.pullPolicy }}
          command: ["python3", "/scripts/detect-and-label.py"]
          env:
            - name: DETECT_TYPE
              value: "cpu"
            - name: ACCELERATOR_VENDOR
              value: "AMD"
            - name: DETECT_INTERVAL
              value: {{ .Values.acceleratorDetector.detectInterval | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import os; os.stat('/tmp/healthy')"
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time;assert time.time()-os.path.getmtime('/tmp/healthy')<{{ $livenessThreshold }}"
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: nfd-features
              mountPath: /nfd-features
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: host-proc-cpuinfo
              mountPath: /proc/cpuinfo
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.acceleratorDetector.cpu.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.acceleratorDetector.cpu.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nfd-features
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d/
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: {{ include "chart.fullname" . }}-accelerator-detector-script
            defaultMode: 0755
        - name: host-proc-cpuinfo
          hostPath:
            path: /proc/cpuinfo
            type: File
{{- end }}
{{- if .Values.acceleratorDetector.nvidia.enable }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "chart.fullname" . }}-accelerator-detector-nvidia
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aim-accelerator-detector
    app.kubernetes.io/component: nvidia-detection
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aim-accelerator-detector
      app.kubernetes.io/component: nvidia-detection
  template:
    metadata:
      annotations:
        checksum/detect-script: {{ $scriptChecksum }}
      labels:
        app.kubernetes.io/name: aim-accelerator-detector
        app.kubernetes.io/component: nvidia-detection
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-accelerator-detector
      {{- with .Values.acceleratorDetector.nvidia.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.acceleratorDetector.nvidia.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      tolerations:
        - operator: Exists
      {{- end }}
      {{- with .Values.acceleratorDetector.nvidia.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # NFD's features.d lives under /etc/kubernetes on the host and is
      # root-owned. On heterogeneous nodes another (privileged) detector may
      # have created it; chmod it once from a root init container so the
      # hardened nonroot main container can write its feature file.
      initContainers:
        - name: prep-features-dir
          image: "{{ .Values.acceleratorDetector.nvidia.image.repository }}:{{ .Values.acceleratorDetector.nvidia.image.tag }}"
          imagePullPolicy: {{ .Values.acceleratorDetector.nvidia.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /nfd-features && chmod 0777 /nfd-features"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: nfd-features
              mountPath: /nfd-features
      containers:
        - name: detector
          image: "{{ .Values.acceleratorDetector.nvidia.image.repository }}:{{ .Values.acceleratorDetector.nvidia.image.tag }}"
          imagePullPolicy: {{ .Values.acceleratorDetector.nvidia.image.pullPolicy }}
          command: ["python3", "/scripts/detect-and-label.py"]
          env:
            - name: DETECT_TYPE
              value: "gpu"
            - name: ACCELERATOR_VENDOR
              value: "NVIDIA"
            # Inject all GPUs into the container without consuming a
            # nvidia.com/gpu device-plugin slot, and request the "utility"
            # driver capability so the runtime mounts nvidia-smi + libnvidia-ml.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "utility"
            - name: DETECT_INTERVAL
              value: {{ .Values.acceleratorDetector.detectInterval | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import os; os.stat('/tmp/healthy')"
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time;assert time.time()-os.path.getmtime('/tmp/healthy')<{{ $livenessThreshold }}"
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: nfd-features
              mountPath: /nfd-features
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.acceleratorDetector.nvidia.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.acceleratorDetector.nvidia.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nfd-features
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d/
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: {{ include "chart.fullname" . }}-accelerator-detector-script
            defaultMode: 0755
{{- end }}
{{- end }}
