apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterComposition
metadata:
  name: local-pd
spec:
  mode: PrefillDecode
  transport:
    preset: local-kv
  profileSelector:
    engine: vllm
  prefill:
    profile:
      selector:
        metric: throughput
  decode:
    profile:
      selector:
        metric: latency
---
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: qwen-recipe
  namespace: team-a
spec:
  model:
    name: qwen3-32b
  composition:
    ref:
      kind: AIMClusterComposition
      name: local-pd
    decode:
      replicas: 2
