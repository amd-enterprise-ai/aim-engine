apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: qwen-inline
  namespace: team-a
spec:
  model:
    name: qwen3-32b
  composition:
    prefill:
      profile:
        selector:
          metric: throughput
    decode:
      replicas: 2
      profile:
        selector:
          metric: latency
