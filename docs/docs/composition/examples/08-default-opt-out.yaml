apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: qwen-explicit
  namespace: team-a
spec:
  model:
    name: qwen3-32b
  composition:
    mode: PrefillDecode
    inheritSelectorDefaults: false
    profileSelector:
      engine: vllm
    prefill:
      profile:
        selector:
          metric: throughput
    decode:
      profile:
        selector:
          metric: latency
