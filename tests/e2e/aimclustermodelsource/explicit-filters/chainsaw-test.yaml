# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMClusterModelSource Test: Explicit images via spec.filters
#
# Complements auto-sourcing (spec.images) by validating the same discovery path
# when each image is declared as a ModelSourceFilter entry.
#
# Tested behavior:
# - Models are created from explicit filter.image entries (tagged repos)
# - Source reaches Ready status
# - Models have correct labels (model-source, origin)
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: explicit-filters-cluster-models
spec:
  description: Test AIMClusterModelSource creates cluster models from spec.filters explicit images
  steps:
    - name: Create AIMClusterModelSource with filters
      try:
        - apply:
            file: cluster-model-source.yaml

    - name: Wait for source to become Ready
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: test-explicit-filters
              status:
                status: Ready
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: Verify models were created with correct labels
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModel
              metadata:
                labels:
                  aim.eai.amd.com/model-source: test-explicit-filters
                  aim.eai.amd.com/origin: auto-generated
