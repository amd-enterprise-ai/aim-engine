# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMClusterModelSource Test: Previous-Release Discovered Model
#
# After an upgrade, a source must keep the AIMClusterModels that an earlier
# release discovered and wrote through v1alpha1, instead of re-creating them.
#
# Tested behavior:
# - A discovered model written at v1alpha1 keeps its UID after the source
#   reconciles, and the source creates no second model for its image.
# - Once that model is deleted, the source's AIMClusterModel watch re-creates
#   it, written through v1alpha2.
#
# Isolation: AIMClusterModel/AIMClusterModelSource are cluster-scoped and share
# one global namespace. With chainsaw parallelism, names must be unique per run,
# so all cluster-scoped names and the image embed the $namespace binding.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: previous-release-discovered-model
spec:
  description: Source keeps a model an earlier release discovered, and re-creates it at v1alpha2 once deleted
  steps:
    # Script outputs are scoped to their step, so the UID is recorded and
    # compared within this one step.
    - name: Keep the UID of a model the previous release discovered
      try:
        - apply:
            file: previous-release-model.yaml
        - script:
            content: |
              kubectl get aimclustermodel "test-previous-release-model-${NAMESPACE}" -o jsonpath='{.metadata.uid}'
            outputs:
              - name: previousReleaseUID
                value: ($stdout)
        - apply:
            file: cluster-model-source.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: (join('-', ['test-previous-release', $namespace]))
              status:
                status: Ready
                discoveredModels: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: (join('-', ['test-previous-release-model', $namespace]))
                uid: ($previousReleaseUID)
        - script:
            content: |
              count=$(kubectl get aimclustermodels -l "aim.eai.amd.com/model-source=test-previous-release-${NAMESPACE}" -o name | wc -l)
              echo "AIMClusterModels labelled for the source: $count"
              [ "$count" -eq 1 ]

    - name: Delete the previous-release model
      try:
        - delete:
            ref:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              name: (join('-', ['test-previous-release-model', $namespace]))

    # The managedFields entry of the source's field manager records the API
    # version the source wrote the model through. The timeout covers the 30s
    # per-source registry floor that delays the watch-triggered sync.
    - name: Verify the source re-creates the model at v1alpha2
      try:
        - assert:
            timeout: 90s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                labels:
                  aim.eai.amd.com/model-source: (join('-', ['test-previous-release', $namespace]))
                (managedFields[?manager == 'aim-cluster-model-source-controller'].apiVersion):
                  - aim.eai.amd.com/v1alpha2
              spec:
                image: (join('', ['registry.invalid/', $namespace, '/previous-release:1.0']))
