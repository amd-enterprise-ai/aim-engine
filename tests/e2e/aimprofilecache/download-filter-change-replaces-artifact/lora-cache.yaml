# The Shared cache an adapter-enabled AIMService on filter-change-lora creates.
# Declared directly so the test does not depend on a deployable service; the
# adapter disk those services add to its artifact is patched on by the test.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfileCache
metadata:
  name: filter-change-lora-cache
spec:
  profileName: filter-change-lora
  profileScope: Namespace
  mode: Shared
