apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v0.2.7-setup
  labels:
    requires: upgrade-workflow
spec:
  description: |
    Creates the v0.2.7 corpus that the upgrade guide's migration-window steps
    clean up: Shared and Dedicated services on the template pipeline, an image
    model that emits templates and discovers a CPU profile, and a model source
    whose discovered cluster model emits cluster templates. A third, Shared
    template service is moved later with v0.2.7's aim-template-migration.
  timeouts:
    assert: 420s
    cleanup: 180s
  steps:
    - name: Create the v0.2.7 corpus
      try:
        - apply:
            file: resources.yaml

    - name: Wait for the image model, its templates and its CPU profile
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: upgrade-image-model
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMServiceTemplate
              metadata:
                name: upgrade-cpu-template
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMServiceTemplate
              metadata:
                name: upgrade-migrated-template
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                labels:
                  aim.eai.amd.com/source-model: upgrade-image-model
              status:
                status: Ready

    - name: Wait for the discovered cluster model and its cluster templates
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                labels:
                  aim.eai.amd.com/model-source: upgrade-model-source
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterServiceTemplate
              status:
                status: Ready

    - name: Wait for the template services and their caches
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-shared-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-dedicated-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-migrated-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-shared-service
              spec:
                mode: Shared
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-dedicated-service
              spec:
                mode: Dedicated
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-migrated-service
              spec:
                mode: Shared
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-shared-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-dedicated-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-migrated-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
