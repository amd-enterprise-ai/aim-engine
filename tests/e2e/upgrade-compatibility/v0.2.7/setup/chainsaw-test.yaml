apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v0.2.7-setup
  labels:
    requires: upgrade-workflow
spec:
  description: |
    Creates the v0.2.7 corpus that the upgrade guide's migration-window steps
    clean up: Shared and Dedicated services on the template pipeline, an image
    model that emits templates and discovers a CPU profile, a model source
    whose discovered cluster model emits cluster templates, and a model artifact
    with an adapter disk and an adapter linked to it.
    A third, Shared template service is moved later with
    v0.2.7's aim-template-migration. A spec.model.custom service, which the
    guide replaces with an AIMProfile of another model, and a ConfigMap with a
    v1alpha1 owner reference to it. An autoscaled service on the profile
    pipeline, whose metrics collector KServe created and injected.
  timeouts:
    assert: 420s
    cleanup: 180s
  steps:
    - name: Create the v0.2.7 corpus
      try:
        - apply:
            file: resources.yaml

    - name: Wait for the image model, its templates and its CPU profile
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: upgrade-image-model
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMServiceTemplate
              metadata:
                name: upgrade-cpu-template
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMServiceTemplate
              metadata:
                name: upgrade-migrated-template
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                labels:
                  aim.eai.amd.com/source-model: upgrade-image-model
              status:
                status: Ready

    - name: Wait for the discovered cluster model and its cluster templates
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                labels:
                  aim.eai.amd.com/model-source: upgrade-model-source
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterServiceTemplate
              status:
                status: Ready
        - script:
            content: |
              set -eu
              uid=$(kubectl get aimclustermodelsource upgrade-model-source -o jsonpath='{.metadata.uid}')
              kubectl get aimclustermodel -l aim.eai.amd.com/model-source=upgrade-model-source -o json \
                | jq -e --arg uid "$uid" '
                    [.items[] | .metadata.ownerReferences[]? | select(.uid == $uid) | .apiVersion]
                    == ["aim.eai.amd.com/v1alpha1"]
                  ' >/dev/null

    - name: Wait for the template services and their caches
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-shared-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-dedicated-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-migrated-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-shared-service
              spec:
                mode: Shared
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-dedicated-service
              spec:
                mode: Dedicated
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-migrated-service
              spec:
                mode: Shared
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-shared-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-dedicated-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-migrated-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: Wait for the custom service, its generated model and its replacement model
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-custom-service
              status:
                status: Running
                reconcilerPipeline: template
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                labels:
                  aim.eai.amd.com/custom-model: "true"
                  aim.eai.amd.com/service: upgrade-custom-service
                (annotations."aim.eai.amd.com/legacy-auto-custom-spec" != null): true
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-custom-service
              spec:
                mode: Shared
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-custom-service
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: upgrade-custom-weights
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                labels:
                  aim.eai.amd.com/source-model: upgrade-custom-weights
              spec:
                acceleratorType: cpu
              status:
                status: Ready

    - name: Wait for the autoscaled service and the collector KServe created
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-autoscaled-service
              status:
                status: Running
                reconcilerPipeline: profile
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-autoscaled-service
                  app.kubernetes.io/component: inference
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        # KServe's collector has no labels, so it is found through the name of
        # the InferenceService.
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              isvc=$(kubectl get inferenceservices -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=upgrade-autoscaled-service -o jsonpath='{.items[0].metadata.name}')
              kubectl get opentelemetrycollectors.opentelemetry.io "${isvc}-predictor" -n "$NAMESPACE" -o json \
                | jq -e --arg isvc "$isvc" '
                    [.metadata.ownerReferences[] | select(.controller) | "\(.kind)/\(.name)"] == ["InferenceService/\($isvc)"]
                    and .spec.securityContext == null
                  ' >/dev/null
              kubectl get pods -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=upgrade-autoscaled-service,app.kubernetes.io/component=inference -o json \
                | jq -e '[.items[] | [.spec.initContainers[]?, .spec.containers[]] | any(.name == "otc-container")] | all and length > 0' \
                >/dev/null

    - name: Create a ConfigMap owned through a v1alpha1 owner reference
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              uid="$(kubectl get aimservice upgrade-custom-service -n "${NAMESPACE}" -o jsonpath='{.metadata.uid}')"
              kubectl apply -n "${NAMESPACE}" -f - <<EOF
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: upgrade-v1alpha1-owned
                ownerReferences:
                  - apiVersion: aim.eai.amd.com/v1alpha1
                    kind: AIMService
                    name: upgrade-custom-service
                    uid: ${uid}
                    blockOwnerDeletion: true
              EOF

    - name: Wait for the model artifact, its PVCs, and its adapter
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: upgrade-model-artifact
              status:
                status: Ready
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              kubectl get pvc -n "$NAMESPACE" -l aim.eai.amd.com/cache.name=upgrade-model-artifact -o json \
                | jq -e '
                    [
                      .items[]
                      | [.metadata.ownerReferences[]?
                          | select(.kind == "AIMArtifact" and .name == "upgrade-model-artifact")
                          | .apiVersion]
                    ] == [["aim.eai.amd.com/v1alpha1"], ["aim.eai.amd.com/v1alpha1"]]
                  ' >/dev/null
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              uid=$(kubectl get aimartifact upgrade-model-artifact -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
              kubectl get aimartifact upgrade-adapter-artifact -n "$NAMESPACE" -o json \
                | jq -e --arg uid "$uid" '
                    [.metadata.ownerReferences[]? | select(.uid == $uid) | .apiVersion]
                    == ["aim.eai.amd.com/v1alpha1"]
                  ' >/dev/null
