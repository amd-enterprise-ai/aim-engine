apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMModel
metadata:
  name: upgrade-image-model
spec:
  image: docker.io/amdenterpriseai/aim-dummy:0.2.0
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMServiceTemplate
metadata:
  name: upgrade-cpu-template
spec:
  modelName: upgrade-image-model
  aimId: HuggingFaceTB/SmolLM2-135M
  modelId: HuggingFaceTB/SmolLM2-135M
  metric: latency
  precision: bf16
  type: unoptimized
  hardware:
    # A zero-count GPU shape with a custom profile requests no accelerator on
    # the CPU-only Kind nodes.
    gpu:
      requests: 0
  customProfile:
    engineArgs:
      dtype: bfloat16
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  # The same source as the image's discovered CPU profile, so a Shared profile
  # cache adopts this template cache's artifact after the move.
  modelSources:
    - modelId: HuggingFaceTB/SmolLM2-135M
      sourceUri: hf://HuggingFaceTB/SmolLM2-135M
      size: 1Mi
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: upgrade-shared-service
spec:
  replicas: 1
  model:
    name: upgrade-image-model
  template:
    name: upgrade-cpu-template
    allowUnoptimized: true
  caching:
    mode: Shared
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "1"
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: upgrade-dedicated-service
spec:
  replicas: 1
  model:
    name: upgrade-image-model
  template:
    name: upgrade-cpu-template
    allowUnoptimized: true
  caching:
    mode: Dedicated
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "1"
---
# The lane moves upgrade-migrated-service with v0.2.7's aim-template-migration.
# Its own template and model source keep that tool's plan for it independent of
# the services the guide moves.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMServiceTemplate
metadata:
  name: upgrade-migrated-template
spec:
  modelName: upgrade-image-model
  aimId: example/upgrade-migrated-model
  modelId: example/upgrade-migrated-model
  metric: latency
  precision: fp16
  type: unoptimized
  hardware:
    gpu:
      requests: 0
  customProfile:
    engineArgs:
      dtype: float16
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  modelSources:
    - modelId: example/upgrade-migrated-model
      sourceUri: hf://example/upgrade-migrated-model
      size: 1Mi
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: upgrade-migrated-service
spec:
  replicas: 1
  model:
    name: upgrade-image-model
  template:
    name: upgrade-migrated-template
    allowUnoptimized: true
  caching:
    mode: Shared
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "1"
---
# The upgrade guide replaces upgrade-custom-service with an AIMProfile of this
# model. Its discovered CPU profile has the service's model source, so the
# Shared profile cache adopts the template-era artifact.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMModel
metadata:
  name: upgrade-custom-weights
spec:
  image: docker.io/amdenterpriseai/aim-dummy:0.2.0
  discovery:
    createServiceTemplates: false
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: upgrade-custom-service
spec:
  replicas: 1
  model:
    custom:
      baseImage: docker.io/amdenterpriseai/aim-dummy:0.2.0
      modelSources:
        - modelId: HuggingFaceTB/SmolLM2-135M
          sourceUri: hf://HuggingFaceTB/SmolLM2-135M
          size: 1Mi
      hardware:
        cpu:
          requests: 500m
  template:
    allowUnoptimized: true
  caching:
    mode: Shared
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "1"
---
# An autoscaled service on v0.2.7's profile pipeline, for which KServe creates
# the OpenTelemetryCollector. The upgrade hands the collector to AIM Engine and
# the rollback hands it back to KServe, both without restarting the predictor
# pod. Its own model source keeps its profile cache apart from the artifacts
# that the moved services adopt.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: upgrade-autoscaled-profile
spec:
  aimId: example/upgrade-autoscaled-model
  modelId: example/upgrade-autoscaled-model
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: false
  image: docker.io/amdenterpriseai/aim-dummy:0.2.0
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  modelSources:
    - modelId: example/upgrade-autoscaled-model
      sourceUri: hf://example/upgrade-autoscaled-model
      size: 1Mi
---
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: upgrade-autoscaled-service
spec:
  profile:
    name: upgrade-autoscaled-profile
  minReplicas: 1
  maxReplicas: 2
  autoScaling:
    metrics:
      - type: PodMetric
        podmetric:
          metric:
            backend: opentelemetry
            metricNames:
              - vllm:num_requests_running
            query: vllm:num_requests_running
          target:
            type: Value
            value: "1"
  caching:
    mode: Shared
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "1"
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterModelSource
metadata:
  name: upgrade-model-source
spec:
  images:
    - amdenterpriseai/aim-dummy:0.2.2
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: upgrade-model-artifact
spec:
  type: model
  sourceUri: hf://upgrade-example/adapter-disk
  size: 10Mi
  adapterDisk:
    size: 1Gi
  env:
    - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
      value: "true"
    - name: AIM_DEBUG_SIMULATE_HF_DURATION
      value: "1"
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: upgrade-adapter-artifact
spec:
  type: adapter
  parentArtifact: upgrade-model-artifact
  modelId: upgrade-example/adapter
  sourceUri: hf://upgrade-example/adapter
