apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v0.2.7-rollback
  labels:
    requires: upgrade-workflow
spec:
  description: |
    After the upgrade guide's rollback, the v0.2.7 operator replaced the
    candidate and runs without restarts. The services moved to the profile
    pipeline before the upgrade, and the service created after it with only
    spec.model.name, stay on it. KServe controls the autoscaled service's
    collector again. The PVCs, adapter and discovered model whose
    owner references the candidate moved to v1alpha2 still exist, although
    v0.2.7 doesn't serve that version.
  timeouts:
    assert: 300s
  steps:
    # With only the operator rolled back, the candidate pod keeps running.
    - name: The v0.2.7 operator replaced the candidate
      try:
        - script:
            content: |
              set -eu
              tags=$(kubectl get pods -n aim-system -l control-plane=controller-manager -o json \
                | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)
                  | .spec.containers[] | select(.name == "manager") | .image | split(":") | last] | join(" ")')
              if [ "$tags" != "v0.2.7" ]; then
                echo "ERROR: the manager containers run image tags '$tags', want 'v0.2.7'"
                exit 1
              fi

    - name: Moved and post-upgrade services stay on the profile pipeline
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-shared-service
              status:
                reconcilerPipeline: profile
                status: Running
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-dedicated-service
              status:
                reconcilerPipeline: profile
                status: Running
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-migrated-service
              status:
                reconcilerPipeline: profile
                status: Running
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-post-upgrade-service
              status:
                reconcilerPipeline: profile

    # v0.2.7 passes the metrics to the InferenceService again, so KServe
    # updates the collector AIM Engine created and becomes its controller. The
    # lane compares the predictor pods with the ones before the rollback.
    - name: KServe took the autoscaled service's collector back
      try:
        - script:
            timeout: 3m
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              isvc=$(kubectl get inferenceservices -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=upgrade-autoscaled-service -o jsonpath='{.items[0].metadata.name}')
              for attempt in $(seq 1 30); do
                if kubectl get opentelemetrycollectors.opentelemetry.io "${isvc}-predictor" -n "$NAMESPACE" -o json \
                  | jq -e --arg isvc "$isvc" '
                      [.metadata.ownerReferences[] | select(.controller) | "\(.kind)/\(.name)"] == ["InferenceService/\($isvc)"]
                      and .spec.securityContext == null
                    ' >/dev/null; then
                  exit 0
                fi
                sleep 5
              done
              echo "ERROR: KServe does not control the collector ${isvc}-predictor:"
              kubectl get opentelemetrycollectors.opentelemetry.io "${isvc}-predictor" -n "$NAMESPACE" -o yaml
              exit 1

    # A v0.2.7 pod that can't sync its watches exits about every two minutes
    # and reports Ready in between, so readiness alone doesn't show it.
    - name: The v0.2.7 operator runs for 3 minutes without a restart
      try:
        - sleep:
            duration: 3m
        - script:
            content: |
              set -eu
              manager=$(kubectl get pods -n aim-system -l control-plane=controller-manager -o json \
                | jq -r '.items[] | select(.metadata.deletionTimestamp == null)
                  | .status.containerStatuses[] | select(.name == "manager")
                  | "ready=\(.ready) restarts=\(.restartCount) running-3m=\((.state.running.startedAt // empty | fromdateiso8601) <= now - 180)"')
              if [ "$manager" != "ready=true restarts=0 running-3m=true" ]; then
                echo "ERROR: the manager container is '$manager', want 'ready=true restarts=0 running-3m=true'"
                exit 1
              fi
              # v0.2.7 can't map the v1alpha2 AIMArtifact owners of the candidate's PVCs, so
              # its owner event handler logs each PVC event; that isn't a failed watch.
              if kubectl logs -n aim-system deployment/aim-engine-controller-manager -c manager --tail=-1 \
                | grep -v '"logger":"controller-runtime.eventhandler.enqueueRequestForOwner"' \
                | grep -E 'no matches for kind|Could not wait for Cache to sync'; then
                echo "ERROR: the operator log shows a watch that never synced"
                exit 1
              fi

    - name: Children with v1alpha2 owners survive the rollback
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              kubectl get pvc -n "$NAMESPACE" -l aim.eai.amd.com/cache.name=upgrade-model-artifact -o json \
                | jq -e '.items | length == 2' >/dev/null
              # kubectl's discovery cache from before the rollback still maps AIMArtifact to v1alpha2.
              kubectl get aimartifacts.v1alpha1.aim.eai.amd.com upgrade-adapter-artifact -n "$NAMESPACE" >/dev/null
              kubectl get aimclustermodel -l aim.eai.amd.com/model-source=upgrade-model-source -o json \
                | jq -e '.items | length == 1' >/dev/null
