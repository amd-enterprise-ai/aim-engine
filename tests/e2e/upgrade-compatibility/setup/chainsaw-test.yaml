apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: upgrade-compatibility-setup
  labels:
    requires: upgrade-workflow
spec:
  description: |
    Creates a registry-independent corpus under the baseline operator. It covers
    namespace and cluster profiles, model-owned profile derivation, profile sets,
    services, simulated profile caches, a model artifact with an adapter disk,
    an adapter artifact linked to that model, and a model source that discovers
    one image.
    The workflow keeps these resources in place while it upgrades the CRDs and operator.
  timeouts:
    assert: 180s
    cleanup: 180s
  steps:
    - name: Create the baseline resource corpus
      try:
        - apply:
            file: resources.yaml

    - name: Wait for source profiles
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: upgrade-namespace-source
              status:
                status: Ready
                version: 0.2.0
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterProfile
              metadata:
                name: upgrade-cluster-source
              status:
                status: Ready
                version: 0.2.0

    - name: Wait for model-owned profile derivation
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileSet
              metadata:
                labels:
                  aim.eai.amd.com/source-model: upgrade-namespace-model
                  aim.eai.amd.com/source-model-scope: namespace
              status:
                status: Ready
                managedProfiles:
                  total: 1
                  ready: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                labels:
                  aim.eai.amd.com/profile-origin: derived
                  aim.eai.amd.com/source-model: upgrade-namespace-model
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: upgrade-namespace-model
              status:
                status: Ready
                managedProfiles:
                  total: 1
                  ready: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterProfileSet
              metadata:
                labels:
                  aim.eai.amd.com/source-model: upgrade-cluster-model
                  aim.eai.amd.com/source-model-scope: cluster
              status:
                status: Ready
                managedProfiles:
                  total: 1
                  ready: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterProfile
              metadata:
                labels:
                  aim.eai.amd.com/profile-origin: derived
                  aim.eai.amd.com/source-model: upgrade-cluster-model
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: upgrade-cluster-model
              status:
                status: Ready
                managedProfiles:
                  total: 1
                  ready: 1

    - name: Wait for namespace and cluster profile consumers
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-namespace-service
              status:
                (conditions[?type == 'ProfileReady']):
                  - status: "True"
                    reason: ProfileResolved
                resolvedProfile:
                  name: upgrade-namespace-source
                  scope: Namespace
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: upgrade-cluster-service
              status:
                (conditions[?type == 'ProfileReady']):
                  - status: "True"
                    reason: ProfileResolved
                resolvedProfile:
                  name: upgrade-cluster-source
                  scope: Cluster
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-namespace-service
              status:
                status: Ready
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileCache
              metadata:
                labels:
                  aim.eai.amd.com/service: upgrade-cluster-service
              status:
                status: Ready

    - name: Wait for the model artifact, its PVCs, and its adapter
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: upgrade-model-artifact
              status:
                status: Ready
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              kubectl get pvc -n "$NAMESPACE" -l aim.eai.amd.com/cache.name=upgrade-model-artifact -o json \
                | jq -e '
                    [
                      .items[]
                      | [.metadata.ownerReferences[]?
                          | select(.kind == "AIMArtifact" and .name == "upgrade-model-artifact")
                          | .apiVersion]
                    ] == [["aim.eai.amd.com/v1alpha2"], ["aim.eai.amd.com/v1alpha2"]]
                  ' >/dev/null
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              uid=$(kubectl get aimartifact upgrade-model-artifact -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')
              kubectl get aimartifact upgrade-adapter-artifact -n "$NAMESPACE" -o json \
                | jq -e --arg uid "$uid" '
                    [.metadata.ownerReferences[]? | select(.uid == $uid) | .apiVersion]
                    == ["aim.eai.amd.com/v1alpha2"]
                  ' >/dev/null

    - name: Wait for the discovered cluster model
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: upgrade-model-source
              status:
                status: Ready
                discoveredModels: 1
        - script:
            content: |
              set -eu
              uid=$(kubectl get aimclustermodelsource upgrade-model-source -o jsonpath='{.metadata.uid}')
              kubectl get aimclustermodel -l aim.eai.amd.com/model-source=upgrade-model-source -o json \
                | jq -e --arg uid "$uid" '
                    [.items[] | .metadata.ownerReferences[]? | select(.uid == $uid) | .apiVersion]
                    == ["aim.eai.amd.com/v1alpha2"]
                  ' >/dev/null
