# Namespace-scoped official template owned by base-model-b. Identical to
# template-a in every matchable dimension; the only thing that differs is
# its source owner — which the fine-tuned image resolver uses to stamp a
# different deployment-image-ref annotation on the copy derived from this
# template.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMServiceTemplate
metadata:
  name: ft-multi-template-b
spec:
  modelName: ft-multi-base-b
  aimId: test/ft-multi-llama
  modelId: test/ft-multi-fp8
  hardware:
    gpu:
      requests: 1
      model: MI300X
  modelSources:
    - modelId: test/ft-multi-fp8
      sourceUri: hf://test/ft-multi-fp8
      size: 100Mi
