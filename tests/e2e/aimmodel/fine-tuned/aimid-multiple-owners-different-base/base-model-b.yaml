# Namespace-scoped base model representing a different base-image family
# (e.g. aim-cpu-base) for the same canonical aimId as base-model-a. The
# deployment image resolver must produce a *different* deployment-image-ref
# annotation for the copy derived from this owner — which is the behavior
# this test exercises.
#
# Owner B deliberately uses a Docker Hub spec.image (no registry prefix means
# docker.io/amdenterpriseai/...) while keeping baseImageRef on
# ghcr.io/silogen/... . The resolver must use that baseImageRef as canonical
# input to RuntimeConfig mapping; source-image placement does not imply a
# runtime-image mirror.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMModel
metadata:
  name: ft-multi-base-b
spec:
  image: amdenterpriseai/aim-multi-llama-cpu:0.1.10
  discovery:
    createServiceTemplates: false
  imageMetadata:
    baseImageRef: ghcr.io/silogen/aim-multi-cpu-base:0.11
    model:
      canonicalName: ft-multi-llama-cpu
