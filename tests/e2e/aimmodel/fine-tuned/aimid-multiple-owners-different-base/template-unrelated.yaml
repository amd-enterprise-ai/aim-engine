# Negative case: same aimId as the matched templates, but a different
# modelId. The fine-tuned model's modelSources[].modelId does not include
# this id, so the controller must NOT produce a copy from this template.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMServiceTemplate
metadata:
  name: ft-multi-template-unrelated
spec:
  modelName: ft-multi-base-a
  aimId: test/ft-multi-llama
  modelId: test/ft-multi-other-id
  hardware:
    gpu:
      requests: 1
      model: MI300X
  modelSources:
    - modelId: test/ft-multi-other-id
      sourceUri: hf://test/ft-multi-other-id
      size: 100Mi
