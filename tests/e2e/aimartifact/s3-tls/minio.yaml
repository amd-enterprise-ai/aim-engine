apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-tls
    spec:
      containers:
      - name: minio
        image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        imagePullPolicy: IfNotPresent
        args:
        - server
        - --certs-dir
        - /certs
        - /data
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        ports:
        - name: api
          containerPort: 9000
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 2
          periodSeconds: 2
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tls
          mountPath: /certs
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: tls
        secret:
          secretName: minio-tls
          items:
          - key: tls.crt
            path: public.crt
          - key: tls.key
            path: private.key
---
apiVersion: v1
kind: Service
metadata:
  name: minio-admin
spec:
  selector:
    app.kubernetes.io/name: minio-tls
  ports:
  - name: api
    port: 9000
    targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: minio-mismatch
spec:
  selector:
    app.kubernetes.io/name: minio-tls
  ports:
  - name: api
    port: 9000
    targetPort: api
