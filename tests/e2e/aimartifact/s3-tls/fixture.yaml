apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
stringData:
  accessKeyId: seaweedadmin
  secretAccessKey: seaweedadmin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-seaweedfs-tls
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: seed
        image: docker.io/amazon/aws-cli:2.38.6
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ENDPOINT_URL
          value: https://seaweedfs-admin:8333
        - name: AWS_CA_BUNDLE
          value: /etc/s3-ca/ca.crt
        - name: AWS_ACCESS_KEY_ID
          value: seaweedadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedadmin
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          until aws s3 ls >/dev/null; do
            sleep 2
          done
          aws s3api head-bucket --bucket models 2>/dev/null || aws s3 mb s3://models
          mkdir -p /tmp/seed/nested
          printf '{"tls":true}\n' > /tmp/seed/config.json
          printf 'private-ca model weights\n' > /tmp/seed/nested/weights.bin
          aws s3 cp --recursive --no-progress /tmp/seed/ s3://models/tls-model/
        volumeMounts:
        - name: s3-ca
          mountPath: /etc/s3-ca
          readOnly: true
      volumes:
      - name: s3-ca
        secret:
          secretName: s3-root-ca
          items:
          - key: tls.crt
            path: ca.crt
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: tls-configmap
spec:
  additionalCABundleRef:
    name: s3-root-ca
    key: ca.crt
  artifact:
    s3:
      endpoint: https://seaweedfs-admin:8333
      region: us-east-1
      addressingStyle: path
      signatureVersion: s3v4
      auth:
        mode: static
        credentialsSecretRef:
          name: seaweedfs-credentials
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: tls-secret
spec:
  artifact:
    s3:
      endpoint: https://seaweedfs-admin:8333
      region: us-east-1
      addressingStyle: path
      signatureVersion: s3v4
      auth:
        mode: static
        credentialsSecretRef:
          name: seaweedfs-credentials
      tls:
        caBundleRef:
          kind: Secret
          name: s3-root-ca
          key: tls.crt
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: tls-insecure
spec:
  artifact:
    s3:
      endpoint: https://seaweedfs-mismatch:8333
      region: us-east-1
      addressingStyle: path
      signatureVersion: s3v4
      auth:
        mode: static
        credentialsSecretRef:
          name: seaweedfs-credentials
      tls:
        insecureSkipVerify: true
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: tls-untrusted
spec:
  artifact:
    s3:
      endpoint: https://seaweedfs-admin:8333
      region: us-east-1
      addressingStyle: path
      signatureVersion: s3v4
      auth:
        mode: static
        credentialsSecretRef:
          name: seaweedfs-credentials
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: tls-hostname-mismatch
spec:
  artifact:
    s3:
      endpoint: https://seaweedfs-mismatch:8333
      region: us-east-1
      addressingStyle: path
      signatureVersion: s3v4
      auth:
        mode: static
        credentialsSecretRef:
          name: seaweedfs-credentials
      tls:
        caBundleRef:
          kind: Secret
          name: s3-root-ca
          key: tls.crt
