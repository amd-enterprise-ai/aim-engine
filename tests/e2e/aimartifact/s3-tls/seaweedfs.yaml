apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [{"accessKey": "seaweedadmin", "secretKey": "seaweedadmin"}],
          "actions": ["Admin", "Read", "List", "Tagging", "Write"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-tls
    spec:
      # See tests/e2e/_shared/seaweedfs-step.yaml.
      terminationGracePeriodSeconds: 1
      containers:
      - name: seaweedfs
        image: docker.io/chrislusf/seaweedfs:4.51
        imagePullPolicy: IfNotPresent
        args:
        - server
        - -dir=/data
        - -ip.bind=0.0.0.0
        # See tests/e2e/_shared/seaweedfs-step.yaml for why volumes are capped.
        - -master.volumeSizeLimitMB=128
        - -master.telemetry=false
        - -s3
        - -s3.port=8333
        - -s3.config=/etc/seaweedfs/s3.json
        - -s3.iam=false
        - -s3.port.iceberg=0
        - -s3.port.lance=0
        # With a certificate configured, -s3.port serves HTTPS only.
        - -s3.cert.file=/certs/tls.crt
        - -s3.key.file=/certs/tls.key
        ports:
        - name: s3
          containerPort: 8333
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: s3
          initialDelaySeconds: 2
          periodSeconds: 2
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
        - name: tls
          mountPath: /certs
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: s3-config
        configMap:
          name: seaweedfs-s3-config
      - name: tls
        secret:
          secretName: seaweedfs-tls
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-admin
spec:
  selector:
    app.kubernetes.io/name: seaweedfs-tls
  ports:
  - name: s3
    port: 8333
    targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-mismatch
spec:
  selector:
    app.kubernetes.io/name: seaweedfs-tls
  ports:
  - name: s3
    port: 8333
    targetPort: s3
