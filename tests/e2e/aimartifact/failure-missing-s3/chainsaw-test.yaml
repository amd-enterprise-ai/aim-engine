apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: failure-missing-s3
spec:
  steps:
    - name: Deploy SeaweedFS
      use:
        template: ../../_shared/seaweedfs-step.yaml

    - name: Create SeaweedFS bucket
      try:
        - apply:
            file: seaweedfs-setup-job.yaml
        - assert:
            timeout: 120s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: seaweedfs-setup
              status:
                (succeeded != null): true
                succeeded: 1

    - name: Create artifact
      try:
        - apply:
            file: artifact.yaml

    - name: Assert the cache failure is set correctly
      try:
        - assert:
            timeout: 3m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: failure-missing-s3
              status:
                status: "Failed"
                progress:
                  displayPercentage: "N/A"
                (conditions[?type == 'Ready']):
                  - status: "False"
                    reason: "InvalidSpec"
                # An empty prefix is also SourceNotFound; only the log excerpt
                # proves the missing bucket was the cause.
                (conditions[?type == 'DownloadJobPodsReady']):
                  - status: "False"
                    reason: "SourceNotFound"
                    (contains(message || '', 'NoSuchBucket')): true