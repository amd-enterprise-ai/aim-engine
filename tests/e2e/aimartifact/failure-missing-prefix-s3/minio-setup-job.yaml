apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          echo "Waiting for Minio to be ready..."
          until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
            echo "Waiting for Minio..."
            sleep 2
          done
          echo "Creating bucket 'models'..."
          mc mb myminio/models || true
          # Seed an object under a DIFFERENT prefix so the bucket exists and is
          # non-empty. The artifact points at an unrelated, empty prefix, so the
          # listing returns no objects (and NO NoSuchBucket error) -- the case
          # the 'no objects found' classifier must map to SourceNotFound.
          echo "Seeding an object under real-prefix/ ..."
          mkdir -p /tmp/m
          head -c 100 /dev/zero > /tmp/m/placeholder
          mc cp --recursive /tmp/m/ myminio/models/real-prefix/
          echo "Setup complete"
