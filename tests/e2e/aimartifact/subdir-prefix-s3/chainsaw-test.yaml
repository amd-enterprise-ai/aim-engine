apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: subdir-prefix-s3
spec:
  description: >
    Verifies that an s3:// source downloads the WHOLE prefix, including nested
    subdirectories (the implicit subdir-exclude default is hf://-only). The
    seeded tree is a 100 B root file plus a 200 B nested/ file; asserting the
    discovered size is exactly 300 B proves the subdir object is enumerated by
    the size job, and Ready (which requires the download job's post-download
    file-presence verification to pass) proves it actually lands on disk.
  steps:
    - name: Deploy SeaweedFS
      use:
        template: ../../_shared/seaweedfs-step.yaml

    - name: Create bucket and seed root + nested objects
      try:
        - apply:
            file: seaweedfs-setup-job.yaml
        - assert:
            timeout: 120s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: seaweedfs-setup
              status:
                (succeeded != null): true
                succeeded: 1

    - name: Create artifact (no filter -> whole prefix)
      try:
        - apply:
            file: artifact.yaml

    - name: Assert ready and the nested subdir is included in the discovered size
      try:
        - assert:
            timeout: 3m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: subdir-prefix-s3
              status:
                status: Ready
                discoveredSizeBytes: 300
                progress:
                  percentage: 100
