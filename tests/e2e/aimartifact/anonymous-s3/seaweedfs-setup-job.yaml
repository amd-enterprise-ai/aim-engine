apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: aws
        image: docker.io/amazon/aws-cli:2.38.6
        env:
        - name: AWS_ENDPOINT_URL
          value: http://seaweedfs:8333
        - name: AWS_ACCESS_KEY_ID
          value: seaweedadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedadmin
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          echo "Waiting for SeaweedFS to be ready..."
          until aws s3 ls >/dev/null; do
            echo "Waiting for SeaweedFS..."
            sleep 2
          done
          # The shared SeaweedFS config grants anonymous list + get on
          # 'public-models' only.
          echo "Creating bucket 'public-models'..."
          aws s3api head-bucket --bucket public-models 2>/dev/null || aws s3 mb s3://public-models
          echo "Seeding a tiny object tree..."
          mkdir -p /tmp/m
          head -c 100 /dev/zero > /tmp/m/config.json
          aws s3 cp --recursive --no-progress /tmp/m/ s3://public-models/tree/
          echo "Setup complete"
