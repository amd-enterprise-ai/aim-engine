apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: no-credentials
spec:
  # No credentials of any kind against a PRIVATE bucket, and no AIM_S3_ANONYMOUS.
  # Absent keys hand credential resolution to boto3, which finds nothing here, so
  # this must fail as an authentication problem -- never reach Ready, and never be
  # reported as a missing source.
  sourceUri: s3://private-models/tree
  env:
    - name: AWS_ENDPOINT_URL
      value: http://seaweedfs:8333
    - name: AWS_DEFAULT_REGION
      value: us-east-1
