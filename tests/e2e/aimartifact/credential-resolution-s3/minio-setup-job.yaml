apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          echo "Waiting for Minio to be ready..."
          until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
            echo "Waiting for Minio..."
            sleep 2
          done
          mkdir -p /tmp/m
          head -c 100 /dev/zero > /tmp/m/config.json

          echo "Creating anonymously readable bucket 'public-models'..."
          mc mb myminio/public-models || true
          mc cp --recursive /tmp/m/ myminio/public-models/tree/
          mc anonymous set public myminio/public-models

          echo "Creating private bucket 'private-models' (no anonymous policy)..."
          mc mb myminio/private-models || true
          mc cp --recursive /tmp/m/ myminio/private-models/tree/

          echo "Confirming 'private-models' really is private..."
          mc anonymous get myminio/private-models
          echo "Setup complete"
