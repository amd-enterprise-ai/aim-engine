
# basic-lifecycle-s3: end-to-end happy path for an S3-backed AIMArtifact.
# Scaffolding (SeaweedFS + a synthetic seed of small random files) stands in for
# a real model store, so the test has no external/HuggingFace dependency and
# runs fast and deterministically. It asserts the AIMArtifact controller
# provisions a PVC, runs the aim-artifact-downloader Job against s3://, and
# reaches Ready at 100%. HF-source coverage lives in basic-lifecycle-hf.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: basic-lifecycle-s3
spec:
  steps:
    - name: Deploy SeaweedFS
      use:
        template: ../../_shared/seaweedfs-step.yaml

    - name: Create bucket and seed a synthetic model
      try:
        - apply:
            file: seaweedfs-setup-job.yaml
        - assert:
            timeout: 120s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: seaweedfs-setup
              status:
                (succeeded != null): true
                succeeded: 1

    - name: Create artifact
      try:
        - apply:
            file: artifact.yaml

    - name: Assert the cache gets ready
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: basic-lifecycle-s3
              status:
                status: Ready
                progress:
                  percentage: 100