apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          echo "Waiting for Minio to be ready..."
          until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
            echo "Waiting for Minio..."
            sleep 2
          done
          echo "Creating bucket 'models'..."
          mc mb myminio/models || true
          # Seed a synthetic model so the AIMArtifact has S3 objects to download.
          # Content is irrelevant (readiness is gated on the download Job, not the
          # bytes), so fabricate small files locally rather than pull a real model.
          # Files sit at the prefix root because the default download filter
          # (exclude */*) skips nested paths.
          echo "Seeding synthetic model under models/SmolLM-135M ..."
          mkdir -p /tmp/seed/SmolLM-135M
          head -c 8388608 /dev/urandom > /tmp/seed/SmolLM-135M/model.safetensors
          printf '{"model_type":"llama"}\n' > /tmp/seed/SmolLM-135M/config.json
          printf 'tokenizer\n' > /tmp/seed/SmolLM-135M/tokenizer.json
          mc cp --recursive /tmp/seed/SmolLM-135M/ myminio/models/SmolLM-135M/
          echo "Bucket + seed complete"
