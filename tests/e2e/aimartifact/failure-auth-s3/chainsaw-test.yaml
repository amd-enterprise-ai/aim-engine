
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: failure-auth-s3
spec:
  steps:
    - name: Deploy SeaweedFS
      use:
        template: ../../_shared/seaweedfs-step.yaml

    - name: Create artifact
      try:
        - apply:
            file: artifact.yaml

    - name: Assert the cache gets ready
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: failure-auth-s3
              status:
                status: "Failed"
                progress:
                  displayPercentage: "N/A"
                (conditions[?type == 'Ready']):
                  - status: "False"
                    reason: "AuthError"
                (conditions[?type == 'DownloadJobPodsReady']):
                  - status: "False"
                    reason: "AuthError"
                (conditions[?type == 'AuthValid']):
                  - status: "False"
                    reason: "AuthError"