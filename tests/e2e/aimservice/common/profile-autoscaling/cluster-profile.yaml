# CPU AIMClusterProfile used by the profile-autoscaling test. A CPU profile is
# deliberately chosen so the test runs on both kind (with a manually stamped
# node label) and on GPU vclusters (where the AcceleratorDetector provides
# the label). Keeps the test focused on autoscaling wiring rather than any
# GPU-specific concern.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-profile-autoscaling-profile
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorModel: EPYC_ZEN5
  acceleratorType: cpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
  containerEnv:
    - name: VLLM_TARGET_DEVICE
      value: cpu
