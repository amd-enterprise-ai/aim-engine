# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Custom Model Test: Service-Scoped Model Identity
#
# This test validates that when multiple AIMServices use the same spec.model.custom
# configuration, each gets its own UID-bound compatibility AIMModel. Sharing one
# controller-owned model would create a cross-service ownership collision.
#
# Tested behavior:
# - Each service creates and resolves its own AIMModel
# - The model names and object UIDs are distinct
# - Each model has exactly one controller owner matching its source service UID
# - Exactly two compatibility AIMModels exist in the namespace
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: custom-model-service-scoped-identity
  labels:
    hf-access: live
spec:
  description: Test that identical custom model specs create distinct UID-bound AIMModels
  timeouts:
    apply: 30s
    assert: 180s
  steps:
    - use:
        template: ../../../../_shared/hf-token-step.yaml

    - name: Create first service with custom model
      try:
        - apply:
            file: service-1.yaml

    - name: Wait for first service to create model
      try:
        - assert:
            timeout: 180s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-dedup-service-1
              status:
                resolvedModel:
                  (name != ''): true
                (conditions[?type == 'ModelReady']):
                  - status: "True"

    - name: Create second service with identical custom model spec
      try:
        - apply:
            file: service-2.yaml

    - name: Wait for second service to resolve model
      try:
        - assert:
            timeout: 180s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-dedup-service-2
              status:
                resolvedModel:
                  (name != ''): true
                (conditions[?type == 'ModelReady']):
                  - status: "True"

    - name: Verify each service resolves its own UID-bound model
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              FIRST_SERVICE=test-dedup-service-1
              SECOND_SERVICE=test-dedup-service-2
              FIRST_MODEL=$(kubectl get aimservice "$FIRST_SERVICE" -n "$NAMESPACE" \
                -o jsonpath='{.status.resolvedModel.name}')
              SECOND_MODEL=$(kubectl get aimservice "$SECOND_SERVICE" -n "$NAMESPACE" \
                -o jsonpath='{.status.resolvedModel.name}')
              echo "First service model: $FIRST_MODEL"
              echo "Second service model: $SECOND_MODEL"

              if [ "$FIRST_MODEL" = "$SECOND_MODEL" ]; then
                echo "ERROR: service-scoped compatibility models unexpectedly share the name $FIRST_MODEL"
                exit 1
              fi

              FIRST_MODEL_UID=$(kubectl get aimmodel "$FIRST_MODEL" -n "$NAMESPACE" \
                -o jsonpath='{.metadata.uid}')
              SECOND_MODEL_UID=$(kubectl get aimmodel "$SECOND_MODEL" -n "$NAMESPACE" \
                -o jsonpath='{.metadata.uid}')
              if [ "$FIRST_MODEL_UID" = "$SECOND_MODEL_UID" ]; then
                echo "ERROR: distinct model names unexpectedly have the same UID $FIRST_MODEL_UID"
                exit 1
              fi

              for PAIR in "$FIRST_SERVICE:$FIRST_MODEL" "$SECOND_SERVICE:$SECOND_MODEL"; do
                SERVICE=${PAIR%%:*}
                MODEL=${PAIR#*:}
                SERVICE_UID=$(kubectl get aimservice "$SERVICE" -n "$NAMESPACE" \
                  -o jsonpath='{.metadata.uid}')
                kubectl get aimmodel "$MODEL" -n "$NAMESPACE" -o json |
                  jq -e --arg service "$SERVICE" --arg uid "$SERVICE_UID" '
                    .metadata.labels["aim.eai.amd.com/service"] == $service and
                    (.metadata.ownerReferences | length) == 1 and
                    .metadata.ownerReferences[0].kind == "AIMService" and
                    .metadata.ownerReferences[0].name == $service and
                    .metadata.ownerReferences[0].uid == $uid and
                    .metadata.ownerReferences[0].controller == true and
                    .metadata.ownerReferences[0].blockOwnerDeletion == true
                  ' >/dev/null
              done

              COUNT=$(kubectl get aimmodels -n "$NAMESPACE" \
                -l aim.eai.amd.com/custom-model=true -o json |
                jq '.items | length')
              echo "Found $COUNT service-scoped compatibility AIMModels"
              if [ "$COUNT" -ne 2 ]; then
                echo "ERROR: expected exactly 2 service-scoped models, found $COUNT"
                kubectl get aimmodels -n "$NAMESPACE" -l aim.eai.amd.com/custom-model=true
                exit 1
              fi
