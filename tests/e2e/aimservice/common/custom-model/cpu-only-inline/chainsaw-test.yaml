# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Custom Model Test: CPU-Only Inline Custom Model
#
# This test validates that an AIMService with spec.model.custom can specify
# CPU-only hardware (no GPU) and the resources are correctly propagated.
#
# Tested behavior:
# - AIMService with custom.hardware.cpu creates AIMModel
# - Auto-created model persists a canonical CPU-only compatibility payload
#   without writing predecessor-only fields back to spec
# - Template has hardwareSummary: "CPU"
# - No GPU node affinity is applied
# - Service progresses normally
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: custom-model-cpu-only-inline
  labels:
    hf-access: live
spec:
  description: Test AIMService with inline CPU-only custom model
  timeouts:
    apply: 30s
    assert: 120s
  steps:
    - use:
        template: ../../../../_shared/hf-token-step.yaml

    - name: Create service with CPU-only custom model
      try:
        - apply:
            file: service.yaml

    - name: Assert AIMModel persists the supported CPU compatibility contract
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMModel
              metadata:
                labels:
                  aim.eai.amd.com/origin: auto-generated
                  aim.eai.amd.com/custom-model: "true"
                  aim.eai.amd.com/service: test-cpu-only-inline
                annotations:
                  aim.eai.amd.com/legacy-auto-custom-spec: '{"baseImage":"docker.io/amdenterpriseai/aim-dummy:0.2.0","modelSources":[{"modelId":"cpu/inline-model","sourceUri":"hf://sshleifer/tiny-gpt2"}],"hardware":{"cpu":{"requests":"500m"}}}'
                (ownerReferences[?apiVersion == 'aim.eai.amd.com/v1alpha2' && kind == 'AIMService' && name == 'test-cpu-only-inline']):
                  - controller: true
                    blockOwnerDeletion: true
              spec:
                image: docker.io/amdenterpriseai/aim-dummy:0.2.0
                (modelSources == null): true
                (custom == null): true
              status:
                status: Ready
                sourceType: Custom

    - name: Assert model ownership is bound to the source service UID
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-cpu-only-inline
              status:
                resolvedModel:
                  (name != ''): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              SERVICE=test-cpu-only-inline
              MODEL=$(kubectl get aimservice "$SERVICE" -n "$NAMESPACE" \
                -o jsonpath='{.status.resolvedModel.name}')
              SERVICE_UID=$(kubectl get aimservice "$SERVICE" -n "$NAMESPACE" \
                -o jsonpath='{.metadata.uid}')
              kubectl get aimmodel "$MODEL" -n "$NAMESPACE" -o json |
                jq -e --arg service "$SERVICE" --arg uid "$SERVICE_UID" '
                  (.metadata.ownerReferences | length) == 1 and
                  .metadata.ownerReferences[0].kind == "AIMService" and
                  .metadata.ownerReferences[0].name == $service and
                  .metadata.ownerReferences[0].uid == $uid and
                  .metadata.ownerReferences[0].controller == true and
                  .metadata.ownerReferences[0].blockOwnerDeletion == true
                ' >/dev/null

    - name: Assert template has CPU hardware and summary
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMServiceTemplate
              metadata:
                labels:
                  aim.eai.amd.com/origin: auto-generated
              spec:
                hardware:
                  cpu:
                    requests: 500m
              status:
                status: Ready
                resolvedHardware:
                  cpu:
                    requests: 500m
                hardwareSummary: CPU

    - name: Assert service resolves and starts
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-cpu-only-inline
              status:
                status: Starting
                (conditions[?type == 'ModelReady']):
                  - status: "True"
                (conditions[?type == 'TemplateReady']):
                  - status: "True"

    - name: Verify InferenceService has no GPU resources
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: test-cpu-only-inline
