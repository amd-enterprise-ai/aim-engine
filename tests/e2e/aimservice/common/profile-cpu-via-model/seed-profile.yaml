# Seed AIMProfile used as the copy source for the AIMModel below. Marked as
# copyable so the model's profileCopy selector picks it up. The accelerator
# fields match what the detector (NFD-backed) labels on EPYC_ZEN5 nodes;
# the derived profile inherits these unchanged and then reconciles against
# the same real node labeling path the CPU-basic test already exercises.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: test-cpu-via-model-seed
  annotations:
    aim.eai.amd.com/base-image: registry.example.com/aim-cpu-base:0.12.0
    aim.eai.amd.com/profile-copyable: "true"
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  profileId: cpu-latency
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorModel: EPYC_ZEN5
  acceleratorType: cpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
  containerEnv:
    - name: VLLM_TARGET_DEVICE
      value: cpu
  engineEnv:
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
    VLLM_CPU_KVCACHE_SPACE: "6"
