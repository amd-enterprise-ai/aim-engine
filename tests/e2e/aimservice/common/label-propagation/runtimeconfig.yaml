# Cluster-wide runtime config with label propagation and routing enabled
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterRuntimeConfig
metadata:
  name: default
spec:
  labelPropagation:
    enabled: true
    match:
      - "team-*"
      - "cost-center"
  routing:
    enabled: true
    gatewayRef:
      name: kserve-ingress-gateway
      namespace: kgateway-system
    pathTemplate: "/integration/label-propagation/{.metadata.namespace}/{.metadata.name}"
  artifactCache:
    enabled: true
    s3Uri: "s3://aim-cache/artifacts"
    env:
      - name: AWS_ENDPOINT_URL
        value: "http://seaweedfs-s3.seaweedfs-system:8333"
      - name: AWS_ACCESS_KEY_ID
        value: "anonymous"
      - name: AWS_SECRET_ACCESS_KEY
        value: "anonymous"
      - name: S3_NO_SSL
        value: "true"