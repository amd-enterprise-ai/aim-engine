# CPU AIMClusterProfile with acceleratorModel: EPYC_ZEN5.
# The profile controller checks for the aim-accelerator.EPYC_ZEN5 node label.
# kind clusters don't run the AcceleratorDetector, so the test manually stamps
# the label on a kind node to exercise the actual hardware-matching path
# (not the NoAcceleratorSpecified shortcut).
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-cpu-basic-profile
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorModel: EPYC_ZEN5
  acceleratorType: cpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  containerEnv:
    - name: VLLM_TARGET_DEVICE
      value: cpu
  engineEnv:
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
    VLLM_CPU_KVCACHE_SPACE: "6"
