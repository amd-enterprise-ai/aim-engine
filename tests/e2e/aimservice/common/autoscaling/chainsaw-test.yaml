# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService E2E Test: Autoscaling Configuration (Kind)
#
# This test validates that autoscaling configuration (minReplicas, maxReplicas, autoScaling)
# propagates correctly to the InferenceService with KEDA annotations.
#
# Note: This test verifies the InferenceService configuration only.
# Full KEDA integration (ScaledObject, HPA) requires KEDA infrastructure.
#
# Uses: ghcr.io/silogen/aim-dummy:0.2.0 (lightweight test image)
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aimservice-autoscaling
spec:
  description: Test AIMService autoscaling configuration propagates to InferenceService
  timeouts:
    assert: 300s
  steps:
    - name: Create model
      try:
        - apply:
            file: model.yaml

    - name: Wait for model to be ready (discovery complete)
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMModel
              metadata:
                name: test-autoscaling-model
              status:
                status: Ready

    - name: Create service with autoscaling
      try:
        - apply:
            file: service.yaml

    - name: Verify service starts with correct runtime status before HPA exists
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-autoscaling-service
              status:
                status: Starting
                runtime:
                  minReplicas: 1
                  maxReplicas: 3

    - name: Verify InferenceService hands autoscaling off to AIM Engine
      description: |
        autoscalerClass=external tells KServe's KEDA reconciler to skip
        authoring its own ScaledObject. AIM Engine writes the actual
        ScaledObject (see next step) so it can carry the gateway-rate
        activation trigger needed for scale-from-zero. The OTel sidecar
        and Prometheus port annotations are still required so the user's
        in-pod vLLM metrics reach keda-otel-scaler.
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: test-autoscaling-service
                annotations:
                  serving.kserve.io/autoscalerClass: "external"
                  prometheus.kserve.io/port: "8000"

    - name: Verify AIM Engine authored the KEDA ScaledObject
      description: |
        Under autoscalerClass=external the AIMService controller is the
        sole author of the ScaledObject. The resource is named after the
        predictor Deployment (`<isvcName>-predictor`, where isvcName is
        a hash-derived name that varies per (namespace, serviceName) and
        therefore per chainsaw run) and owned by the AIMService so GC
        follows the parent. We match by the aim.eai.amd.com/service
        label rather than by name to stay robust to the hashed name,
        and we don't assert on scaleTargetRef.name for the same reason.
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: ScaledObject
              metadata:
                labels:
                  aim.eai.amd.com/service: test-autoscaling-service
                  app.kubernetes.io/component: autoscaling
                  app.kubernetes.io/managed-by: aim-engine
              spec:
                minReplicaCount: 1
                maxReplicaCount: 3

    - name: Verify InferenceService has correct replica configuration
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: test-autoscaling-service
              spec:
                predictor:
                  minReplicas: 1
                  maxReplicas: 3

    - name: Verify service reaches Running status with correct runtime status
      description: |
        End-to-end propagation check: AIMService → InferenceService → ScaledObject
        (KEDA) → HPA → AIMService.status.runtime. The KEDA path adds ScaledObject
        + HPA reconciliation on top of the regular ISVC pod-readiness wait, so
        this assertion is intentionally slower than non-autoscaling tests
        (replicas, replicas-default, etc. use 180s). status.runtime mirrors the
        live HPA, not the spec, so the assertion only succeeds once KEDA has
        fully reconciled the HPA's MinReplicas/MaxReplicas.
      try:
        - assert:
            timeout: 300s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-autoscaling-service
              status:
                status: Running
                runtime:
                  # Autoscaling: min and max differ
                  minReplicas: 1
                  maxReplicas: 3
                  # Note: currentReplicas and desiredReplicas depend on HPA
                  # In test env without KEDA, these fall back to minReplicas
      catch:
        - describe:
            apiVersion: aim.eai.amd.com/v1alpha1
            kind: AIMService
        - describe:
            apiVersion: serving.kserve.io/v1beta1
            kind: InferenceService
        - describe:
            apiVersion: keda.sh/v1alpha1
            kind: ScaledObject
        - describe:
            apiVersion: autoscaling/v2
            kind: HorizontalPodAutoscaler
        - get:
            apiVersion: v1
            kind: Pod
        - podLogs:
            selector: serving.kserve.io/inferenceservice=test-autoscaling-service
            tail: 80
