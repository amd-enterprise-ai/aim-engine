# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService Frozen Test: CPU Profile Ready (v1alpha2)
#
# Tests that a v1alpha2 AIMService correctly resolves a CPU-only AIMClusterProfile
# and creates a profile ConfigMap with the v1alpha2 accelerator naming
# (accelerator_model, accelerator_type, accelerator_count).
#
# For CPU profiles, accelerator_count represents the number of CPU sockets (typically 1).
# The AIM runtime auto-detects available cores at startup via cgroup/cpuset and adjusts
# OMP_NUM_THREADS accordingly.
#
# Test type: Frozen dependency test
# Frozen resources: AIMClusterProfile (Ready, CPU-only)
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: profile-cpu-ready
spec:
  timeouts:
    assert: 60s
  steps:
    - name: Create frozen CPU cluster profile with Ready status
      try:
        - apply:
            file: cluster-profile.yaml
        - script:
            content: |
              apply-with-status.sh cluster-profile.yaml --status-only

    - name: Create v1alpha2 service referencing the CPU profile
      try:
        - apply:
            file: service.yaml

    - name: Freeze profile cache and artifact to Ready
      # The CPU profile carries a real hf://Qwen/Qwen3-0.6B source so the
      # AIMService planner would otherwise wait for a multi-hundred-MB
      # download before unblocking ConfigMap creation (see the
      # `if !obs.profileCacheReady { return planResult }` gate in
      # PlanResources). That race exceeds the 60s assert timeout
      # intermittently. Mirror the freeze pattern profile-ready uses: pause
      # both the AIMProfileCache and its AIMArtifact and patch them to
      # Ready so the source is never actually fetched.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu

              for _ in $(seq 1 30); do
                PC_NAME=$(kubectl get aimprofilecache -n "$NAMESPACE" \
                  -l aim.eai.amd.com/service=test-cpu-service \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                ART_NAME=$(kubectl get aimartifact -n "$NAMESPACE" \
                  -l aim.eai.amd.com/profile.name=test-cpu-profile \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -n "$PC_NAME" ] && [ -n "$ART_NAME" ]; then
                  break
                fi
                sleep 1
              done

              if [ -z "$PC_NAME" ] || [ -z "$ART_NAME" ]; then
                echo "ERROR: profile cache or artifact not found in time"
                kubectl get aimprofilecache,aimartifact -n "$NAMESPACE" -o wide || true
                exit 1
              fi
              echo "Found AIMProfileCache=$PC_NAME AIMArtifact=$ART_NAME"

              kubectl annotate aimprofilecache "$PC_NAME" -n "$NAMESPACE" \
                aim.eai.amd.com/reconciliation-paused=true --overwrite
              kubectl annotate aimartifact "$ART_NAME" -n "$NAMESPACE" \
                aim.eai.amd.com/reconciliation-paused=true --overwrite

              kubectl patch aimartifact "$ART_NAME" -n "$NAMESPACE" \
                --type=merge --subresource=status \
                -p '{
                  "status": {
                    "status": "Ready",
                    "conditions": [
                      {
                        "type": "Ready",
                        "status": "True",
                        "reason": "Ready",
                        "message": "Artifact frozen Ready by chainsaw test",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      }
                    ],
                    "persistentVolumeClaim": "'"$ART_NAME"'-pvc"
                  }
                }'

              kubectl patch aimprofilecache "$PC_NAME" -n "$NAMESPACE" \
                --type=merge --subresource=status \
                -p '{
                  "status": {
                    "status": "Ready",
                    "conditions": [
                      {
                        "type": "ProfileFound",
                        "status": "True",
                        "reason": "ProfileResolved",
                        "message": "Profile resolved",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      },
                      {
                        "type": "ArtifactsReady",
                        "status": "True",
                        "reason": "AllCachesReady",
                        "message": "All artifacts are ready",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      },
                      {
                        "type": "Ready",
                        "status": "True",
                        "reason": "Ready",
                        "message": "Profile cache frozen Ready by chainsaw test",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      }
                    ],
                    "artifacts": {
                      "'"$ART_NAME"'": {
                        "name": "'"$ART_NAME"'",
                        "model": "Qwen/Qwen3-0.6B",
                        "status": "Ready",
                        "persistentVolumeClaim": "'"$ART_NAME"'-pvc",
                        "mountPoint": "/workspace/cache/Qwen/Qwen3-0.6B"
                      }
                    }
                  }
                }'

              echo "Patched $PC_NAME and $ART_NAME to Ready"

    - name: Assert service resolves CPU profile
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-cpu-service
              status:
                (conditions[?type == 'ProfileReady']):
                  - status: "True"
                    reason: ProfileResolved
                resolvedProfile:
                  name: test-cpu-profile
                  scope: Cluster

    - name: Assert profile ConfigMap uses v1alpha2 accelerator naming
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                labels:
                  aim.eai.amd.com/service: test-cpu-service
                  app.kubernetes.io/managed-by: aim-engine
                  app.kubernetes.io/component: inference

    - name: Assert InferenceService is created with CPU profile image
      try:
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: test-cpu-service
                  aim.eai.amd.com/profile: test-cpu-profile
              spec:
                predictor:
                  containers:
                    - name: kserve-container
                      image: registry.example.com/aim-cpu-base:0.12.0

    - name: Assert service reaches a runtime bring-up state (not Ready/Failed)
      # The predictor image is intentionally fake, so the pod never runs and the
      # exact rollup status depends on kubelet pull/back-off timing (Pending vs
      # Starting vs Progressing). Assert the service is in any non-terminal
      # bring-up state rather than a single transient value to avoid a timing race.
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-cpu-service
              status:
                (status == 'Starting' || status == 'Pending' || status == 'Progressing'): true
