# Frozen AIMClusterProfile (Ready) with a single model source whose modelId
# matches the bootstrapped base artifact. A single model source is required when
# a service declares adapters (unambiguous parent resolution).
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: adapters-staged-profile
  annotations:
    aim.eai.amd.com/reconciliation-paused: "true"
spec:
  aimId: test/adapters-model
  modelId: test/adapters-model-fp8
  engine: vllm
  metric: latency
  precision: fp8
  type: optimized
  primary: true
  image: registry.example.com/test-image:1.0.0
  features:
    - adapters
  modelSources:
    - modelId: test-org/base-weights
      sourceUri: hf://test-org/base-weights
      size: 10Mi
status:
  status: Ready
  version: 1.0.0
  hardwareSummary: CPU
  matchingNodes: 1
  conditions:
    - type: HardwareAvailable
      status: "True"
      reason: NoAcceleratorSpecified
      message: No accelerator specified, profile is available on any node
      lastTransitionTime: "2025-01-01T00:00:00Z"
