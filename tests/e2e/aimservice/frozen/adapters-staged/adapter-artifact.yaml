# Adapter artifact referencing the base model. AIM_DEBUG_SIMULATE_PROMOTE makes
# the staging Job write dummy adapter bytes and exercise the rename(2) promote
# without any real download (kind-friendly).
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: adapters-staged-lora
spec:
  type: adapter
  parentArtifact: adapters-staged-base
  modelId: test-org/lora
  sourceUri: hf://test-org/lora
  rank: 16
  env:
    - name: AIM_DEBUG_SIMULATE_PROMOTE
      value: "true"
    - name: AIM_DEBUG_DOWNLOAD_DURATION
      value: "2"
