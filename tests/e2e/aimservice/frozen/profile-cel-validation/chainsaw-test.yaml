# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService CEL Validation: Field Constraints
#
# Validates CEL rules that enforce field-level constraints:
# - spec.profile and spec.template are mutually exclusive
# - spec.profileOverrides requires spec.profile
# - at least one of spec.model or spec.profile must be specified
# - spec.adapterRuntime.maxRank accepts only vLLM-supported rank ceilings
# - spec.adapterRuntime.maxRank is only valid in dynamic adapter mode
#
# And validates that the v1alpha2-only guards on spec.template and
# spec.model.custom also reject introducing either field through a v1alpha2
# update. They ratchet (optionalOldSelf), so a stored object that already
# carries one of these fields stays updatable; the v0.2.7 upgrade lane
# verifies that on services the previous release stored.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: profile-cel-validation
spec:
  description: Test CEL validation rules for field constraints
  timeouts:
    assert: 30s
  steps:
    # --- Rejection cases ---

    - name: Reject service with both profile and template (mutually exclusive)
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-profile-and-template
              spec:
                profile:
                  name: some-profile
                template:
                  name: some-template
                replicas: 1

    - name: Reject service with profileOverrides but no profile
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-overrides-without-profile
              spec:
                model:
                  image: registry.example.com/test-image:1.0.0
                profileOverrides:
                  engineArgs:
                    max_model_len: 4096
                replicas: 1

    - name: Reject v1alpha2 service without model or profile
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1a2-no-model
              spec:
                template:
                  name: some-template
                replicas: 1

    # profile.name and profile.selector are mutually exclusive. Empty name is
    # treated as unset, so this must reject on the (non-empty) name below.
    - name: Reject v1alpha2 profile with both name and selector
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-profile-name-and-selector
              spec:
                profile:
                  name: some-profile
                  selector:
                    modelRef:
                      name: some-model
                replicas: 1

    # Empty name is treated as unset; with no selector either, the profile
    # specifies nothing and must be rejected by the name-or-selector rule.
    - name: Reject v1alpha2 profile with empty name and no selector
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-profile-empty-name-no-selector
              spec:
                profile:
                  name: ""
                replicas: 1

    # spec.model satisfies the model-or-profile rule and there is no
    # spec.profile, so the only rule that can reject this create is the
    # template guard: supplying spec.template on a v1alpha2 create is rejected.
    - name: Reject v1alpha2 service supplying template on create
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1a2-model-template
              spec:
                model:
                  name: some-model
                template:
                  name: some-template

    - name: Reject unsupported adapter max rank
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-invalid-adapter-max-rank
              spec:
                model:
                  image: registry.example.com/test-image:1.0.0
                adapterMode: dynamic
                adapterRuntime:
                  maxRank: 48

    - name: Reject adapter max rank when mode defaults to static
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-static-adapter-max-rank
              spec:
                model:
                  image: registry.example.com/test-image:1.0.0
                adapterRuntime:
                  maxRank: 64

    # --- Acceptance cases ---

    - name: Accept v1alpha2 service with profile only
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1alpha2-profile
              spec:
                profile:
                  name: some-profile
                replicas: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1alpha2-profile

    # Empty name is treated as unset, so a selector-only profile that also
    # carries name: "" is accepted (tolerates clients that always serialize
    # the field). The selector narrows on modelRef to satisfy the narrow rule.
    - name: Accept v1alpha2 profile with empty name and selector
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-profile-empty-name-selector
              spec:
                profile:
                  name: ""
                  selector:
                    modelRef:
                      name: some-model
                    minimumType: any
                replicas: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-profile-empty-name-selector

    - name: Accept v1alpha2 service with model only
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1a2-model
              spec:
                model:
                  image: registry.example.com/test-image:1.0.0
                replicas: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1a2-model

    - name: Accept supported adapter max rank
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-valid-adapter-max-rank
              spec:
                model:
                  image: registry.example.com/test-image:1.0.0
                adapterMode: dynamic
                adapterRuntime:
                  maxRank: 320
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-valid-adapter-max-rank

    # --- Ratcheting cases (optionalOldSelf) ---

    # The ratchet only tolerates a pre-existing spec.template; introducing it
    # via the v1alpha2 endpoint (oldSelf has none) must still be rejected.
    - name: Ratchet - introducing template via v1alpha2 update is still rejected
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-ratchet-clean
              spec:
                profile:
                  name: some-profile
        - script:
            content: |
              set -eu
              if kubectl patch aimservices.v1alpha2.aim.eai.amd.com -n "$NAMESPACE" \
                  test-ratchet-clean --type merge -p '{"spec":{"template":{"name":"x"}}}' 2>/dev/null; then
                echo "ERROR: introducing spec.template via v1alpha2 was accepted"
                exit 1
              fi

    - name: Reject v1alpha2 service supplying model.custom on create
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'create an AIMModel and reference it with spec.model.name')): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cel-v1a2-model-custom
              spec:
                model:
                  custom:
                    baseImage: registry.example.com/test-image:1.0.0
                    modelSources:
                      - modelId: org/model
                        sourceUri: hf://org/model
                        size: 1Gi
                    hardware:
                      cpu:
                        requests: "1"

    - name: Ratchet - introducing model.custom via v1alpha2 update is still rejected
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-ratchet-clean-custom
              spec:
                profile:
                  name: some-profile
        - script:
            content: |
              set -u
              if out="$(kubectl patch aimservices.v1alpha2.aim.eai.amd.com -n "$NAMESPACE" \
                  test-ratchet-clean-custom --type merge \
                  -p '{"spec":{"model":{"custom":{"baseImage":"registry.example.com/test-image:1.0.0","modelSources":[{"modelId":"org/model","sourceUri":"hf://org/model","size":"1Gi"}],"hardware":{"cpu":{"requests":"1"}}}}}}' 2>&1)"; then
                echo "ERROR: introducing spec.model.custom via v1alpha2 was accepted"
                exit 1
              fi
              if ! printf '%s' "$out" | grep -q 'create an AIMModel and reference it with spec.model.name'; then
                echo "ERROR: unexpected rejection: $out"
                exit 1
              fi
