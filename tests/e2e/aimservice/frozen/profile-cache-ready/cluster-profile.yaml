# Frozen AIMClusterProfile: Ready status with modelSources for cache testing
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-profile-cache
  annotations:
    aim.eai.amd.com/reconciliation-paused: "true"
spec:
  aimId: test/cache-model
  modelId: test/cache-model-fp8
  engine: vllm
  metric: latency
  precision: fp8
  type: optimized
  primary: true
  image: registry.example.com/test-image:1.0.0
