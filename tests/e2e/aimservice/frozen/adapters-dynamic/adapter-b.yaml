# Second adapter artifact (removed from the service mid-test to exercise the
# subtree-sync prune/unload path). AIM_DEBUG_SIMULATE_PROMOTE keeps it
# kind-friendly (dummy bytes, real rename(2) promote, no network).
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: adapters-dynamic-lora-b
spec:
  type: adapter
  parentArtifact: adapters-dynamic-base
  modelId: test-org/lora-b
  sourceUri: hf://test-org/lora-b
  rank: 16
  env:
    - name: AIM_DEBUG_SIMULATE_PROMOTE
      value: "true"
    - name: AIM_DEBUG_DOWNLOAD_DURATION
      value: "2"
