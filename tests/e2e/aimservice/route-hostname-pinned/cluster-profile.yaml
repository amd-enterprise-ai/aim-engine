# Frozen AIMClusterProfile: CPU-only, Ready status. Mirrors profile-cpu-ready;
# used here only as a deployable profile so the service reaches route creation.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-route-pin-profile
  annotations:
    aim.eai.amd.com/reconciliation-paused: "true"
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorType: cpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
  engineEnv:
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
    VLLM_CPU_KVCACHE_SPACE: "6"
    VLLM_DO_NOT_TRACK: "1"
    VLLM_TARGET_DEVICE: cpu
status:
  status: Ready
  version: 0.12.0
  hardwareSummary: CPU
  matchingNodes: 1
  conditions:
    - type: HardwareAvailable
      status: "True"
      reason: NoAcceleratorSpecified
      message: CPU profile, no accelerator hardware required
      lastTransitionTime: "2025-01-01T00:00:00Z"
