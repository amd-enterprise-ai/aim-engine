# Namespaced AIMProfile for GLM-4.7 (MoE, MI300X, FP8, TP=2) with modelSources
# for cache testing. Mirrors the embedded profile at
# /workspace/aim-runtime/profiles/zai-org/GLM-4.7/vllm-mi300x-fp8-tp2-latency.yaml
# inside ghcr.io/silogen/aim-zai-org-glm-4-7:0.12.0-rc3.
#
# GLM-4.7-FP8 is ~362 GiB across 93 shards and *requires* TP=2 to fit across
# two MI300X GPUs (192 GiB HBM each) — this is the vendor-recommended
# deployment per the image's com.amd.aim.model.recommendedDeployments label.
#
# Namespace-scoped so it lives and dies with the ephemeral chainsaw namespace,
# avoiding cluster-state leakage and collisions between concurrent test runs.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: glm-4-7-mi300x-live
spec:
  aimId: zai-org/GLM-4.7
  # FP8-quantised weights live under a distinct HuggingFace repo.
  modelId: zai-org/GLM-4.7-FP8
  engine: vllm
  metric: latency
  precision: fp8
  type: unoptimized
  primary: true
  acceleratorModel: MI300X
  acceleratorType: gpu
  acceleratorCount: 2
  image: ghcr.io/silogen/aim-zai-org-glm-4-7:0.12.0-rc3
  modelSources:
    - modelId: zai-org/GLM-4.7-FP8
      sourceUri: hf://zai-org/GLM-4.7-FP8
      # ~362 GiB actual; leave headroom for in-flight shards and filesystem overhead.
      size: 450Gi
  # caching.env is piped through to the AIMArtifact download Job (via
  # AIMProfileCache.spec.env). HF_TOKEN authenticates the XET/HF_TRANSFER
  # clients (and is required by the image's hfToken.required label). The
  # secret is copied into the test namespace by the chainsaw test.
  caching:
    enabled: true
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  engineArgs:
    async-scheduling: null
    disable-uvicorn-access-log: null
    distributed_executor_backend: mp
    gpu-memory-utilization: 0.9
    kv-cache-dtype: fp8
    max-model-len: 32768
    max-num-batched-tokens: 1024
    max-num-seqs: 256
    no-enable-log-requests: null
    no-enable-prefix-caching: null
    no-trust-remote-code: null
    swap-space: 64
    tensor-parallel-size: 2
  engineEnv:
    GPU_ARCHS: gfx942
    HSA_NO_SCRATCH_RECLAIM: "1"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_ROPE: "1"
