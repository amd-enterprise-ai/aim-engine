apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: test-gpu-s3-service
spec:
  runtimeConfigName: test-gpu-s3-config
  # The referenced model uses the public amdenterpriseai/aim-base image,
  # so no imagePullSecrets are required here.
  model:
    name: test-gpu-s3-model
  template:
    allowUnoptimized: true
  caching:
    mode: Shared
  replicas: 1
