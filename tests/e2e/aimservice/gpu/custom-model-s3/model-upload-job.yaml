apiVersion: batch/v1
kind: Job
metadata:
  name: model-upload
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: downloader
          image: docker.io/amdenterpriseai/aim-artifact-downloader:v0.2.4
          env:
            - name: TARGET_DIR
              value: /mnt/models
            - name: HF_HOME
              value: /tmp/hf-home
            - name: HF_HUB_CACHE
              value: /tmp/hf-home/hub
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-creds
                  key: token
          args:
            - "hf://Qwen/Qwen2-0.5B"
            - "/mnt/models"
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
      containers:
        - name: uploader
          image: docker.io/amazon/aws-cli:2.38.6
          env:
            - name: AWS_ENDPOINT_URL
              value: http://seaweedfs:8333
            - name: AWS_ACCESS_KEY_ID
              value: seaweedadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedadmin
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              aws s3 cp --recursive --no-progress /mnt/models/ s3://models/Qwen2-0.5B/
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
      volumes:
        - name: model-storage
          emptyDir: {}
