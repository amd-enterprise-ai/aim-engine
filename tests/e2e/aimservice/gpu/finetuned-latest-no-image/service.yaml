# AIMService referencing the fine-tuned AIMModel. The template is left
# unspecified so the controller picks the (single) fine-tuned template copy.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: test-ft-latest
spec:
  runtimeConfigName: test-ft-latest
  model:
    name: ft-latest-finetuned
  caching:
    mode: Dedicated
  replicas: 1
  env:
    # meta-llama is gated — propagate the token to both the AIMArtifact
    # download job (service.env flows into the cache) and the kserve
    # container at runtime.
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: hf-token
  template:
    # The auto-discovered base template's profile is flagged `unoptimized`, and
    # fine-tuned copies inherit that flag. Allow unoptimized profiles so the
    # controller can pick the single matching template copy.
    allowUnoptimized: true
