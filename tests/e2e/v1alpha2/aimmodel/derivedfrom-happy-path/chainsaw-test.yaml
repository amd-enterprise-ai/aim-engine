apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimmodel-derivedfrom-happy-path
spec:
  description: |
    Happy-path coverage of ADR 0006b iteration 1 derivedFrom onboarding:
    seeds a deployable source AIMProfile, applies a v1alpha2 AIMModel that
    uses spec.derivedFrom (no spec.image, no spec.profileCopy) to pick that
    profile, and asserts the synthesised child AIMProfileSet plus the
    derived AIMProfile carry the expected status (deployable=true,
    origin=Derived, sourceModel set) and the expected provenance labels
    (profile-role=deployable, profile-origin=Derived,
    source-model=<model-name>).
  timeouts:
    assert: 120s
  steps:
    - name: Seed the deployable source AIMProfile
      try:
        - apply:
            file: source-profile.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: derivedfrom-source
                labels:
                  aim.eai.amd.com/profile-role: deployable
                  aim.eai.amd.com/profile-origin: discovered
              status:
                status: Ready
                deployable: true
                origin: discovered
                version: 0.2.0

    - name: Create the derivedFrom AIMModel
      try:
        - apply:
            file: model.yaml

    - name: Assert the synthesised AIMProfileSet exists and is labelled
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileSet
              metadata:
                name: derivedfrom-finetune-profiles-b7b0084a
                labels:
                  aim.eai.amd.com/source-model: derivedfrom-finetune
                  aim.eai.amd.com/source-model-scope: namespace
              spec:
                selector:
                  aimId: derived-org/derived-model
                  modelId: derived-org/derived-model
                versionPolicy: pinned
                version: 0.2.0

    - name: Assert the derived AIMProfile is deployable, Derived, and stamps source-model labels
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: derivedfrom-finetune-profiles-b7b0084a-cpu-default-f2681b35
                labels:
                  aim.eai.amd.com/profile-role: deployable
                  aim.eai.amd.com/profile-origin: derived
              spec:
                aimId: derived-org/derived-model
                modelSources:
                  - modelId: derived-org/derived-finetune
                    sourceUri: s3://models/derived-finetune
              status:
                status: Ready
                deployable: true
                origin: derived

    - name: Assert AIMModel status surfaces aimId and profile set ref
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: derivedfrom-finetune
              status:
                status: Ready
                aimId: derived-org/derived-model
                profileSetRef:
                  name: derivedfrom-finetune-profiles-b7b0084a
                managedProfiles:
                  total: 1
                  ready: 1
