apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimmodel-seeded-derivatives
spec:
  description: |
    Verifies that v1alpha2 AIMModel profileCopy synthesizes a child AIMProfileSet and that
    model status reports only the direct managed derivatives from that child profile set.
    An unrelated matching AIMProfile in the namespace is ignored by the model status.
  timeouts:
    assert: 90s
  steps:
    - name: Seed the source namespace profile
      try:
        - apply:
            file: candidate-profile.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: seeded-derivative-source
              status:
                status: Ready
                version: 0.2.0

    - name: Create the profileCopy AIMModel
      try:
        - apply:
            file: model.yaml

    - name: Assert the synthesized child AIMProfileSet and derived profile exist
      try:
        # Identify the synthesized child set and its derived profile by the
        # source-model provenance labels the AIMModel stamps, not by the
        # hashed names (internal, algorithm-dependent). The model owns exactly
        # one synthesized set in this namespace, so the labels are unambiguous.
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileSet
              metadata:
                labels:
                  aim.eai.amd.com/source-model: seeded-derivative-model
                  aim.eai.amd.com/source-model-scope: namespace
              status:
                status: Ready
                managedProfiles:
                  total: 1
                  ready: 1
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                labels:
                  aim.eai.amd.com/profile-role: deployable
                  aim.eai.amd.com/profile-origin: derived
                  aim.eai.amd.com/source-model: seeded-derivative-model
              status:
                status: Ready

    - name: Seed an unrelated matching namespace profile
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: unrelated-matching-profile
              spec:
                aimId: seeded-org/seeded-model
                modelId: seeded-org/seeded-model
                profileId: gpu-ignored
                image: docker.io/amdenterpriseai/aim-dummy:0.2.0
                acceleratorModel: MI300X
                acceleratorCount: 1
                # Both aimId and modelSources are required by the v1alpha2
                # CRD invariant ("deployable XOR base"); this profile is
                # intentionally deployable but not owned by the AIMModel.
                modelSources:
                  - modelId: seeded-org/seeded-model
                    sourceUri: hf://seeded-org/seeded-model

    - name: Assert only direct managed derivatives contribute to status
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: seeded-derivative-model
              status:
                status: Ready
                aimId: seeded-org/seeded-model
                # The synthesized set name carries an internal hash; assert it
                # is populated rather than pinning the exact value.
                (profileSetRef.name != ''): true
                managedProfiles:
                  total: 1
                  ready: 1

    - name: Assert the unrelated profile exists but is not counted
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: unrelated-matching-profile
              spec:
                aimId: seeded-org/seeded-model
                modelId: seeded-org/seeded-model
                profileId: gpu-ignored
