apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimprofileset-no-recopy
spec:
  description: |
    Verifies that two copyable AIMProfileSets with the same selector do not
    amplify each other's outputs forever. Each set may copy the original source
    and one acyclic output from its sibling, but lineage prevents either set
    from consuming a descendant that already includes its own UID.
  timeouts:
    assert: 180s
  steps:
    - name: Create a copyable source AIMProfile
      try:
        - apply:
            file: source-profile.yaml

    - name: Wait for the source AIMProfile
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: profileset-no-recopy-source
                annotations:
                  aim.eai.amd.com/profile-copyable: "true"
              spec:
                aimId: HuggingFaceTB/SmolLM2-135M
                modelId: HuggingFaceTB/SmolLM2-135M
                profileId: cpu-bf16-latency
              status:
                status: Ready

    - name: Create the first AIMProfileSet
      try:
        - apply:
            file: first-profileset.yaml

    - name: Assert the first set copies exactly one profile
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileSet
              metadata:
                name: first-copy-profiles
              status:
                status: Ready
                managedProfiles:
                  total: 1
                  ready: 1
        # Match the copy by its owning profile-set-name annotation + spec
        # instead of the hashed derived name. profile-set-name pins it to the
        # first set specifically, so this can't accidentally match the second
        # set's (spec-identical) copy created later.
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                annotations:
                  aim.eai.amd.com/profile-source: copy
                  aim.eai.amd.com/profile-set-name: first-copy-profiles
              spec:
                aimId: HuggingFaceTB/SmolLM2-135M
                modelId: HuggingFaceTB/SmolLM2-135M
                profileId: cpu-bf16-latency
              status:
                status: Ready

    - name: Create the second AIMProfileSet with the same selector
      try:
        - apply:
            file: second-profileset.yaml

    - name: Assert both sets converge at two profiles
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileSet
              metadata:
                name: second-copy-profiles
              status:
                status: Ready
                managedProfiles:
                  total: 2
                  ready: 2
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileSet
              metadata:
                name: first-copy-profiles
              status:
                status: Ready
                managedProfiles:
                  total: 2
                  ready: 2
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                annotations:
                  aim.eai.amd.com/profile-source: copy
                  aim.eai.amd.com/profile-set-name: second-copy-profiles
                  aim.eai.amd.com/profile-copyable: "true"
              spec:
                aimId: HuggingFaceTB/SmolLM2-135M
                modelId: HuggingFaceTB/SmolLM2-135M
                profileId: cpu-bf16-latency
              status:
                status: Ready

    - name: Assert both totals remain bounded
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              sleep 10

              for name in first-copy-profiles second-copy-profiles; do
                total=$(kubectl get aimprofileset -n "$NAMESPACE" "$name" \
                  -o jsonpath='{.status.managedProfiles.total}')
                ready=$(kubectl get aimprofileset -n "$NAMESPACE" "$name" \
                  -o jsonpath='{.status.managedProfiles.ready}')
                if [ "$total" != "2" ] || [ "$ready" != "2" ]; then
                  echo "ERROR: $name did not remain bounded at 2 ready profiles: total=$total ready=$ready"
                  exit 1
                fi
              done
