apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfileSet
metadata:
  name: aimid-override-profiles
spec:
  sourceRef:
    name: aimid-override-discovery
  selector:
    aimId: cached-org/cached-model
  versionPolicy: all
  image: quay.io/acme/aim-base-vllm:0.9.0
  overrides:
    aimId: acme/custom-model-v2
    modelSources:
      - modelId: cached-org/custom-model
        sourceUri: s3://models/cached-model
