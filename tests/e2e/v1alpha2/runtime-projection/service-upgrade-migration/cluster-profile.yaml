# Backing cluster profile for the migration test. No accelerator fields, so it
# has no hardware requirement and reaches Ready in any cluster (kind CI lane or
# GPU vcluster). Deployable: aimId + modelSources are both set, so the shared
# builder can turn it into a complete namespace runtime and the consuming
# AIMService stands up a profile-owned (Shared) cache for it.
#
# The locally built aim-dummy image is reachable in kind and serves health
# checks on the projected runtime's port. This lets the rewritten
# InferenceService become current and Ready before guarded orphan cleanup.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-migration
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  image: docker.io/amdenterpriseai/aim-dummy:0.2.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
      # Small PVC: the download is simulated (no real bytes), so this only
      # needs to provision, not hold real weights.
      size: 1Gi
