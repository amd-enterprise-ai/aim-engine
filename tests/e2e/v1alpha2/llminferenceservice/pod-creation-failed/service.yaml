apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: llmisvc-refused
spec:
  profile:
    name: test-llmisvc-pod-creation-failed
  servingAPI: LLMInferenceService
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 512Mi
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
