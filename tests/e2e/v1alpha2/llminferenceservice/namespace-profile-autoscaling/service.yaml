apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: llmisvc-autoscaled
spec:
  profile:
    name: test-llmisvc-autoscaling
  servingAPI: LLMInferenceService
  minReplicas: 1
  maxReplicas: 2
  autoScaling:
    metrics:
      - type: PodMetric
        podmetric:
          metric:
            backend: "opentelemetry"
            metricNames:
              - vllm:num_requests_running
            query: "vllm:num_requests_running"
            operationOverTime: "avg"
          target:
            type: Value
            value: "1"
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
