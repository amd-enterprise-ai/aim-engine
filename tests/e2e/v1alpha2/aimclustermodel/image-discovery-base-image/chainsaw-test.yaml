# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# v1alpha2 AIMClusterModel base-image discovery for custom-model derivation (GPU-only).
#
# Cluster-scoped counterpart of
# tests/e2e/v1alpha2/aimmodel/image-discovery-base-image. The discovery
# Job runs in aim-system and the resulting AIMClusterProfiles are
# cluster-scoped.
#
# Author-only test: tagged `requires: gpu`; kind excludes it via the
# Makefile selector.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimclustermodel-image-discovery-base-image
  labels:
    requires: gpu
spec:
  description: |
    Validates that a base-image AIMClusterModel emits base
    AIMClusterProfiles (role=base, status.deployable=false) and that
    AIMClusterModel.status surfaces non-zero managedProfiles.base
    with managedProfiles.deployable=0.
  timeouts:
    assert: 300s
  steps:
    - name: Create the base-image AIMClusterModel
      try:
        - apply:
            file: model.yaml

    - name: Wait for discovery to complete and base cluster-profiles to be materialised
      try:
        - assert:
            timeout: 300s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: image-discovery-base-image
              status:
                discoveryCacheRef:
                  namespace: aim-system
                (discoveryCacheRef.name != ""): true
                (discoveredProfiles.total > `0`): true
                (aimId == null): true
                managedProfiles:
                  deployable: 0
                  (base > `0`): true

    - name: Assert at least one AIMClusterProfile owned by this model carries role=base
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterProfile
              metadata:
                labels:
                  aim.eai.amd.com/profile-role: base
                  aim.eai.amd.com/source-model: image-discovery-base-image
                  aim.eai.amd.com/source-model-scope: cluster
              status:
                deployable: false
