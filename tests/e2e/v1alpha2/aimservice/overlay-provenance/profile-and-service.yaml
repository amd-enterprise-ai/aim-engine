apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: overlay-seed-profile
spec:
  # Hand-authored deployable profiles use the typed field rather than the
  # producer-only discovery annotation.
  baseImageRef: registry.example.com/aim-cpu-base:0.12.0
  aimId: overlay-test/model
  modelId: overlay-test/model
  profileId: cpu-default
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorModel: EPYC_ZEN5
  acceleratorType: cpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: overlay-test/model
      sourceUri: hf://overlay-test/model
---
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: overlay-provenance-service
spec:
  profile:
    name: overlay-seed-profile
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  profileOverrides:
    modelSources:
      - modelId: overlay-test/fine-tune
        sourceUri: hf://overlay-test/fine-tune
