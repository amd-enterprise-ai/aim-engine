apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: overlay-seed-profile
  annotations:
    # Simulate the producer-owned AIM_BASE_IMAGE_REF metadata that image
    # discovery stamps. The profile reconciler copies this into status and
    # the service overlay can also consume it immediately.
    aim.eai.amd.com/base-image: registry.example.com/aim-cpu-base:0.12.0
spec:
  aimId: overlay-test/model
  modelId: overlay-test/model
  profileId: cpu-default
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorModel: EPYC_ZEN5
  acceleratorType: cpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: overlay-test/model
      sourceUri: hf://overlay-test/model
---
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: overlay-provenance-service
spec:
  profile:
    name: overlay-seed-profile
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  profileOverrides:
    modelSources:
      - modelId: overlay-test/fine-tune
        sourceUri: hf://overlay-test/fine-tune
