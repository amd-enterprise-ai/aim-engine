# Weights-REPLACED override: swap in user-supplied weights via modelSources.
# The optimized seed image is specific to its model, so once the weights are
# replaced the overlay must resolve back to the seed's aim-base runtime,
# mapped explicitly by RuntimeConfig to registry.example.com/aim-base:0.11.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: overlay-weights-replaced-service
spec:
  profile:
    name: overlay-img-seed
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  profileOverrides:
    modelSources:
      - modelId: user/finetune-weights
        sourceUri: hf://user/finetune-weights
        size: 4Gi
