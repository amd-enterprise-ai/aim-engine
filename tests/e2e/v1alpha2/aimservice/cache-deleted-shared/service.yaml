apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: cache-deleted-shared
spec:
  profile:
    name: cache-deleted-shared
  replicas: 1
  caching:
    mode: Shared
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
