# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Resolve-by-model-and-selector: AIMService combines spec.model.name (which
# desugars to selector.modelRef.name) with selector spec filters (here:
# precision=bf16). The resolver must filter the model's profile pool by
# precision before ranking.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimservice-resolve-by-model-and-selector
spec:
  timeouts:
    assert: 120s
  steps:
    - name: Seed two copyable source AIMProfiles with different precision
      try:
        - apply:
            file: seed-profiles.yaml

    - name: Apply the AIMModel that derives both profiles
      try:
        - apply:
            file: model.yaml
        - assert:
            timeout: 90s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: resolve-by-model-and-selector-model
              status:
                aimId: model-selector/qwen
                managedProfiles:
                  total: 2

    - name: Apply a service that narrows to bf16 via the selector
      try:
        - apply:
            file: service.yaml

    - name: Assert the service resolves and is selecting a bf16 profile
      try:
        - script:
            timeout: 60s
            content: |
              set -eu
              SERVICE_GV=aimservices.v1alpha1.aim.eai.amd.com
              PROFILE_GV=aimprofiles.v1alpha2.aim.eai.amd.com

              for _ in $(seq 1 30); do
                NAME=$(kubectl get "$SERVICE_GV" -n "$NAMESPACE" \
                  resolve-by-model-and-selector-service \
                  -o jsonpath='{.status.resolvedProfile.name}')
                if [ -n "$NAME" ]; then
                  break
                fi
                sleep 2
              done
              if [ -z "$NAME" ]; then
                echo "ERROR: resolvedProfile.name is empty"
                kubectl get "$SERVICE_GV" -n "$NAMESPACE" \
                  resolve-by-model-and-selector-service -o yaml
                exit 1
              fi
              echo "Resolved profile: $NAME"

              PRECISION=$(kubectl get "$PROFILE_GV" -n "$NAMESPACE" "$NAME" \
                -o jsonpath='{.spec.precision}')
              if [ "$PRECISION" != "bf16" ]; then
                echo "ERROR: resolved profile precision=$PRECISION; expected bf16"
                exit 1
              fi
              echo "Resolved profile precision=$PRECISION OK"
