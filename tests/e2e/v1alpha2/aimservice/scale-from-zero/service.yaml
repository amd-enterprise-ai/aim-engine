apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: scale-from-zero
spec:
  runtimeConfigName: scale-from-zero
  profile:
    name: scale-from-zero
  minReplicas: 0
  maxReplicas: 3
  autoScaling:
    pollingInterval: 5
    cooldownPeriod: 30
    metrics:
      - type: PodMetric
        podmetric:
          metric:
            backend: opentelemetry
            metricNames:
              - vllm:num_requests_running
            query: vllm:num_requests_running
            operationOverTime: avg
          target:
            type: Value
            value: "1"
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
