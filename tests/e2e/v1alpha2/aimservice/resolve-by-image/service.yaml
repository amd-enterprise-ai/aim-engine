apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: resolve-by-image-service
  annotations:
    # v1alpha2 quick-start: spec.model.image alone defaults to the
    # v1alpha1 template pipeline. The reconciler-pipeline annotation
    # opts this service into the v1alpha2 profile pipeline, where the
    # resolver looks up AIMModels by spec.image and auto-creates a
    # dedicated AIMModel owned by this service when no match exists.
    #
    # Once v1alpha1 is removed the annotation becomes unnecessary; this
    # test continues to assert the annotation-driven path because that
    # is the documented migration-window flow today.
    aim.eai.amd.com/reconciler-pipeline: profile
spec:
  model:
    image: docker.io/amdenterpriseai/aim-dummy:0.2.0
  profile:
    selector:
      # Discovery only publishes profiles that fit the cluster's nodes. The
      # image's MI300X profiles default to 32Gi of host memory per GPU, so on
      # smaller nodes only its unoptimized CPU profile is published, which
      # the default minimumType=optimized floor would exclude.
      minimumType: any
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
