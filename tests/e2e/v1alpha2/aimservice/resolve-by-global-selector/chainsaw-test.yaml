# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Resolve-by-global-selector: the AIMService narrows AIMProfiles via aimId +
# precision filters (no model anchor). v1alpha2 CEL guarantees the selector
# sets at least one of aimId or modelRef for index-backed watch fan-out.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimservice-resolve-by-global-selector
spec:
  timeouts:
    assert: 120s
  steps:
    - name: Apply two AIMProfiles with the same aimId but different precision
      try:
        - apply:
            file: profiles.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: selector-fp8-profile
              status:
                deployable: true

    - name: Apply a service with a selector that picks the fp8 profile
      try:
        - apply:
            file: service.yaml

    - name: Assert the service resolves to the fp8 profile
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: resolve-by-global-selector-service
              status:
                (conditions[?type == 'ProfileReady']):
                  - status: "True"
                    reason: ProfileResolved
                resolvedProfile:
                  name: selector-fp8-profile
                  scope: Namespace
