# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService E2E Test: adapter-enabled service upgrades an existing Shared cache
#
# A service that serves no adapters creates a Shared AIMProfileCache whose base
# model artifact has no adapter disk. A dynamic-adapter service on the same
# profile must reuse that cache rather than create a second one, turn on
# spec.requiresAdapterDisk, and have the AIMProfileCache controller add the
# adapter disk to the SAME artifact in place: no new artifact, no re-download,
# and the first service's InferenceService and pod are left untouched, and its
# Ready condition never transitions. Both steps record an AdapterDiskRequested
# event. The flag stays on after the
# adapter-enabled service is deleted, and the API rejects turning it off.
#
# Full chain, nothing frozen: the profile, profile cache, artifact and service
# controllers all reconcile naturally. No GPU is needed: the profile has no
# accelerator requirement and serves with aim-dummy, downloads are simulated
# through the first service's caching.env, and the adapter disk is backed by
# local-path in kind.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: adapters-shared-cache-upgrade
spec:
  timeouts:
    assert: 120s
    # PVC-backed caches and InferenceService finalizers make namespace teardown
    # slower than the global cleanup default.
    cleanup: 240s
  steps:
    - name: Apply the namespace profile and wait for Ready
      try:
        - apply:
            file: profile.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: adapters-upgrade-profile
              status:
                status: Ready

    - name: Create the service that serves no adapters
      try:
        - apply:
            file: plain-service.yaml

    - name: Assert its Shared cache and InferenceService reach Ready
      try:
        - assert:
            timeout: 120s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileCache
              metadata:
                labels:
                  aim.eai.amd.com/service: adapters-upgrade-plain
              spec:
                profileName: adapters-upgrade-profile
                profileScope: Namespace
                mode: Shared
              status:
                status: Ready
        - assert:
            timeout: 300s
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: adapters-upgrade-plain
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: adapters-upgrade-plain
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: Record the cache, its artifact, and the first service's InferenceService and pods
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              CACHE=$(kubectl get aimprofilecache -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=adapters-upgrade-plain -o jsonpath='{.items[0].metadata.name}')
              FLAG=$(kubectl get aimprofilecache -n "$NAMESPACE" "$CACHE" -o jsonpath='{.spec.requiresAdapterDisk}')
              ARTIFACT=$(kubectl get aimprofilecache -n "$NAMESPACE" "$CACHE" -o jsonpath='{.status.artifacts.*.name}')
              ARTIFACT_UID=$(kubectl get aimartifact -n "$NAMESPACE" "$ARTIFACT" -o jsonpath='{.metadata.uid}')
              DISK=$(kubectl get aimartifact -n "$NAMESPACE" "$ARTIFACT" -o jsonpath='{.spec.adapterDisk}')
              ISVC=$(kubectl get inferenceservice -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=adapters-upgrade-plain -o jsonpath='{.items[0].metadata.name}')
              ISVC_GEN=$(kubectl get inferenceservice -n "$NAMESPACE" "$ISVC" -o jsonpath='{.metadata.generation}')
              PODS=$(kubectl get pods -n "$NAMESPACE" -l serving.kserve.io/inferenceservice="$ISVC" \
                -o jsonpath='{.items[*].metadata.uid}')
              READY_SINCE=$(kubectl get aimservices.v1alpha2.aim.eai.amd.com -n "$NAMESPACE" adapters-upgrade-plain \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].lastTransitionTime}')
              echo "cache=$CACHE artifact=$ARTIFACT uid=$ARTIFACT_UID isvc=$ISVC generation=$ISVC_GEN pods=$PODS readySince=$READY_SINCE"
              [ -n "$ARTIFACT" ] && [ -n "$ARTIFACT_UID" ] && [ -n "$ISVC_GEN" ] && [ -n "$PODS" ] && [ -n "$READY_SINCE" ] \
                || { echo "ERROR: missing state"; exit 1; }
              [ -z "$FLAG" ] || [ "$FLAG" = false ] || { echo "ERROR: cache already requires an adapter disk"; exit 1; }
              [ -z "$DISK" ] || { echo "ERROR: artifact already has an adapter disk: $DISK"; exit 1; }
              kubectl create configmap adapters-upgrade-state -n "$NAMESPACE" \
                --from-literal=cache="$CACHE" --from-literal=artifact="$ARTIFACT" \
                --from-literal=artifactUID="$ARTIFACT_UID" --from-literal=isvc="$ISVC" \
                --from-literal=isvcGeneration="$ISVC_GEN" --from-literal=pods="$PODS" \
                --from-literal=readySince="$READY_SINCE"
              # lastTransitionTime has one-second precision: any Ready transition
              # after this point, even one reverted at once, records a later time.
              sleep 1

    - name: Create the dynamic-adapter service on the same profile
      try:
        - apply:
            file: lora-service.yaml

    - name: Assert the same cache and artifact gain the adapter disk in place
      try:
        - script:
            # Polls for up to ~180s; override the config exec timeout.
            timeout: 240s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              state() { kubectl get configmap adapters-upgrade-state -n "$NAMESPACE" -o jsonpath="{.data.$1}"; }
              CACHE=$(state cache); ARTIFACT=$(state artifact); ARTIFACT_UID=$(state artifactUID)
              for i in $(seq 1 90); do
                CACHES=$(kubectl get aimprofilecache -n "$NAMESPACE" -o name | wc -l)
                FLAG=$(kubectl get aimprofilecache -n "$NAMESPACE" "$CACHE" -o jsonpath='{.spec.requiresAdapterDisk}')
                ARTIFACTS=$(kubectl get aimartifact -n "$NAMESPACE" -o name | wc -l)
                UID_NOW=$(kubectl get aimartifact -n "$NAMESPACE" "$ARTIFACT" -o jsonpath='{.metadata.uid}')
                PVC=$(kubectl get aimartifact -n "$NAMESPACE" "$ARTIFACT" -o jsonpath='{.status.adapterPersistentVolumeClaim}')
                if [ "$CACHES" = 1 ] && [ "$FLAG" = true ] && [ "$ARTIFACTS" = 1 ] \
                  && [ "$UID_NOW" = "$ARTIFACT_UID" ] && [ -n "$PVC" ]; then
                  kubectl get pvc -n "$NAMESPACE" "$PVC" >/dev/null
                  echo "cache $CACHE requires the disk; artifact $ARTIFACT ($UID_NOW) has adapter PVC $PVC"
                  for target in "AIMProfileCache/$CACHE" "AIMArtifact/$ARTIFACT"; do
                    EVENTS=$(kubectl get events -n "$NAMESPACE" \
                      --field-selector "reason=AdapterDiskRequested,involvedObject.kind=${target%%/*},involvedObject.name=${target#*/}" \
                      -o name | wc -l)
                    [ "$EVENTS" -ge 1 ] || { echo "ERROR: no AdapterDiskRequested event on $target"; exit 1; }
                  done
                  exit 0
                fi
                sleep 2
              done
              echo "ERROR: caches=$CACHES flag='$FLAG' artifacts=$ARTIFACTS uid='$UID_NOW' (want $ARTIFACT_UID) pvc='$PVC'"
              kubectl get aimprofilecache,aimartifact -n "$NAMESPACE" -o yaml
              exit 1

    - name: Assert the dynamic-adapter service serves with the adapter disk mounted
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: adapters-upgrade-lora
              status:
                (conditions[?type == 'ProfileCacheReady']):
                  - status: "True"
                (conditions[?type == 'AdaptersReady']):
                  - status: "True"
        - assert:
            timeout: 300s
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: adapters-upgrade-lora
              spec:
                predictor:
                  model:
                    (volumeMounts[?mountPath == '/adapters']):
                      - readOnly: true
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: Assert the first service was not disturbed
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: adapters-upgrade-plain
              status:
                (conditions[?type == 'ProfileCacheReady']):
                  - status: "True"
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              state() { kubectl get configmap adapters-upgrade-state -n "$NAMESPACE" -o jsonpath="{.data.$1}"; }
              ISVC=$(state isvc)
              GEN=$(kubectl get inferenceservice -n "$NAMESPACE" "$ISVC" -o jsonpath='{.metadata.generation}')
              PODS=$(kubectl get pods -n "$NAMESPACE" -l serving.kserve.io/inferenceservice="$ISVC" \
                -o jsonpath='{.items[*].metadata.uid}')
              [ "$GEN" = "$(state isvcGeneration)" ] || { echo "ERROR: InferenceService generation changed: $(state isvcGeneration) -> $GEN"; exit 1; }
              [ "$PODS" = "$(state pods)" ] || { echo "ERROR: predictor pods changed: $(state pods) -> $PODS"; exit 1; }
              echo "InferenceService $ISVC unchanged at generation $GEN with the same pods"
              READY=$(kubectl get aimservices.v1alpha2.aim.eai.amd.com -n "$NAMESPACE" adapters-upgrade-plain \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status} {.status.conditions[?(@.type=="Ready")].lastTransitionTime}')
              [ "$READY" = "True $(state readySince)" ] \
                || { echo "ERROR: Ready transitioned while the adapter disk was added: True $(state readySince) -> $READY"; exit 1; }
              echo "AIMService adapters-upgrade-plain stayed Ready since $(state readySince)"

    - name: Delete the dynamic-adapter service
      try:
        - delete:
            ref:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              name: adapters-upgrade-lora
        - error:
            timeout: 120s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: adapters-upgrade-lora

    - name: Assert the cache keeps requiring the adapter disk
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              state() { kubectl get configmap adapters-upgrade-state -n "$NAMESPACE" -o jsonpath="{.data.$1}"; }
              FLAG=$(kubectl get aimprofilecache -n "$NAMESPACE" "$(state cache)" -o jsonpath='{.spec.requiresAdapterDisk}')
              DISK=$(kubectl get aimartifact -n "$NAMESPACE" "$(state artifact)" -o jsonpath='{.spec.adapterDisk}')
              [ "$FLAG" = true ] && [ -n "$DISK" ] || { echo "ERROR: flag='$FLAG' adapterDisk='$DISK'"; exit 1; }
              echo "requiresAdapterDisk and the adapter disk survive the adapter-enabled service"

    - name: Reject turning requiresAdapterDisk off
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              state() { kubectl get configmap adapters-upgrade-state -n "$NAMESPACE" -o jsonpath="{.data.$1}"; }
              CACHE=$(state cache)
              [ -n "$CACHE" ] || { echo "ERROR: no recorded cache name"; exit 1; }
              for value in false null; do
                if OUT=$(kubectl patch aimprofilecache -n "$NAMESPACE" "$CACHE" \
                    --type merge -p "{\"spec\":{\"requiresAdapterDisk\":$value}}" 2>&1); then
                  echo "ERROR: setting requiresAdapterDisk to $value was accepted"
                  exit 1
                fi
                echo "$OUT" | grep -q 'requiresAdapterDisk cannot be turned off once set' \
                  || { echo "ERROR: setting requiresAdapterDisk to $value failed for another reason: $OUT"; exit 1; }
              done
              FLAG=$(kubectl get aimprofilecache -n "$NAMESPACE" "$CACHE" -o jsonpath='{.spec.requiresAdapterDisk}')
              [ "$FLAG" = true ] || { echo "ERROR: requiresAdapterDisk is '$FLAG' after the rejected patches"; exit 1; }
              echo "OK: requiresAdapterDisk cannot be turned off"
