apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: priority-class
spec:
  profile:
    name: priority-class
  replicas: 1
  priorityClassName: v1alpha2-aimservice-priority-class
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
