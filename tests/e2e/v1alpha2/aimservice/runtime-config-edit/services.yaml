# Two profile-pipeline services carrying the label the runtime configs will
# propagate once enabled. Each names the runtime config of one scope.
#
# caching.env switches the AIMProfileCache's download Job into simulation mode
# so the Shared cache reaches Ready without a real download.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: namespace-config-consumer
  labels:
    team-alpha: frontend
spec:
  profile:
    name: test-runtime-config-edit
  runtimeConfigName: runtime-config-edit
  replicas: 1
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
---
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: cluster-config-consumer
  labels:
    team-alpha: frontend
spec:
  profile:
    name: test-runtime-config-edit
  runtimeConfigName: test-runtime-config-edit
  replicas: 1
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
