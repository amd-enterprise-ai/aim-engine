apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: default
spec:
  routing:
    enabled: true
    gatewayRef:
      name: kserve-ingress-gateway
      namespace: envoy-gateway-system
    pathTemplate: "/integration/v1alpha2-route-annotations/{.metadata.namespace}/{.metadata.name}"
    annotations:
      runtime-key: runtime-value
      shared-key: from-runtime
