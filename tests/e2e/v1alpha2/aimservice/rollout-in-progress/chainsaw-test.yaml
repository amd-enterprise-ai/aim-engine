# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# A running service whose new predictor revision cannot start keeps serving from
# the previous revision. It stays Running but reports Ready=False with reason
# RolloutInProgress until the rollout completes, or RolloutStalled with a
# Warning event once the new revision crash-loops. A pod that a rollout replaces
# is not reported as an invalid spec, even when it exits non-zero.
#
# One new revision requests more memory than any node has; another sets a PATH
# that hides the image's server binary. No accelerator is involved and the
# cache download is simulated, so this runs in the kind lane without a
# `requires` gate.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimservice-rollout-in-progress
spec:
  timeouts:
    assert: 180s
    # The AIMProfileCache -> AIMArtifact -> PVC finalizer chain makes namespace
    # teardown slow on a loaded cluster.
    cleanup: 240s
  steps:
    - name: Create the profile and a single-replica service
      try:
        - apply:
            file: profile.yaml
        - apply:
            file: service.yaml

    - name: The service reaches Running and Ready
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              status:
                status: Running
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: Roll out a revision that requests more memory than any node has
      try:
        - patch:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              spec:
                resources:
                  requests:
                    memory: 64Ti
                  limits:
                    memory: 64Ti

    - name: The old pod keeps serving, so the service stays Running but not Ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                labels:
                  aim.eai.amd.com/service: rollout-in-progress
              status:
                readyReplicas: 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              status:
                status: Running
                (conditions[?type == 'Ready']):
                  - status: "False"
                    reason: RolloutInProgress
                (conditions[?type == 'InferenceServiceReady']):
                  - status: "False"
                    reason: RolloutInProgress

    - name: A schedulable revision completes the rollout and Ready returns
      try:
        - patch:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              spec:
                resources:
                  requests:
                    memory: 1Gi
                  limits:
                    memory: 2Gi
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              status:
                status: Running
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: A crash-looping revision stalls the rollout and warns
      try:
        - script:
            content: |
              kubectl patch aimservices.v1alpha2.aim.eai.amd.com rollout-in-progress -n "$NAMESPACE" --type merge \
                -p '{"spec":{"profileOverrides":{"containerEnv":[{"name":"PATH","value":"/nonexistent"}]}}}'
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              status:
                status: Running
                (conditions[?type == 'Ready']):
                  - status: "False"
                    reason: RolloutStalled
        # A replaced pod exits non-zero on SIGTERM and stays Failed until it is
        # gone. Reporting it as an invalid spec records Warnings on every
        # reconcile, which can use up the event budget of the service before
        # the RolloutStalled Warning below is recorded.
        - error:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: PodFailed
              involvedObject:
                kind: AIMService
                name: rollout-in-progress
        - error:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: InvalidSpec
              involvedObject:
                kind: AIMService
                name: rollout-in-progress
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: RolloutStalled
              involvedObject:
                kind: AIMService
                name: rollout-in-progress

    - name: Dropping the override completes the rollout and Ready returns
      try:
        - script:
            content: |
              kubectl patch aimservices.v1alpha2.aim.eai.amd.com rollout-in-progress -n "$NAMESPACE" --type merge \
                -p '{"spec":{"profileOverrides":null}}'
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: rollout-in-progress
              status:
                status: Running
                (conditions[?type == 'Ready']):
                  - status: "True"
