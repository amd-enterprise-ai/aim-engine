apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: caching-mode-dedicated
spec:
  profile:
    name: caching-mode-dedicated
  replicas: 1
  caching:
    mode: Dedicated
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
