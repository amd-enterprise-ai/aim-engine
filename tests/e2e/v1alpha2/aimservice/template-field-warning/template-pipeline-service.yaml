# Without spec.profile this service is reconciled by the AIMServiceTemplate
# pipeline, which reads spec.model.custom, so the field is not ignored and the
# service must not get the TemplateFieldsIgnored warning.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: template-pipeline
spec:
  model:
    custom:
      baseImage: docker.io/amdenterpriseai/aim-dummy:0.2.0
      modelSources:
        - modelId: Qwen/Qwen3-0.6B
          sourceUri: hf://Qwen/Qwen3-0.6B
          size: 1Gi
      hardware:
        cpu:
          requests: "1"
  replicas: 1
  caching:
    env:
      - name: AIM_DEBUG_SIMULATE_HF_DOWNLOAD
        value: "true"
      - name: AIM_DEBUG_SIMULATE_HF_DURATION
        value: "2"
