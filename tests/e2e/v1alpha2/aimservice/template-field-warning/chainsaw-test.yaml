# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Template-era spec fields on a profile-pipeline AIMService are reported, not
# acted on.
#
# A service that sets spec.model.custom next to spec.profile gets a
# TemplateFieldsIgnored condition naming the field and a Warning event, and
# still reaches Running. A service without template-era fields and a
# service on the AIMServiceTemplate pipeline get no warning. Removing the field
# clears the warning.
#
# No accelerator is involved and the cache download is simulated, so this runs
# in the kind lane without a `requires` gate.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimservice-template-field-warning
spec:
  timeouts:
    assert: 180s
    # The AIMProfileCache -> AIMArtifact -> PVC finalizer chain makes namespace
    # teardown slow on a loaded cluster.
    cleanup: 240s
  steps:
    - name: Create the backing profile
      try:
        - apply:
            file: profile.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: template-field-warning
              status:
                status: Ready

    - name: Both profile-pipeline services reach Running
      try:
        - apply:
            file: services.yaml
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: with-custom-model
              status:
                status: Running
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: without-template-fields
              status:
                status: Running

    - name: Only the service with spec.model.custom is warned
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: with-custom-model
              status:
                (conditions[?type == 'TemplateFieldsIgnored']):
                  - status: "True"
                    reason: TemplateFieldsSet
                    message: "These fields have no effect on a profile-based AIMService and can be removed: spec.model.custom"
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: TemplateFieldsSet
              involvedObject:
                kind: AIMService
                name: with-custom-model
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: without-template-fields
              status:
                (length(conditions[?type == 'TemplateFieldsIgnored'])): 0
        - error:
            resource:
              apiVersion: v1
              kind: Event
              reason: TemplateFieldsSet
              involvedObject:
                kind: AIMService
                name: without-template-fields

    - name: A template-pipeline service with spec.model.custom is not warned
      try:
        - apply:
            file: template-pipeline-service.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: template-pipeline
              status:
                reconcilerPipeline: template
                (conditions[?type == 'MigrationRequired']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: template-pipeline
              status:
                (length(conditions[?type == 'TemplateFieldsIgnored'])): 0

    - name: Removing spec.model.custom clears the warning
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl patch aimservices.v1alpha2.aim.eai.amd.com with-custom-model -n "$NAMESPACE" \
                --type=json -p '[{"op": "remove", "path": "/spec/model"}]'
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: with-custom-model
              status:
                status: Running
                (length(conditions[?type == 'TemplateFieldsIgnored'])): 0
