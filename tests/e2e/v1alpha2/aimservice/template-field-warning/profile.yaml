# Deployable AIMProfile without accelerator fields, so it reaches Ready in any
# cluster. The aim-dummy image serves health checks on the projected runtime's
# port, so services on it reach Running in kind.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: template-field-warning
spec:
  aimId: test/template-field-warning
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  image: docker.io/amdenterpriseai/aim-dummy:0.2.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
      # The download is simulated, so the PVC only needs to provision.
      size: 1Gi
