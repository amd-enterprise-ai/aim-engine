# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Fake GPU nodes, device plugin: pods requesting amd.com/gpu are placed on the
# fake device-plugin nodes by their capacity.
#
# Needs the KWOK lane: KWOK, the fake GPU fleet from hack/fakegpu/fleet.yaml,
# and a cluster with the ExtendedResourceToleration admission plugin
# (hack/kind/config.yaml). The pods carry no toleration of their own; the
# plugin adds one for the fake nodes' amd.com/gpu:NoSchedule taint, as it
# would for inference pods.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kwok-device-plugin-placement
  labels:
    requires: kwok
spec:
  description: amd.com/gpu requests land on fake device-plugin nodes with enough GPUs.
  timeouts:
    assert: 60s
  steps:
    - name: a pod requesting a whole MI300X node schedules onto one
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: eight-mi300x
              spec:
                nodeSelector:
                  aim.eai.amd.com/fake-gpu-group: dp-mi300x
                containers:
                  - name: main
                    image: registry.k8s.io/pause:3.10
                    resources:
                      limits:
                        amd.com/gpu: "8"
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: eight-mi300x
              (starts_with(spec.nodeName || '', 'fake-gpu-dp-mi300x-')): true
              status:
                phase: Running

    - name: more GPUs than any node has stays Pending
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: sixteen-mi300x
              spec:
                nodeSelector:
                  aim.eai.amd.com/fake-gpu-group: dp-mi300x
                containers:
                  - name: main
                    image: registry.k8s.io/pause:3.10
                    resources:
                      limits:
                        amd.com/gpu: "16"
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: sixteen-mi300x
              status:
                phase: Pending
                (conditions[?type == 'PodScheduled'] | [0]):
                  status: "False"
                  reason: Unschedulable

    - name: CPX partitions are advertised as separate amd.com/gpu
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: forty-cpx-partitions
              spec:
                nodeSelector:
                  aim.eai.amd.com/fake-gpu-group: dp-mi300x-cpx
                containers:
                  - name: main
                    image: registry.k8s.io/pause:3.10
                    resources:
                      limits:
                        amd.com/gpu: "40"
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: forty-cpx-partitions
              spec:
                nodeName: fake-gpu-dp-mi300x-cpx-0
              status:
                phase: Running
