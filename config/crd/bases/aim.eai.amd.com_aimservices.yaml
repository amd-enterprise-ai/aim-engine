                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              requests:
                                anyOf:
                                - type: integer
                                - type: string
                                description: Requests is the number of CPU cores to
                                  request. Required and must be > 0.
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                            required:
                            - requests
                            type: object
                          gpu:
                            description: GPU specifies GPU requirements. If not set,
                              no GPUs are requested (CPU-only model).
                            properties:
                              minVram:
                                anyOf:
                                - type: integer
                                - type: string
                                description: |-
                                  MinVRAM limits deployment to GPUs having at least this much VRAM.
