---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: aimservices.aim.eai.amd.com
spec:
  group: aim.eai.amd.com
  names:
    categories:
    - aim
    - all
    kind: AIMService
    listKind: AIMServiceList
    plural: aimservices
    shortNames:
    - aimsvc
    singular: aimservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.resolvedModel.name
      name: Model
      type: string
    - jsonPath: .status.resolvedTemplate.name
      name: Template
      type: string
    - jsonPath: .status.resolvedProfile.name
      name: Profile
      priority: 1
      type: string
    - jsonPath: .status.runtime.replicas
      name: Replicas
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    deprecationWarning: aim.eai.amd.com/v1alpha1 AIMService is deprecated; use aim.eai.amd.com/v1alpha2
      (spec.profile) instead. The v1alpha1 model/template fields may be removed in
      a future release.
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AIMService manages a KServe-based AIM inference service for the selected model and template.
          Note: KServe uses {name}-{namespace} format which must not exceed 63 characters.
          This constraint is validated at runtime since CEL cannot access metadata.namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AIMServiceSpec defines the desired state of AIMService.

              Binds a canonical model to an AIMServiceTemplate and configures replicas,
              caching behavior, and optional overrides. The template governs the base
              runtime selection knobs, while the overrides field allows service-specific
              customization.

              With v1alpha2, a Profile can be used instead of a Template. Template and Profile
              are mutually exclusive — at least one resolution path must be specified.
            properties:
              adapterMode:
                default: static
                description: |-
                  AdapterMode is the immutable adapter contract for the service, mapped
                  directly to the AIM_ADAPTER_MODE container env. static (default) freezes
                  spec.adapters and mounts the adapter disk only when adapters are declared;
                  dynamic allows editing spec.adapters and mounts the disk even at zero
                  adapters (so add/remove never restarts the pod). It is immutable after
                  creation.
                enum:
                - static
                - dynamic
                type: string
                x-kubernetes-validations:
                - message: spec.adapterMode is immutable after creation
                  rule: self == oldSelf
              adapters:
                description: |-
                  Adapters is the load-bearing list of LoRA adapters this service serves.
                  The list may only be edited after creation when adapterMode is dynamic
                  (static freezes it). Omitting the list serves no adapters.
                  Supported on both the template (v1alpha1) and profile (v1alpha2) pipelines:
                  the base model the adapters attach to is resolved from the service's
                  template cache or profile cache respectively. In dynamic mode the list may
                  be edited after creation: adding an adapter stages it into the service's
                  subtree and the aim-runtime hot-loads it; removing one lets the runtime
                  unload it (subtree cleanup is reclaimed out-of-band). The InferenceService
                  is never modified for adapter changes — it mounts the whole per-service
                  subtree read-only. Entries are pure references; (kind, name) pairs must be
                  unique. Omitting the list serves no adapters.
                items:
                  description: |-
                    AIMServiceAdapterReference is a typed reference to a LoRA adapter served by this
                    service. Today it is resolved as a pure reference to an existing adapter
                    artifact. The inline bootstrap fields (sourceUri/modelId/rank) are reserved:
                    the schema accepts them, but create-if-missing self-healing is not yet wired,
                    so a referenced adapter artifact must currently exist.
                  properties:
                    kind:
                      description: Kind is the kind of the referenced adapter. Required;
                        restricted to AIMArtifact in v1.
                      enum:
                      - AIMArtifact
                      type: string
                    modelId:
                      description: |-
                        ModelID is the adapter's canonical model id. Required when SourceURI is set.
                        RESERVED: only meaningful alongside SourceURI.
                      type: string
                    name:
                      description: Name is the metadata.name of the referenced adapter
                        artifact.
                      maxLength: 253
                      minLength: 1
                      type: string
                    rank:
                      description: |-
                        Rank is the optional LoRA rank for the bootstrapped adapter. RESERVED: only
                        meaningful alongside SourceURI.
                      format: int32
                      minimum: 1
                      type: integer
                    sourceUri:
                      description: |-
                        SourceURI is an optional create-if-missing bootstrap source. When set and no
                        adapter artifact named Name exists, a later release will create one from this
                        source; a pre-existing artifact always wins. RESERVED: not yet acted on.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: modelId is required when sourceUri is set
                    rule: '!has(self.sourceUri) || has(self.modelId)'
                  - message: modelId and rank are only allowed together with sourceUri
                    rule: has(self.sourceUri) || (!has(self.modelId) && !has(self.rank))
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              autoScaling:
                description: |-
                  AutoScaling configures advanced autoscaling behavior using KEDA.
                  Supports custom metrics from OpenTelemetry backend.
                  When specified, MinReplicas and MaxReplicas should also be set.
                properties:
                  cooldownPeriod:
                    description: |-
                      CooldownPeriod is the seconds-of-inactivity budget KEDA waits before
                      scaling back to minReplicaCount. Under scale-to-zero, defaults to a
                      memory-derived value (300-1200s); otherwise unset (KEDA default of 300).
                    format: int32
                    minimum: 0
                    type: integer
                  metrics:
                    description: |-
                      Metrics is a list of metrics to be used for autoscaling.
                      Each metric defines a source (PodMetric) and target values.
                    items:
                      description: |-
                        AIMServiceMetricsSpec defines a single metric for autoscaling.
                        Specifies the metric source type and configuration.
                      properties:
                        podmetric:
                          description: |-
                            PodMetric refers to a metric describing each pod in the current scale target.
                            Used when Type is "PodMetric". Supports backends like OpenTelemetry for custom metrics.
                          properties:
                            metric:
                              description: |-
                                Metric contains the metric identification and backend configuration.
                                Defines which metrics to collect and how to query them.
                              properties:
                                backend:
                                  default: opentelemetry
                                  description: |-
                                    Backend defines the metrics backend to use.
                                    If not specified, defaults to "opentelemetry".
                                  enum:
                                  - opentelemetry
                                  type: string
                                metricNames:
                                  description: |-
                                    MetricNames specifies which metrics to collect from pods and send to ServerAddress.
                                    Example: ["vllm:num_requests_running"]
                                  items:
                                    type: string
                                  type: array
                                operationOverTime:
                                  description: |-
                                    OperationOverTime specifies the operation to aggregate metrics over time.
                                    Valid values: "last_one", "avg", "max", "min", "rate", "count"
                                    Default: "last_one"
                                  type: string
                                query:
                                  description: |-
                                    Query specifies the query to run to retrieve metrics from the backend.
                                    The query syntax depends on the backend being used.
                                    Example: "vllm:num_requests_running" for OpenTelemetry.
                                  type: string
                                serverAddress:
                                  description: |-
                                    ServerAddress specifies the address of the metrics backend server.
                                    If not specified, defaults to "keda-otel-scaler.keda.svc:4317" for OpenTelemetry backend.
                                  type: string
                              type: object
                              x-kubernetes-validations:
                              - message: podmetric.metric must set query or metricNames
                                  so the scaler has something to query
                                rule: has(self.query) || (has(self.metricNames) &&
                                  size(self.metricNames) > 0)
                            target:
                              description: |-
                                Target specifies the target value for the metric.
                                The autoscaler will scale to maintain this target value.
                              properties:
                                averageUtilization:
                                  description: |-
                                    AverageUtilization is the target value of the average of the resource metric across all relevant pods,
                                    represented as a percentage of the requested value of the resource for the pods.
                                    Used when Type is "Utilization". Only valid for Resource metric source type.
                                    Example: 80 for 80% utilization
                                  format: int32
                                  type: integer
                                averageValue:
                                  description: |-
                                    AverageValue is the target value of the average of the metric across all relevant pods (as a quantity).
                                    Used when Type is "AverageValue".
                                    Example: "100m" for 100 millicores per pod
                                  type: string
                                type:
                                  description: |-
                                    Type specifies how to interpret the metric value.
                                    "Value": absolute value target (use Value field)
                                    "AverageValue": average value across all pods (use AverageValue field)
                                    "Utilization": percentage utilization for resource metrics (use AverageUtilization field)
                                  enum:
                                  - Value
                                  - AverageValue
                                  - Utilization
                                  type: string
                                value:
                                  description: |-
                                    Value is the target value of the metric (as a quantity).
                                    Used when Type is "Value".
                                    Example: "1" for 1 request, "100m" for 100 millicores
                                  type: string
                              required:
                              - type
                              type: object
                              x-kubernetes-validations:
                              - message: target type Value requires target.value
                                rule: self.type != 'Value' || has(self.value)
                              - message: target type AverageValue requires target.averageValue
                                rule: self.type != 'AverageValue' || has(self.averageValue)
                              - message: target type Utilization requires target.averageUtilization
                                rule: self.type != 'Utilization' || has(self.averageUtilization)
                          required:
                          - metric
                          - target
                          type: object
                        type:
                          description: |-
                            Type is the type of metric source.
                            Valid values: "PodMetric" (per-pod custom metrics).
                          enum:
                          - PodMetric
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: metrics entry of type PodMetric must set podmetric
                        rule: self.type != 'PodMetric' || has(self.podmetric)
                    type: array
                  pollingInterval:
                    description: |-
                      PollingInterval is the KEDA polling interval in seconds. Defaults to 5
                      when spec.minReplicas == 0 (so a single request reliably activates the
                      deployment within ~10s); otherwise unset (KEDA default of 30 applies).
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: 'spec.autoScaling must not be empty: set at least one of
                    metrics, pollingInterval, or cooldownPeriod, or omit the autoScaling
                    block to use default scaling'
                  rule: (has(self.metrics) && size(self.metrics) > 0) || has(self.pollingInterval)
                    || has(self.cooldownPeriod)
              cacheModel:
                description: |-
                  DEPRECATED: Use Caching.Mode instead. This field will be removed in a future version.
                  This field is no longer honored by the controller.
                type: boolean
              caching:
                description: |-
                  Caching controls caching behavior for this service.
                  When nil, defaults to Shared mode.
                properties:
                  mode:
                    default: Shared
                    description: |-
                      Mode controls when to use caching.
                      Canonical values:
                      - Shared (default): reuse/create shared cache assets
                      - Dedicated: create service-owned dedicated cache assets

                      Legacy values are accepted and normalized:
                      - Always -> Shared
                      - Auto -> Shared
                      - Never -> Dedicated
                    enum:
                    - Dedicated
                    - Shared
                    - Auto
                    - Always
                    - Never
                    type: string
                type: object
                x-kubernetes-validations:
                - message: caching mode is immutable after creation
                  rule: self == oldSelf
