apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: aimartifacts.aim.eai.amd.com
spec:
  group: aim.eai.amd.com
  names:
    categories:
    - aim
    - all
    kind: AIMArtifact
    listKind: AIMArtifactList
    plural: aimartifacts
    shortNames:
    - aimart
    singular: aimartifact
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      priority: 1
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.mode
      name: Mode
      type: string
    - jsonPath: .status.displaySize
      name: Model Size
      type: string
    - jsonPath: .status.progress.displayPercentage
