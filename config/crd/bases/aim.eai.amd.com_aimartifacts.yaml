                type: string
                x-kubernetes-validations:
                - message: parentArtifact is immutable
                  rule: self == oldSelf
              rank:
                description: Rank is the LoRA rank of the adapter. Optional; only
                  meaningful when type=adapter.
                format: int32
                minimum: 1
                type: integer
              retentionPriority:
                description: |-
                  RetentionPriority marks this artifact as eligible for automatic eviction
                  when storage quota is exceeded. Lower values are evicted first.
                format: int32
                minimum: 0
                type: integer
              runtimeConfigName:
                description: Name is the name of the runtime config to use for this
                  resource.
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                description: Size specifies the size of the cache volume
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              sourceUri:
                description: |-
                  SourceURI specifies the source location of the model to download.
                  Supported protocols: hf:// (HuggingFace) and s3:// (S3-compatible storage).
                  This field uniquely identifies the artifact and is immutable after creation.
                minLength: 1
                pattern: ^(hf|s3)://[^ \t\r\n]+$
                type: string
                x-kubernetes-validations:
                - message: sourceUri is immutable
                  rule: self == oldSelf
              storageClassName:
                description: |-
                  StorageClassName specifies the storage class for the cache volume.
                  When not specified, uses the cluster default storage class.
                type: string
              type:
                default: model
                description: |-
                  Type discriminates a base model artifact (`model`) from a LoRA adapter
                  definition (`adapter`). Defaults to `model`; immutable after creation.
                enum:
                - model
                - adapter
                type: string
            required:
            - sourceUri
            type: object
          status:
            description: AIMArtifactStatus defines the observed state of AIMArtifact
            properties:
              adapterPath:
                description: |-
                  AdapterPath is the resolved on-disk directory name for a type=adapter artifact,
                  frozen at first resolution (defaults to metadata.name). This is the canonical
                  copy, mirrored into consuming services' status.
                type: string
              adapterPersistentVolumeClaim:
                description: |-
                  AdapterPersistentVolumeClaim is the name of the shared adapter disk PVC
                  provisioned for a type=model artifact that declares an adapterDisk. Empty
                  otherwise.
                type: string
              allocatedSize:
                anyOf:
                - type: integer
                - type: string
                description: AllocatedSize is the actual PVC size requested (including
                  headroom).
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              conditions:
                description: Conditions represent the latest available observations
                  of the artifact's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discoveredSizeBytes:
                description: |-
                  DiscoveredSizeBytes is the model size discovered via check-size job.
                  Populated when spec.size is not provided.
                format: int64
                type: integer
              displaySize:
                description: DisplaySize is the human-readable effective size (spec
                  or discovered)
                type: string
              download:
                description: |-
                  Download represents the current download attempt state, patched by the downloader pod.
                  Shows which protocol is active, what attempt we're on, etc.
                properties:
                  attempt:
                    description: Attempt is the current attempt number (1-based)
                    format: int32
                    type: integer
                  message:
                    description: Message is a human-readable status message from the
                      downloader
                    type: string
                  protocol:
                    description: Protocol is the download protocol currently in use
                      (e.g., "XET", "HF_TRANSFER", "HTTP")
                    type: string
                  protocolSequence:
                    description: ProtocolSequence is the configured protocol sequence
                      (e.g., "HF_TRANSFER,XET")
                    type: string
                  totalAttempts:
                    description: TotalAttempts is the total number of attempts configured
                      via AIM_DOWNLOADER_PROTOCOL
                    format: int32
                    type: integer
                type: object
              headroomPercent:
                description: HeadroomPercent is the headroom percentage that was applied
                  to the PVC size.
                format: int32
                type: integer
              lastUsed:
                description: LastUsed represents the last time a model was deployed
                  that used this cache
                format: date-time
                type: string
              mode:
                description: |-
                  Mode indicates the ownership mode of this artifact, derived from owner references.
                  - Dedicated: Has owner references, will be garbage collected when owners are deleted.
                  - Shared: No owner references, persists independently and can be shared.
                enum:
                - Dedicated
                - Shared
                type: string
              observedGeneration:
                format: int64
                type: integer
              parentModelId:
                description: |-
                  ParentModelID is the parent model artifact's modelId, denormalized onto the
                  adapter for convenience (refreshed each reconcile).
                type: string
              persistentVolumeClaim:
                description: PersistentVolumeClaim represents the name of the created
                  PVC
                type: string
              progress:
                description: Progress represents the download progress when Status
                  is Progressing
                properties:
                  displayPercentage:
                    description: |-
                      DisplayPercentage is a human-readable progress string (e.g., "45 %")
                      This field is automatically populated from Progress.Percentage
                    type: string
                  downloadedBytes:
                    description: DownloadedBytes is the number of bytes downloaded
                      so far
                    format: int64
                    type: integer
                  message:
                    description: |-
                      Message is an optional human-readable diagnostic from the progress monitor.
                      Empty during normal progress; cleared once the download completes.
                    type: string
                  percentage:
                    description: Percentage is the download progress as a percentage
                      (0-100)
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  totalBytes:
                    description: TotalBytes is the expected total size of the download
                      in bytes
                    format: int64
                    type: integer
                type: object
              resolvedParent:
                description: |-
                  ResolvedParent captures the resolved parent model artifact for a type=adapter
                  artifact, including its UID.
                properties:
                  kind:
                    description: Kind is the fully-qualified kind of the resolved
                      reference, when known.
                    type: string
                  name:
                    description: Name is the resource name that satisfied the reference.
                    type: string
                  namespace:
                    description: |-
                      Namespace identifies where the resource was found when namespace-scoped.
                      Empty indicates a cluster-scoped resource.
                    type: string
                  scope:
                    description: Scope indicates whether the resolved resource was
                      namespace or cluster scoped.
                    enum:
                    - Namespace
                    - Cluster
                    - Merged
                    - Unknown
                    type: string
                  uid:
                    description: UID captures the unique identifier of the resolved
                      reference, when known.
                    type: string
                type: object
              resolvedSourceUri:
                description: |-
                  DEPRECATED: ResolvedSourceURI was populated when the removed embedded
                  Hugging Face-to-S3 cache rewrote a source URI. It is retained temporarily
                  for API compatibility and is no longer populated.
                type: string
              status:
                default: Pending
                description: Status represents the current status of the artifact
                enum:
                - Pending
                - Progressing
                - Ready
                - Degraded
                - Failed
                - NotAvailable
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec.type is immutable
          optionalOldSelf: true
          rule: '!has(self.spec.type) || !oldSelf.hasValue() || !has(oldSelf.value().spec.type)
            || self.spec.type == oldSelf.value().spec.type'
        - message: exactly one of spec.parentArtifact or spec.compatibleWith is required
            when spec.type is adapter
          rule: '!has(self.spec.type) || self.spec.type != ''adapter'' || ((has(self.spec.parentArtifact)
            && !has(self.spec.compatibleWith)) || (!has(self.spec.parentArtifact)
            && has(self.spec.compatibleWith)))'
        - message: spec.modelId is required when spec.type is adapter
          rule: '!has(self.spec.type) || self.spec.type != ''adapter'' || (has(self.spec.modelId)
            && size(self.spec.modelId) > 0)'
        - message: spec.parentArtifact is only allowed when spec.type is adapter
          rule: '!has(self.spec.parentArtifact) || (has(self.spec.type) && self.spec.type
            == ''adapter'')'
        - message: spec.compatibleWith is only allowed when spec.type is adapter
          rule: '!has(self.spec.compatibleWith) || (has(self.spec.type) && self.spec.type
            == ''adapter'')'
        - message: spec.adapterDisk is only allowed when spec.type is model
          rule: '!has(self.spec.adapterDisk) || !has(self.spec.type) || self.spec.type
            == ''model'''
        - message: spec.rank is only allowed when spec.type is adapter
          rule: '!has(self.spec.rank) || (has(self.spec.type) && self.spec.type ==
            ''adapter'')'
