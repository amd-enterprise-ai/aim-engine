      type: string
    - jsonPath: .status.download.attempt
      name: Attempt
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AIMArtifact is the Schema for the artifacts API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.
            type: string
          metadata:
            type: object
          spec:
            description: AIMArtifactSpec defines the desired state of AIMArtifact
            properties:
              adapterDisk:
                description: |-
                  AdapterDisk, when set on a type=model artifact, provisions a shared ReadWriteMany
                  adapter disk owned by this model artifact and partitioned per consuming service.
                  Only allowed when type=model.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Size is the requested size of the adapter disk PVC.
                      Defaults to 50Gi when unset (a cascade default may override it).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClassName specifies the storage class for the adapter disk.
                      When empty, the cluster default storage class is used.
                      The access mode is fixed at ReadWriteMany by the controller.
                    type: string
                type: object
              compatibleWith:
                description: |-
                  CompatibleWith lists canonical base model IDs this adapter can be mounted
                  with. It is an alternative to parentArtifact: compatibility is checked
                  against the concrete base artifact resolved by each consuming AIMService.
                items:
                  pattern: ^[a-zA-Z0-9_-]+/[a-zA-Z0-9._-]+$
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: compatibleWith is immutable
                  rule: self == oldSelf
              downloadFilter:
                description: |-
                  DownloadFilter controls which files are included or excluded when downloading from HuggingFace.
                  Overrides any filter set in the runtime config's storage.downloadFilter.
                properties:
                  exclude:
                    description: |-
                      Exclude specifies glob patterns for files to skip.
                      Files matching any exclude pattern are removed after include filtering.
                      Patterns use fnmatch syntax (e.g., ["*/*", "*.bin"]).
                    items:
                      type: string
                    type: array
                  include:
                    description: |-
                      Include specifies glob patterns for files to download.
                      Only files matching at least one pattern are considered.
                      If empty, all files pass the include check.
                      Patterns use fnmatch syntax (e.g., ["*.safetensors", "config.json"]).
                    items:
                      type: string
                    type: array
                type: object
                x-kubernetes-validations:
                - message: downloadFilter is immutable
                  rule: self == oldSelf
              env:
                description: Env lists environment variables used when downloading
                  the artifact.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged.
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              imagePullSecrets:
                description: ImagePullSecrets references secrets for pulling AIM container
                  images.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              modelDownloadImage:
                description: |-
                  ModelDownloadImage specifies the container image used to download and
                  initialize the artifact.
                type: string
              modelId:
                description: |-
                  ModelID is the canonical identifier in {org}/{name} format.
                  Determines the cache download path: /workspace/cache/{modelId}
                  For HuggingFace sources, this is typically derived from the URI (e.g., "meta-llama/Llama-3-8B").
                pattern: ^[a-zA-Z0-9_-]+/[a-zA-Z0-9._-]+$
                type: string
              parentArtifact:
                description: |-
                  ParentArtifact names the exact base model AIMArtifact (type=model) this
                  adapter is bound to. It is an alternative to compatibleWith, is only
                  allowed when type=adapter, and is immutable. The adapter is owned by
                  (cascade-deleted with) the named parent.
