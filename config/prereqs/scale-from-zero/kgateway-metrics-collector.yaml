# Cluster-level OpenTelemetry collector that scrapes Envoy admin metrics
# from every kgateway data-plane pod and forwards the request counter
# used by AIMService scale-from-zero activation to keda-otel-scaler.
#
# This is a CLUSTER PREREQUISITE for AIM Engine (alongside KEDA, the
# keda-otel-add-on, the OpenTelemetry Operator, kgateway, and KServe).
# It lives outside the AIM Engine Helm chart because it is cluster-wide
# infrastructure, like kgateway and KEDA themselves.
#
# Edit the locations marked "EDIT FOR YOUR CLUSTER" to match your
# kgateway namespace/labels and keda-otel-add-on namespace, then apply.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kgateway-metrics-collector
  namespace: keda  # EDIT FOR YOUR CLUSTER
  labels:
    app.kubernetes.io/name: aim-scale-from-zero
    app.kubernetes.io/component: gateway-metrics-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kgateway-metrics-collector
  labels:
    app.kubernetes.io/name: aim-scale-from-zero
    app.kubernetes.io/component: gateway-metrics-collector
rules:
  # Prometheus kubernetes_sd_configs needs read access to pods/endpoints
  # across namespaces to discover kgateway data-plane targets.
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kgateway-metrics-collector
  labels:
    app.kubernetes.io/name: aim-scale-from-zero
    app.kubernetes.io/component: gateway-metrics-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kgateway-metrics-collector
subjects:
  - kind: ServiceAccount
    name: kgateway-metrics-collector
    namespace: keda  # EDIT FOR YOUR CLUSTER (must match SA namespace)
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: kgateway-metrics
  namespace: keda  # EDIT FOR YOUR CLUSTER
  labels:
    app.kubernetes.io/name: aim-scale-from-zero
    app.kubernetes.io/component: gateway-metrics-collector
spec:
  mode: deployment
  replicas: 1
  serviceAccount: kgateway-metrics-collector
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: kgateway-envoy
              # 1s keeps the activation signal visible within the
              # controller's 5s polling interval.
              scrape_interval: 1s
              scrape_timeout: 900ms
              metrics_path: /stats/prometheus
              # Filter at the Envoy admin endpoint so each scrape transfers a
              # handful of lines instead of the full /stats/prometheus (~10k
              # lines/pod). NOTE: Envoy's `filter` regex matches the INTERNAL
              # stat name (cluster.<name>.external.upstream_rq_completed), NOT
              # the Prometheus-rendered envoy_cluster_external_upstream_rq_completed
              # -- the latter matches nothing. We use the broad
              # `upstream_rq_completed` substring (resilient to naming) and let
              # the filter/metrics processor below keep the exact series.
              # `usedonly` drops counters never incremented (clusters with no
              # completed request yet) -- exactly the set we don't need.
              params:
                filter:
                  - upstream_rq_completed
                usedonly:
                  - ""
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      # EDIT FOR YOUR CLUSTER if your gateway-name label differs.
                      label: "gateway.networking.k8s.io/gateway-name=kserve-ingress-gateway"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http-monitoring
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: kgateway_namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: kgateway_pod
    processors:
      # Keep only the counter we use for activation; Envoy exposes
      # thousands of metrics per pod.
      filter/metrics:
        metrics:
          include:
            match_type: strict
            metric_names:
              - envoy_cluster_external_upstream_rq_completed
      # Drop Envoy-internal cluster series (admin_port_cluster,
      # prometheus_stats, etc.). The transform below only labels
      # `kube_*` clusters; unlabeled noise series would otherwise be
      # exported and bloat the scaler's per-series store.
      filter/exclude_envoy_internal:
        error_mode: ignore
        metrics:
          datapoint:
            - 'metric.name == "envoy_cluster_external_upstream_rq_completed" and (attributes["envoy_cluster_name"] == nil or not IsMatch(attributes["envoy_cluster_name"], "^kube_"))'
      # Parse Envoy's `kube_<ns>_<svc>_<port>` cluster name into
      # namespace/deployment attributes the trigger query selects on.
      transform/cluster_labels:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            conditions:
              - 'metric.name == "envoy_cluster_external_upstream_rq_completed"'
              - 'attributes["envoy_cluster_name"] != nil'
              - 'IsMatch(attributes["envoy_cluster_name"], "^kube_")'
            statements:
              - 'set(attributes["namespace"], Split(attributes["envoy_cluster_name"], "_")[1])'
              - 'set(attributes["deployment"], Split(attributes["envoy_cluster_name"], "_")[2])'
      # Convert cumulative counters to per-scrape deltas. Envoy's
      # upstream cluster counter resets to 0 when the cluster is
      # evicted (zero endpoints, proxy restart, etc.); with raw
      # cumulatives, keda-otel-scaler's `rate` operator produces
      # negative values on a window straddling the reset. Deltas
      # handle resets natively (drop to 0, never negative), and the
      # scaler-side trigger uses `avg` so 1s scrape * window-average =
      # req/s -- same semantics as the original rate, reset-safe.
      cumulativetodelta:
        include:
          metrics:
            - envoy_cluster_external_upstream_rq_completed
          match_type: strict
      batch:
        send_batch_size: 1024
        timeout: 1s
    exporters:
      otlp:
        # EDIT FOR YOUR CLUSTER if keda-otel-scaler runs elsewhere.
        endpoint: keda-otel-scaler.keda.svc:4317
        compression: none
        tls:
          insecure: true
      debug:
        verbosity: basic
        sampling_initial: 2
        sampling_thereafter: 200
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [filter/metrics, filter/exclude_envoy_internal, transform/cluster_labels, cumulativetodelta, batch]
          exporters: [otlp, debug]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
