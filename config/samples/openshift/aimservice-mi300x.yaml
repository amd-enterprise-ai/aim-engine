apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterModel
metadata:
  name: qwen3-32b-mi300x
spec:
  image: amdenterpriseai/aim-qwen-qwen3-32b:0.11.1
---
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: qwen3-32b-chat
  namespace: aim-models
spec:
  model:
    name: qwen3-32b-mi300x
  profile:
    selector:
      acceleratorModel: MI300X
      acceleratorCount: 1
      metric: latency
      precision: fp8
