# OpenTelemetry collector that receives route-specific delta counters pushed by
# Envoy Gateway and forwards them to keda-otel-scaler. Configure the
# platform-owned EnvoyProxy metrics sink to send OTLP/gRPC to
# envoy-gateway-metrics-collector.keda.svc:4317 with
# reportCountersAsDeltas: true.
#
# This is a cluster prerequisite alongside KEDA, keda-otel-add-on, the
# OpenTelemetry Operator, Envoy Gateway, and KServe.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-gateway-metrics-collector
  namespace: keda  # EDIT FOR YOUR CLUSTER
  labels:
    app.kubernetes.io/name: aim-scale-from-zero
    app.kubernetes.io/component: gateway-metrics-collector
automountServiceAccountToken: false
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: envoy-gateway-metrics
  namespace: keda  # EDIT FOR YOUR CLUSTER
  labels:
    app.kubernetes.io/name: aim-scale-from-zero
    app.kubernetes.io/component: gateway-metrics-collector
spec:
  mode: deployment
  replicas: 1
  serviceAccount: envoy-gateway-metrics-collector
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      # Envoy's OTLP sink sends proxy metrics using their native dotted names.
      # Forward only the shared Lua extension's route counters.
      filter/metrics:
        metrics:
          include:
            match_type: regexp
            metric_names:
              - ^http\.lua\.aim_activation_requests\..*
      # Preserve the controller's existing Prometheus-style query contract:
      #   http.lua.aim_activation_requests.n3.foo.r3.bar
      # becomes:
      #   envoy_http_lua_aim_activation_requests_n3_foo_r3_bar
      transform/metric-name:
        error_mode: propagate
        metric_statements:
          - context: metric
            statements:
              - 'replace_pattern(metric.name, "^http\\.lua\\.aim_activation_requests\\.", "envoy_http_lua_aim_activation_requests_")'
              - 'replace_pattern(metric.name, "\\.", "_") where IsMatch(metric.name, "^envoy_http_lua_aim_activation_requests_")'
      batch:
        send_batch_size: 1024
        timeout: 1s
    exporters:
      otlp:
        # EDIT FOR YOUR CLUSTER if keda-otel-scaler runs elsewhere.
        endpoint: keda-otel-scaler.keda.svc:4317
        compression: none
        tls:
          insecure: true
      debug:
        verbosity: basic
        sampling_initial: 2
        sampling_thereafter: 200
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [filter/metrics, transform/metric-name, batch]
          exporters: [otlp, debug]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
