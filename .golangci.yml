version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
  - copyloopvar
  - dupl
  - ginkgolinter
  - goconst
  - gocyclo
  - goheader
  - lll
  - misspell
  - nakedret
  - unconvert
  - unparam
  settings:
    goheader:
      values:
        regexp:
          COPYRIGHT_YEAR: '20[0-9]{2}'
      # Keep lint placeholders out of the literal license used by SVG generation.
      template-path: .goheader-template
    lll:
      line-length: 500
  exclusions:
    generated: lax
    rules:
    - linters:
      - lll
      path: apis/*
    - linters:
      - dupl
      - lll
      path: internal/*
    paths:
    - python
    - third_party$
    - builtin$
    - examples$
issues:
  fix: true
formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    goimports:
      local-prefixes:
      - github.com/amd-enterprise-ai/aim-engine
  exclusions:
    generated: lax
    paths:
    - python
    - third_party$
    - builtin$
    - examples$
